# SonarQube Cloud project configuration.
#
# Advisory analysis only: it never outranks the specifications, the project
# rules, or the local gates, and it gates no merge
# (.claude/rules/ai-code-review.md). The quality gate is the built-in
# "Sonar way" default.
#
# The repository is in its design phase, so what the analyzer sees today is the
# multi-language sweep over shell, YAML, JSON, and markdown-adjacent config.
# The Rust settings below are in place before the workspace lands and start
# reporting the moment it does.

sonar.projectKey=rubentalstra_FerroFED
sonar.organization=rubentalstra
sonar.projectName=FerroFED
sonar.sourceEncoding=UTF-8

# Scope: analyze the tree, minus build output and any vendored input. A
# vendored tree is bytes a publisher owns and a fetch script reproduces
# (.claude/rules/vendored-inputs.md), so a finding on one is noise nobody may
# act on in place. The reference implementation under docs/specs/ is Java
# evidence, never code of this project.
sonar.sources=.
sonar.exclusions=**/target/**,**/vendor/**,docs/specs/**,**/node_modules/**

# Rust coverage, imported from the instrumented nextest run that
# .github/workflows/sonar.yml writes once a root Cargo.toml exists. An absent
# file is reported as a warning by the scanner, so this line is safe before the
# workspace lands.
sonar.rust.lcov.reportPaths=lcov.info

# sonar.projectVersion is appended by the workflow at scan time from the
# workspace version, never kept as a second hand-maintained copy here.
