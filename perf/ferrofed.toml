# The gateway the performance gate measures (scripts/perf/gate.sh): the
# quickstart's gateway (docker/quickstart/ferrofed.toml) run from the release
# build on the host, over the quickstart's four FerroEHR nodes and FerroPIX,
# with FerroFED's own PostgreSQL store under the stored-query registry, so the
# store's sweep and its migrations run as a deployment runs them. Every path
# is relative to the repository root, under the gate's work directory,
# target/perf-run, where the gate writes the registry document, the store's
# connection string and CA, and the key sets of both issuers. The gate runs
# the gateway of this tree from this file, with its listener, key set URL,
# public URL, DPoP URL and store connection string set through the
# `FERROFED__` overrides of perf/arm.env beside it; the other arm of a change
# runs from its own tree's pair. Beside the quickstart's development
# issuer it trusts a synthetic national contact point whose tokens are bound
# to a DPoP key (RFC 9449), with the FHIR face its patient summary is asked
# on and the emergency access limit its professionals are held to (#1702),
# and it reaches node A through an onward lane at the gate's token endpoint
# (#1712). No specification governs this: our own design.

profile = "development"

[server]
listen = "127.0.0.1:8080"
drain_delay = "0ms"

[gateway]
bindings_drain_timeout = "5s"
public_url = "http://127.0.0.1:8080"

[registry]
document = "target/perf-run/registry.toml"

[federation]
id = "perf"
per_node_timeout = "10s"
overall_timeout = "25s"
node_selection = "ask-all"

[auth]

[[auth.issuer]]
issuer = "https://quickstart-issuer.ferrofed.invalid"
kind = "persons"
audience = ["ferrofed-quickstart"]
first_party_clients = ["quickstart-client"]
jwks_file = "docker/quickstart/issuer/jwks.json"

# The synthetic national contact point, its key set written by the gate. Its
# constants follow tools/ferrofed-testkit/src/national_connector.rs.
[[auth.issuer]]
issuer = "https://perf-ncp.ferrofed.invalid"
kind = "federation"
audience = ["ferrofed-perf"]
jwks_file = "target/perf-run/ncp-jwks.json"
sender_constraint = "required"

[[auth.federation]]
issuer = "https://perf-ncp.ferrofed.invalid"
contact_point = true
mapping = "ehdsi"
countries = ["LU"]
fields."professional.country_code" = [{ constant = "LU" }]
fields."professional.issuing_authority_name" = [{ constant = "Qz9-ncp-hp-authority" }]
fields."provider.issuing_authority_name" = [{ constant = "Qz9-ncp-hcp-authority" }]

[auth.dpop]
external_url = "http://127.0.0.1:8080"

[[federation.contact_point]]
issuer = "https://perf-ncp.ferrofed.invalid"
correlation_header = "ncp-correlation-id"

# The eHDSI EMERGENCY purpose (SAML Profile 10.0.0 §2.3). The load sends one
# professional at a fixed rate, so the window is one second: five accesses a
# second keep the group admitted. No [audit] is set, so the existing groups
# do the base's work; the gateway counts in the store without it once #1737
# lands.
[[access_log.emergency_purpose]]
system = "urn:uuid:3bc18518-d305-46c2-a8d6-94bd59856e9e"
code = "EMERGENCY"

[emergency]
threshold = 5
window = "1s"

# The FHIR face the contact point asks for the patient summary, its header
# read from FerroPIX's PDQm Supplier (ITI-78) with the PIXm Consumer's
# development credential. The face needs one mapping, so it takes the test
# kit's synthetic allergy mapping; the seeded compositions are of another
# template, so the summary counts them in its narrative.
[fhir]
base = "/fhir"

[[fhir.mapping]]
section = "allergies-and-intolerances"
template = "tools/ferrofed-testkit/fixtures/eehrxf/opt/allergy.opt"
files = [
  "tools/ferrofed-testkit/fixtures/eehrxf/mapping/ferrofed_allergy.yml",
  "tools/ferrofed-testkit/fixtures/eehrxf/mapping/eu_allergy.context.yml",
]
context = "ferrofed_eu_allergy.context"

[fhir.operator]
name = "FerroFED performance gate"
identifier_system = "urn:oid:2.999.9"
identifier_value = "perf-operator"

[pdqm]
url = "http://127.0.0.1:8090/fhir/"
transaction = "iti-78"
master = "urn:oid:2.999.1.1"
timeout = "5s"

[pdqm.namespaces]
"urn:oid:2.999.7" = "urn:oid:2.999.7"

[pdqm.credentials]
user = "ferrofed"
password = "ferrofed-consumer-example"

[signing]
key_file = "docker/quickstart/signing/signing-key.pem"
jwks_uri = "http://127.0.0.1:8080/.well-known/jwks.json"

# Node A is reached through its onward lane (#1712): each caller's token is
# exchanged at the gate's token endpoint (ferrofed-perf-token) for one of the
# issuer perf/ferroehr-onward.toml trusts, and the gateway's own requests
# take the client-credentials token. The gate counts the exchanges, and runs
# this lane again with `cache = false`, which it must fail.
[credentials."node-a-query".credentials.oauth]
token_endpoint = "http://127.0.0.1:8095/token"
client_id = "ferrofed-perf"
client_auth = "private_key_jwt"
private_key_file = "target/perf-run/onward-client.pem"
scope = "system/aql-*.s"

[credentials."node-a-query".credentials.onward]
issuer = "https://quickstart-issuer.ferrofed.invalid"
kind = "persons"
profile = "rfc9068"
token_endpoint = "http://127.0.0.1:8095/token"
audiences = ["https://node-a.perf.ferrofed.invalid"]
indicators = ["https://node-a.perf.ferrofed.invalid"]

[credentials."node-a-query".credentials.onward.keys]
max_onward_lifetime = "1h"

[credentials."node-b-query".credentials]
user = "ferroehr"
password = "ferroehr"

[credentials."node-c-query".credentials]
user = "ferroehr"
password = "ferroehr"

[credentials."node-d-query".credentials]
user = "ferroehr"
password = "ferroehr"

[[pixm.manager]]
url = "http://127.0.0.1:8090/fhir/"

[pixm.manager.members]
"node-a" = "urn:oid:2.999.2.1"
"node-b" = "urn:oid:2.999.2.2"
"node-c" = "urn:oid:2.999.2.3"
"node-d" = "urn:oid:2.999.2.4"

[pixm.manager.credentials]
user = "ferrofed"
password = "ferrofed-consumer-example"

[stored_queries]
backend = "postgres"

[store]
url_file = "target/perf-run/head/store-url"
ca_file = "target/perf-run/store-ca.pem"
