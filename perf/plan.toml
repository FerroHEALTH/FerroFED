# The plan of the performance gate (ferrohealth-perf, FerroHEALTH/FerroSYS
# #249), run by scripts/perf/gate.sh in the tool's A/B mode against the base
# and the head of a change, each the gateway of its perf/ferrofed.toml over
# the quickstart's four seeded FerroEHR nodes and FerroPIX. The idle phase
# runs the head's store sweep, the identity bindings' expiry and every other
# background worker with nothing to do; the load phase sends the gateway's
# hot paths to each gateway in turn with the quickstart's development token,
# which the gate puts in place of {token}. A contact point's routes are not
# in the set yet (#1702). No specification governs this: our own design.

[idle]
duration_secs = 60
max_cpu_percent = 2.0
# The store's sweep runs once every 60 s, a transaction or two; the gate
# itself adds at most two per phase.
max_transactions_per_second = 1.0

[load]
rate = 20.0
warmup_secs = 10
duration_secs = 60

# How far the head may stray from the base, beyond the noise the two arms
# show: the family's tolerances (FerroHEALTH/FerroSYS#249).
[tolerance]
latency = 0.25
throughput = 0.2
memory = 0.2
cpu = 0.25
transactions = 0.1

# The self-description, OPTIONS {base}/ (§7a.2).
[[requests]]
group = "self-description"
method = "OPTIONS"
path = "/"
status = 200
headers = { authorization = "Bearer {token}" }

# A patient's federated query: the identity binding resolves ffd-test-0001
# at FerroPIX and every node is asked by its own ehr_id (§5, §9).
[[requests]]
group = "patient-query"
method = "POST"
path = "/v1/query/aql"
status = 200
body = "{\"q\": \"SELECT c/uid/value FROM EHR e CONTAINS COMPOSITION c WHERE e/ehr_status/subject/external_ref/id/value = 'ffd-test-0001' AND e/ehr_status/subject/external_ref/namespace = 'urn:oid:2.999.1.1'\"}"
headers = { authorization = "Bearer {token}", content-type = "application/json" }

# A population query fanned out to every node and merged (§11).
[[requests]]
group = "population-query"
method = "POST"
path = "/v1/query/aql"
status = 200
body = '{"q": "SELECT c/uid/value FROM EHR e CONTAINS COMPOSITION c LIMIT 10"}'
headers = { authorization = "Bearer {token}", content-type = "application/json" }

# A stored query run by name from the registry over the store (§12.7).
[[requests]]
group = "stored-query-run"
method = "POST"
path = "/v1/query/eu.ferrofed.eehrxf::patient-summary-problems"
status = 200
body = '{"query_parameters": {"patient": "ffd-test-0001", "namespace": "urn:oid:2.999.1.1"}}'
headers = { authorization = "Bearer {token}", content-type = "application/json" }

# A definition read routed by the registry to the one member it names (§12.6).
[[requests]]
group = "definition-read"
method = "GET"
path = "/v1/definition/template/adl1.4"
status = 200
headers = { authorization = "Bearer {token}", openEHR-federation-endpoint = "node-a-query" }
