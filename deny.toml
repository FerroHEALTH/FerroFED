# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. cargo deny check advisories reads the same
# RustSec database cargo audit does and adds yanked, licenses, bans and
# sources, so there is no separate cargo-audit job.

# Every feature of every member is in the graph, so a dependency behind a
# feature no member enables yet is checked as an upload or a later member
# would bring it in
# (https://embarkstudios.github.io/cargo-deny/checks/cfg.html#the-graph-field-optional).
[graph]
all-features = true

[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly, dated, and each
# naming the event that deletes it.
yanked = "deny"
ignore = [
  # 2026-11-05 (#1609): astral-tokio-tar is unmaintained in every version,
  # and testcontainers is its one carrier: 0.28.0, the newest release, needs
  # ^0.6.1 and its main branch has moved to 0.7.0. The path argument is the
  # RUSTSEC-2026-0440 statement in security/vex/rust-advisories.toml.
  # DELETING EVENT: a testcontainers release that no longer depends on
  # astral-tokio-tar.
  # https://rustsec.org/advisories/RUSTSEC-2026-0440
  { id = "RUSTSEC-2026-0440", reason = "reached only through testcontainers in the ferrofed-testkit test harness, which no shipped artefact links" },
]

[licenses]
version = 2
# cargo-deny leaves dev-dependencies out of the licence check by default, on
# the ground that they reach no downstream crate and no binary. They are
# compiled here and in CI, so the check covers them
# (https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html).
include-dev = true
# Permissive licences a BUSL-1.1 project can depend on (and that its Apache 2.0
# Change License admits). Copyleft is not allowed by default; a weak-copyleft
# dependency gets a crate-scoped exceptions entry with its reason.
#
# A licence joins the list the day a dependency needs it, with the reason it is
# acceptable here, and leaves when the last crate carrying it does, so cargo
# deny reports no unencountered licence.
allow = [
  # The server's HTTP, configuration and console stack (#29): the permissive
  # pair almost every crate in it carries, alone or as a choice.
  "MIT",
  "Apache-2.0",
  # The Unicode data tables under the URL and identifier crates.
  "Unicode-3.0",
  # One crate in the stack pairs MIT with BSD-3-Clause.
  "BSD-3-Clause",
  # The test harness (#39): rustls, rustls-webpki and ring under the Docker
  # client testcontainers drives. ISC is the permissive MIT-equivalent the
  # OSI lists.
  "ISC",
  # The wire types' schema validation (#33): borrow-or-share under jsonschema
  # (MIT-0, MIT with the attribution clause removed) and foldhash under its
  # hash maps (Zlib). Both are OSI-listed permissive licences.
  "MIT-0",
  "Zlib",
]
confidence-threshold = 0.9
# The project's own crates are BUSL-1.1 (LICENSE), and so are ihe-atna and
# ehds-logging, the family's audit library (FerroHEALTH/FerroAUDIT). The
# openEHR model crates join this list as each is first depended on:
# openehr-query and openehr-its are Apache-2.0, and openehr-term,
# under openehr-rm, is Apache-2.0 with the CC-BY-SA-3.0 terminology data it
# redistributes; openehr-sdt is BUSL-1.1.
exceptions = [
  { allow = ["BUSL-1.1"], crate = "openehr-federation" },
  { allow = ["BUSL-1.1"], crate = "ihe-iti" },
  { allow = ["BUSL-1.1"], crate = "nl-generic-functions" },
  { allow = ["BUSL-1.1"], crate = "ehds-logging" },
  { allow = ["BUSL-1.1"], crate = "ihe-atna" },
  # The interoperability component, published from FerroHEALTH/FerroBRIDGE
  # (#813).
  { allow = ["BUSL-1.1"], crate = "eehrxf" },
  # The ADL parser and OPT2 builder of the openEHR family, under the licence of
  # the project's own code: a map-mode member's ADL 2 template is built with it
  # (#1560).
  { allow = ["BUSL-1.1"], crate = "openehr-adl" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-registry" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-operator-api" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-identity" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-engine" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-eehrxf" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-server" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-testkit" },
  { allow = ["BUSL-1.1"], crate = "forwarders" },
  { allow = ["BUSL-1.1"], crate = "module-cycles" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-console" },
  # The operator console's components and stylesheet (#1146): the FerroHEALTH
  # console library, under the licence of the project's own code.
  { allow = ["BUSL-1.1"], crate = "ferrohealth-ui" },
  # The SMART and OAuth 2.0 resource-server crate client authentication, the
  # SMART on openEHR grants and the gateway's own OAuth 2.0 clients run on
  # (#1174), under the licence of the project's own code.
  { allow = ["BUSL-1.1"], crate = "ferrohealth-smart" },
  # The family's one secret type and mask, which ferrohealth-smart and
  # ihe-atna render every credential through (#1390).
  { allow = ["BUSL-1.1"], crate = "ferrohealth-secret" },
  # The operator console's sign-in and session (#1504), under the licence of
  # the project's own code.
  { allow = ["BUSL-1.1"], crate = "ferrohealth-session" },
  # The family's configuration loader (#1408), server plumbing, health family
  # and telemetry of FerroHEALTH/FerroSYS (#1397), under the licence of the
  # project's own code.
  { allow = ["BUSL-1.1"], crate = "ferrohealth-config" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-health" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-server" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-telemetry" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-usage-report" },
  # The SMART on openEHR scope grammar the onward grant requests with (#81)
  # and every caller's scopes are read with (#80).
  { allow = ["BUSL-1.1"], crate = "openehr-sdt" },
  # FerroBRIDGE's FHIRconnect engine and the template index and loader it
  # takes, behind eehrxf's openehr feature (#684, #730).
  { allow = ["BUSL-1.1"], crate = "fhirconnect" },
  { allow = ["BUSL-1.1"], crate = "openehr-mapping-core" },
  # FerroBRIDGE's FHIR terminology client the component asks its terminology
  # server through (#925).
  { allow = ["BUSL-1.1"], crate = "ferrobridge-term" },
  # FerroBRIDGE's FHIR R4 profile validator a received document is validated
  # in full by, and the FHIRPath evaluator it evaluates invariants with (#808).
  { allow = ["BUSL-1.1"], crate = "ferrobridge-validator" },
  { allow = ["BUSL-1.1"], crate = "ferrobridge-fhirpath" },
  # The openEHR terminology data openehr-term redistributes (through
  # openehr-its's json layer) is CC-BY-SA-3.0; the crate's code is Apache-2.0.
  # The share-alike terms cover that data, which FerroFED redistributes
  # unmodified inside the dependency and never alters.
  { allow = ["Apache-2.0", "CC-BY-SA-3.0"], crate = "openehr-term" },
  # A build-time archive writer in a toolchain-facing tree; the LLVM
  # exception only widens Apache-2.0.
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ar_archive_writer" },
  # The Mozilla CA root data the node client's TLS verifier ships
  # (openehr-its rest-client through rustls-platform-verifier, #34); a data
  # licence over certificates, allowed for that crate alone.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-only deps carry an implicit "*" version, which never reaches a
# registry. External wildcards stay denied.
allow-wildcard-paths = true
deny = []
# Each entry names a duplicate inherent to the pinned set, with its reason; the
# list starts empty and grows only from `cargo deny check bans` output.
skip = [
  # syn 3 sits under clap_derive and serde_derive, syn 2 under
  # tracing-attributes; both are proc-macro build dependencies, so neither
  # reaches the binary. Deleted when tracing-attributes moves to syn 3.
  { crate = "syn@2", reason = "tracing-attributes still builds on syn 2" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
