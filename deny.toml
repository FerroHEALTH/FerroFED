# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. cargo deny check advisories reads the same
# RustSec database cargo audit does and adds yanked, licenses, bans and
# sources, so there is no separate cargo-audit job.

[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly, dated, and each
# naming the event that deletes it.
yanked = "deny"
ignore = []

[licenses]
version = 2
# cargo-deny leaves dev-dependencies out of the licence check by default, on
# the ground that they reach no downstream crate and no binary. They are
# compiled here and in CI, so the check covers them
# (https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html).
include-dev = true
# Permissive licences a BUSL-1.1 project can depend on (and that its Apache 2.0
# Change License admits). Copyleft is not allowed by default; a weak-copyleft
# dependency gets a crate-scoped exceptions entry with its reason.
#
# A licence joins the list the day a dependency needs it, with the reason it is
# acceptable here, and leaves when the last crate carrying it does, so cargo
# deny reports no unencountered licence.
allow = [
  # The server's HTTP, configuration and console stack (#29): the permissive
  # pair almost every crate in it carries, alone or as a choice.
  "MIT",
  "Apache-2.0",
  # The Unicode data tables under the URL and identifier crates.
  "Unicode-3.0",
  # One crate in the stack pairs MIT with BSD-3-Clause.
  "BSD-3-Clause",
  # The test harness (#39): rustls, rustls-webpki and ring under the Docker
  # client testcontainers drives. ISC is the permissive MIT-equivalent the
  # OSI lists.
  "ISC",
  # The wire types' schema validation (#33): borrow-or-share under jsonschema
  # (MIT-0, MIT with the attribution clause removed) and foldhash under its
  # hash maps (Zlib). Both are OSI-listed permissive licences.
  "MIT-0",
  "Zlib",
]
confidence-threshold = 0.9
# The project's own crates are BUSL-1.1 (LICENSE). The openEHR model crates
# join this list as each is first depended on: openehr-query is BUSL-1.1,
# openehr-its is Apache-2.0, and openehr-term, under openehr-rm, is Apache-2.0
# with the CC-BY-SA-3.0 terminology data it redistributes; openehr-sdt is
# BUSL-1.1.
exceptions = [
  { allow = ["BUSL-1.1"], crate = "openehr-federation" },
  { allow = ["BUSL-1.1"], crate = "ihe-iti" },
  { allow = ["BUSL-1.1"], crate = "nl-generic-functions" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-registry" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-identity" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-engine" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-server" },
  { allow = ["BUSL-1.1"], crate = "ferrofed-testkit" },
  # The AQL front end the federated query parses and prints with (#38).
  { allow = ["BUSL-1.1"], crate = "openehr-query" },
  # The SMART on openEHR scope grammar the onward grant requests with (#81).
  { allow = ["BUSL-1.1"], crate = "openehr-sdt" },
  # The openEHR terminology data openehr-term redistributes (through
  # openehr-its's json layer) is CC-BY-SA-3.0; the crate's code is Apache-2.0.
  # The share-alike terms cover that data, which FerroFED redistributes
  # unmodified inside the dependency and never alters.
  { allow = ["Apache-2.0", "CC-BY-SA-3.0"], crate = "openehr-term" },
  # A build-time archive writer in a toolchain-facing tree; the LLVM
  # exception only widens Apache-2.0.
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ar_archive_writer" },
  # The Mozilla CA root data the node client's TLS verifier ships
  # (openehr-its rest-client through rustls-platform-verifier, #34); a data
  # licence over certificates, allowed for that crate alone.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-only deps carry an implicit "*" version, which never reaches a
# registry. External wildcards stay denied.
allow-wildcard-paths = true
deny = []
# Each entry names a duplicate inherent to the pinned set, with its reason; the
# list starts empty and grows only from `cargo deny check bans` output.
skip = [
  # syn 3 sits under clap_derive and serde_derive, syn 2 under
  # tracing-attributes; both are proc-macro build dependencies, so neither
  # reaches the binary. Deleted when tracing-attributes moves to syn 3.
  { crate = "syn@2", reason = "tracing-attributes still builds on syn 2" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
