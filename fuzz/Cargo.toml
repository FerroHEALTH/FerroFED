[package]
name = "ferrofed-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "BUSL-1.1"

# The crate is OUTSIDE the workspace (the root manifest excludes it):
# cargo-fuzz builds with sanitizer flags that need a nightly toolchain, and the
# product stays on the pinned stable one (#134). It keeps its own lockfile.
[package.metadata]
cargo-fuzz = true

# Its own workspace root, so cargo never walks up into an enclosing one.
[workspace]

# Only what the targets reach, because cargo-fuzz instruments every crate in
# the build with AddressSanitizer (#482). The gateway's request intake is
# compiled from its own source file in `adhoc_query`, which needs `thiserror`
# beside the crates below, so the rest of the server stays out of the build.
[dependencies]
libfuzzer-sys = "0.4.13"
openehr-base = "0.0.83"
openehr-federation = { path = "../crates/openehr-federation", default-features = false, features = ["aql"] }
openehr-its = { version = "0.0.83", default-features = false, features = ["rest"] }
openehr-query = "0.0.83"
serde_json = "1"
thiserror = "2.0.21"

[[bin]]
name = "aql_rewrite"
path = "fuzz_targets/aql_rewrite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "adhoc_query"
path = "fuzz_targets/adhoc_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "result_set_meta"
path = "fuzz_targets/result_set_meta.rs"
test = false
doc = false
bench = false

[[bin]]
name = "options_root"
path = "fuzz_targets/options_root.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
