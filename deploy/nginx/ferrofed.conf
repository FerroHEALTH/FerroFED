#
# FerroFED behind nginx: nginx terminates TLS on the public address and
# passes each route the network may reach to the gateway on the loopback
# interface of the same host or pod. Copy this file into /etc/nginx/conf.d/,
# which the stock nginx.conf includes inside its http block.
#
# It pairs with these settings of ferrofed.toml:
#
#   [server]
#   listen = "127.0.0.1:8080"   # the upstream below
#   base_path = "/fed"          # every location below starts with it
#
#   [signing]
#   jwks_uri = "https://gateway.example.org/fed/.well-known/jwks.json"
#
#   [pmir]
#   callback_url = "https://gateway.example.org/fed/pmir/feed"
#
# The production guide walks it through:
# https://ferrofed.eu/docs/operate/production.html#8-tls-and-the-public-address
# scripts/checks/production-guide.sh runs it in front of a gateway and checks
# every route below. Replace every value marked EDIT; gateway.example.org is a
# placeholder.

# The access log names the gateway's request id and never the request line:
# the GET form of a query and a read by subject carry the patient identifier
# in the query string, and a routed path carries an ehr_id. The request id
# finds the gateway's own log line for the request.
log_format ferrofed '$time_iso8601 $remote_addr $request_method $status '
                    '$request_time $upstream_response_time '
                    'request_id=$upstream_http_x_request_id';

upstream ferrofed {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    # No plain-HTTP listener: a client that sends a bearer token over http
    # has already exposed it, and a redirect would not take it back.
    listen 443 ssl;
    server_name gateway.example.org;   # EDIT

    ssl_certificate     /etc/nginx/tls/gateway.example.org.crt;   # EDIT
    ssl_certificate_key /etc/nginx/tls/gateway.example.org.key;   # EDIT
    # TLS 1.2 and 1.3, with the ECDHE AES-GCM suites of RFC 9325 (BCP 195)
    # section 4.2 for TLS 1.2.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # RFC 6797: the gateway sends no Strict-Transport-Security of its own.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/ferrofed-access.log ferrofed;

    # Above server.body_limit_bytes (1 MiB), so a body over the gateway's
    # limit gets the gateway's own 413 and error code.
    client_max_body_size 2m;
    # Above server.request_timeout_ms (30 s), so the client gets the
    # gateway's own answer when a query runs to its budget.
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # A proxy_pass with no URI part passes the request URI as the client sent
    # it, so a version uid's "::" and every encoded character reach the
    # gateway unchanged.

    # GET {base}/ (the product) and OPTIONS {base}/ (the self-description):
    # your clients.
    location = /fed {
        proxy_pass http://ferrofed;
    }
    location = /fed/ {
        proxy_pass http://ferrofed;
    }

    # The ITS-REST surface: your clients. The gateway authenticates each one.
    location /fed/v1/ {
        proxy_pass http://ferrofed;
    }

    # The read-only operator surface: the operator console.
    location /fed/operator/ {
        proxy_pass http://ferrofed;
    }

    # The gateway's JWK Set: every node's authorization server and every node
    # that verifies the openEHR-federation-client token fetch it.
    location = /fed/.well-known/jwks.json {
        proxy_pass http://ferrofed;
    }

    # The PMIR feed route: your Patient Identity Registry alone. The gateway
    # checks the feed token; name the Registry's address here as well.
    location = /fed/pmir/feed {
        # allow 192.0.2.10;   # EDIT: the Registry's address
        # deny all;
        proxy_pass http://ferrofed;
    }

    # The health family stays inside: /health/dependencies names every
    # member endpoint and its state. Probe the gateway on its own listener.
    location ^~ /fed/health {
        return 403;
    }

    # Every other path, the root outside the base included.
    location / {
        return 404;
    }
}
