#
# An example configuration for the gateway: the configuration file and the
# registry document, mounted read-only at /etc/ferrofed by statefulset.yaml.
# It holds no secret. Every secret is a key of the ferrofed-secrets Secret,
# which statefulset.yaml mounts at /run/secrets/ferrofed, named here by a
# `_file` key: the signing key below, and for an endpoint that needs
# credentials, the bearer_token_file or password_file of its
# [credentials."<endpoint id>"] section. Make the Secret with, for example:
#
#   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-384 \
#     -out signing-key.pem
#   kubectl create secret generic ferrofed-secrets \
#     --from-file=signing-key.pem
#
# The value itself never goes in a ConfigMap.
# scripts/checks/kubernetes-example.sh runs `ferrofed config check` over this
# configuration with synthetic secrets in CI.
#
# The member URLs are placeholders under example.org: replace them, the
# organisations, the nodes and their system_ids with your own members.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferrofed-config
  labels:
    app.kubernetes.io/name: ferrofed
    app.kubernetes.io/component: gateway
data:
  ferrofed.toml: |
    [server]
    # The address the image binds; the probes and the Service use the port.
    listen = "0.0.0.0:8080"
    request_timeout_ms = 30000
    # On SIGTERM readiness turns 503 at once, and the listener keeps
    # accepting for this long, while the pod leaves the Service's endpoints.
    drain_delay_ms = 5000
    # Then the listener closes, and the requests in flight get this long to
    # finish: at least request_timeout_ms, which config check enforces. The
    # pod's terminationGracePeriodSeconds covers both.
    shutdown_timeout_ms = 30000
    # Past this many requests at once the gateway answers 503 overloaded
    # with Retry-After, before anything reaches a member.
    max_concurrent_requests = 512

    # Each verified caller may send this many requests a second, after a
    # burst; one more is 429 rate-limited with Retry-After.
    [server.caller_rate]
    requests_per_second = 10
    burst = 20

    # The admin listener: GET /metrics for the scraper. It has no
    # authentication of its own, so a remote peer gets GET /metrics alone; its
    # write actions, such as the stored-query distribution, answer a loopback
    # peer only: reach them through kubectl port-forward, or by kubectl exec
    # into a container that shares the pod's network and has an HTTP client,
    # such as an ephemeral one from kubectl debug, since the gateway's image
    # carries no shell. networkpolicy.yaml admits the scraper alone to this
    # port as well.
    [metrics]
    listen = "0.0.0.0:9464"
    allow_remote = true

    [telemetry]
    format = "json"
    filter = "info,hyper=warn,tower=warn,h2=warn"

    [registry]
    document = "/etc/ferrofed/registry.toml"

    [federation]
    id = "example-federation"
    node_selection = "ask-all"
    per_node_timeout_ms = 10000
    overall_timeout_ms = 25000
    # At most this many requests to one member at once; one past it waits
    # for a slot until its per-node deadline, then is time-out.
    max_in_flight_per_node = 64
    # At most this many bytes of one answer from a member; a longer one is
    # dropped unread and the member is node-error.
    max_node_answer_bytes = 16777216

    # Client authentication: every caller presents an RFC 9068 access
    # token from an issuer listed here. A gateway that federates refuses to
    # start without an issuer.
    # https://ferrofed.eu/docs/operate/authentication.html
    [auth]
    # EDIT: the audience your issuers name this gateway by in `aud`.
    audience = "https://gateway.example.org/fed"

    # EDIT: an authorization server your callers get their tokens from,
    # verified by its JWK Set. For RFC 7662 introspection instead, set
    # introspection_endpoint, client_id and client_secret_file, the secret
    # a key of the ferrofed-secrets Secret:
    # client_secret_file = "/run/secrets/ferrofed/introspection-secret"
    [[auth.issuer]]
    issuer = "https://idp.example.org"
    jwks_uri = "https://idp.example.org/jwks"

    # The gateway's ES384 signing key, required with a registry: every
    # request to a node carries the caller's identity signed with it
    # (§13.1, N24). It is the signing-key.pem key of the ferrofed-secrets
    # Secret that statefulset.yaml mounts at /run/secrets/ferrofed.
    # https://ferrofed.eu/docs/operate/configuration.html#signing-keys-and-the-jwk-set
    [signing]
    key_file = "/run/secrets/ferrofed/signing-key.pem"
    # EDIT: the address the nodes fetch the JWK Set from.
    jwks_uri = "https://gateway.example.org/.well-known/jwks.json"

    # Every access to patient data is recorded, with the caller who made it
    # and the patient, at your ATNA Audit Record Repository over the FHIR
    # Feed of ITI-20 (Regulation (EU) 2025/327 Annex II 3.2). Outside the
    # development profile a gateway with a registry refuses to start without
    # it: "log" names no caller and no patient. Each record is stored in the
    # spool first, on the audit-spool volume claim statefulset.yaml gives
    # each replica at /var/lib/ferrofed.
    # https://ferrofed.eu/docs/operate/audit.html#the-access-log
    [audit]
    destination = "repository"

    [audit.repository]
    # EDIT: your Audit Record Repository's FHIR base.
    url = "https://arr.example.org/fhir"
    # EDIT: the gateway's network address each record names.
    hostname = "gateway.example.org"
    spool_dir = "/var/lib/ferrofed/audit-feed-spool"
    # When the repository asks for a client certificate, add it to the
    # ferrofed-secrets Secret:
    # client_identity_file = "/run/secrets/ferrofed/atna-client.pem"
    # trust_roots_file = "/run/secrets/ferrofed/atna-roots.pem"

  registry.toml: |
    [[organisation]]
    id = "org-a"
    name = "Example organisation A"

    [[organisation]]
    id = "org-b"
    name = "Example organisation B"

    [[node]]
    id = "node-a"
    organisation = "org-a"
    system_id = "cdr-a.example.org"

    [[node]]
    id = "node-b"
    organisation = "org-b"
    system_id = "cdr-b.example.org"

    [[endpoint]]
    id = "node-a-query"
    node = "node-a"
    url = "https://cdr-a.example.org/openehr"
    connection_type = "openehr-rest-query"
    managing_organisation = "org-a"

    [[endpoint]]
    id = "node-b-query"
    node = "node-b"
    url = "https://cdr-b.example.org/openehr"
    connection_type = "openehr-rest-query"
    managing_organisation = "org-b"
