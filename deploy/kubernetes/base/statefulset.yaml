#
# An example StatefulSet of the gateway, over the configuration in
# configmap.yaml and the ferrofed-secrets Secret it names, mounted read-only
# at /run/secrets/ferrofed. It is a StatefulSet for one reason: each replica
# keeps its ITI-20 audit spool on a volume claim of its own, which outlives
# the pod (see audit-spool below). The replicas share nothing else, so they
# start and stop in parallel. The probes:
#
#   startup    GET /health/readiness until boot completes; the gateway opens
#              its port only once the registry and its clients are built.
#   liveness   GET /health/liveness, 200 while the process serves; it checks
#              nothing else, so a slow member never restarts the gateway.
#   readiness  GET /health/readiness, 200 while the gateway serves with its
#              own subsystems up, 503 from the moment SIGTERM arrives. No
#              member node and no identity source gates it.
#
# Every path sits under server.base_path; with a base other than /, put it in
# front of each probe path.
#
# The resource figures are a starting point, not a measurement: size them
# from your own load. The image tag is the product version, which
# scripts/checks/versions.sh holds equal to docs/VERSIONS.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ferrofed
  labels:
    app.kubernetes.io/name: ferrofed
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  # The headless Service of admin-service.yaml, which gives each replica's
  # admin listener a name of its own, ferrofed-0.ferrofed-admin, for the
  # operator console and the scraper.
  serviceName: ferrofed-admin
  # No replica waits for another to start or stop.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrofed
      app.kubernetes.io/component: gateway
  # A spool outlives its pod, and its claim outlives the StatefulSet and a
  # scale-down: a claim deleted with records still in it loses them. Delete
  # a claim by hand once its spool is empty.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrofed
        app.kubernetes.io/component: gateway
      # The scrape annotations a Prometheus with the common kubernetes-pods
      # job reads: each replica is scraped on its own admin listener, never
      # through the Service. The job presents the scrape user of
      # configmap.yaml, with basic_auth in its scrape_config. With the
      # Prometheus Operator, a PodMonitor over the metrics port with a
      # basicAuth secret does the same.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # The gateway calls no Kubernetes API.
      automountServiceAccountToken: false
      # Covers the preStop sleep (5 s) below, server.drain_delay_ms (5 s),
      # server.shutdown_timeout_ms (30 s) and server.bindings_drain_timeout_ms
      # (5 s) of configmap.yaml, with 5 s for the export flush, so the kubelet
      # never kills a drain in progress. The grace period counts from the
      # moment the pod is deleted.
      terminationGracePeriodSeconds: 50
      # The replicas spread over zones and nodes where the cluster has them,
      # so losing one zone or one node leaves a replica serving. A cluster
      # with one zone or one node still schedules both.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ferrofed
              app.kubernetes.io/component: gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ferrofed
              app.kubernetes.io/component: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The Secret's files belong to this group, so the gateway can read them,
        # and the audit spool's volume too, so it can write there.
        fsGroup: 65532
        # Changes the volume's ownership only when its root does not match,
        # so a large spool does not slow every start.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferrofed
          image: ghcr.io/ferrohealth/ferrofed:0.0.14
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # The admin listener of [metrics] listen in configmap.yaml, which
            # networkpolicy.yaml opens to the scraper alone.
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: FERROFED_CONFIG
              value: /etc/ferrofed/ferrofed.toml
            # The installation report to FerroPULSE keeps its instance id on
            # the writable volume below; set FERROFED__USAGE_REPORT__ENABLED
            # to "false" to stop it
            # (https://ferrofed.eu/docs/operate/usage-report.html).
            - name: FERROFED__USAGE_REPORT__STATE_DIR
              value: /var/lib/ferrofed/usage-report
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          # Holds SIGTERM for as long as server.drain_delay_ms, while the
          # endpoint controllers and the proxies in front stop sending this
          # pod new requests; the gateway then turns readiness to 503 and
          # drains (https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Ephemeral storage holds the container log alone: the audit spool
          # is on its volume claim.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/ferrofed
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/ferrofed
              readOnly: true
            # The ITI-20 audit spool of [xcpd] audit = "repository", with
            # xcpd.audit_repository.spool_dir = "/var/lib/ferrofed/audit-spool",
            # and of [audit] destination = "repository", with
            # audit.repository.spool_dir = "/var/lib/ferrofed/audit-feed-spool",
            # and the usage report's instance id under usage-report/: the one
            # directory the gateway writes. fsGroup above lets the
            # gateway write the volume, and it creates each spool under it
            # with mode 0700.
            - name: audit-spool
              mountPath: /var/lib/ferrofed
      volumes:
        - name: config
          configMap:
            name: ferrofed-config
        # Every secret configmap.yaml names by a `_file` key, the signing key
        # among them; readable by the owner and the group alone.
        - name: secrets
          secret:
            secretName: ferrofed-secrets
            defaultMode: 0440
  # One claim per replica, audit-spool-ferrofed-0 and so on: two gateways
  # must never drain one spool, and a replica that is rescheduled finds its
  # own spool and delivers what it still holds. The spool holds audit records
  # that name a patient until the repository takes them, so the claim's
  # storage class encrypts at rest. The size holds the default spool bounds
  # (64 MiB in spool_max_bytes, 100000 messages of at least one 4 KiB block
  # each, for each of the two spools) with headroom; raise it with either
  # bound.
  volumeClaimTemplates:
    - metadata:
        name: audit-spool
        labels:
          app.kubernetes.io/name: ferrofed
          app.kubernetes.io/component: gateway
      spec:
        accessModes: ["ReadWriteOnce"]
        # EDIT: a storage class of your cluster that encrypts the volume at
        # rest.
        storageClassName: encrypted
        resources:
          requests:
            storage: 1Gi
