#
# Who may reach the gateway pods. The gateway port takes every client in the
# cluster: client authentication decides who is served. The admin listener,
# the metrics port, answers GET /metrics to a scrape that carries the scrape
# token, and a write action to a caller whose token carries the operator
# scope, so the gateway itself already decides who is served there too. This
# policy is defence in depth over that, and holds only where the cluster's
# network plugin enforces NetworkPolicy: the metrics port takes the Prometheus
# pods of the monitoring namespace alone. Everything else is refused. Egress stays
# open: the gateway reaches its members, its identity services and its
# issuers wherever they are.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferrofed
  labels:
    app.kubernetes.io/name: ferrofed
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ferrofed
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
    - from:
        # EDIT: the namespace and the labels of your Prometheus pods.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: metrics
          protocol: TCP
