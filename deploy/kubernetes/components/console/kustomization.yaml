#
# The operator console beside the gateway: its Deployment over the
# configuration of configmap.yaml and the ferrofed-console-secrets Secret,
# its Service and its NetworkPolicy. The console reaches the gateway's
# Service and each replica's admin listener; the base's NetworkPolicy admits
# it to both. Put it behind console-ingress or console-route.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
