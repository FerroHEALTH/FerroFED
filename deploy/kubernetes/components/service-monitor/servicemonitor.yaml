#
# Each replica is scraped on its own admin listener, with a client-credentials
# token the scrape client of configmap.yaml's scrape_clients obtains at the
# issuer, its client secret from a Secret in this namespace, made with, for
# example:
#
#   kubectl create secret generic ferrofed-scrape \
#     --from-literal=client-id=prometheus \
#     --from-file=client-secret=metrics-scrape-client-secret
#
# (https://ferrofed.eu/docs/operate/metrics.html). The base's
# NetworkPolicy admits the Prometheus pods to the metrics port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ferrofed
  labels:
    app.kubernetes.io/name: ferrofed
    app.kubernetes.io/component: gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrofed
      app.kubernetes.io/component: gateway-admin
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      oauth2:
        clientId:
          secret:
            name: ferrofed-scrape
            key: client-id
        clientSecret:
          name: ferrofed-scrape
          key: client-secret
        tokenUrl: https://idp.example.org/realms/ferrofed/protocol/openid-connect/token   # EDIT
