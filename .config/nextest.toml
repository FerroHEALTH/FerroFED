# The nextest configuration (https://nexte.st/docs/configuration/). A test
# that runs past its slow-timeout period is reported as slow, and one that
# runs past terminate-after periods is killed and fails the run by name, so
# a hang never stalls a run (https://nexte.st/docs/features/slow-tests/).
# No specification governs the limits: our own design.

[profile.default]
# The slowest offline test waits on a 10-second timeout of its own.
slow-timeout = { period = "30s", terminate-after = 2 }

# The differential run (#94) also builds the reference implementation from
# its pinned source with Maven before it runs some thirty steps against two
# gateways, so it gets twenty minutes. The first matching override applies,
# so it sits above the e2e one.
[[profile.default.overrides]]
filter = 'test(/^e2e::differential::/)'
slow-timeout = { period = "60s", terminate-after = 20 }

# A container-backed test pulls images and starts PostgreSQL and two
# FerroEHR nodes, so it gets ten minutes before it is killed. Every such test
# sits in an e2e module (scripts/checks/e2e-placement.sh).
[[profile.default.overrides]]
filter = 'test(/^e2e::/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# A browser journey starts a gateway, a console and a headless Chrome, and
# each of its waits may take twenty seconds, so it gets three minutes. Every
# journey sits in the testkit's journeys module.
[[profile.default.overrides]]
filter = 'test(/^journeys::/)'
slow-timeout = { period = "60s", terminate-after = 3 }

# The CI lanes select this profile. It repeats the default limit, and the
# override above still applies to it. It runs every test past a failure, so
# the conformance report reads an outcome for every marked test.
[profile.ci]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

# The CI profile writes a JUnit report, target/nextest/ci/junit.xml, which
# scripts/conformance/report.sh joins with the conformance markers into the
# per-track and per-point report of section 16.4.
[profile.ci.junit]
path = "junit.xml"
