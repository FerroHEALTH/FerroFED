name: Install the Rust toolchain
description: >-
  Install the toolchain rust-toolchain.toml pins, with the components a job
  asks for. The calling job checks out the repository first: a local action
  path (./.github/actions/setup-rust) resolves only after checkout, so this
  action does not check out. The channel is read from rust-toolchain.toml by
  the wrapped action, so the pin lives in that one file.
inputs:
  components:
    description: Comma-separated toolchain components (rustfmt, clippy), none by default.
    required: false
    default: ""
  target:
    description: Comma-separated target triples to install beside the host's, none by default.
    required: false
    default: ""
  cache:
    description: >-
      Restore and save the Rust build cache, on by default. A publishing lane
      passes "false": a cache an untrusted run could poison must never feed a
      release.
    required: false
    default: "true"
  cache-shared-key:
    description: >-
      A shared cache key, for a lane whose cache is its own rather than the
      job's (the coverage lane uses "sonar"). Empty means the wrapped action's
      default key.
    required: false
    default: ""
  toolchain:
    description: >-
      A toolchain channel that overrides rust-toolchain.toml; empty by default,
      which reads the pinned file. Only the fuzz lane sets it ("nightly"):
      cargo-fuzz needs sanitizer flags stable does not carry, and nothing built
      there ships.
    required: false
    default: ""
  cache-save-if:
    description: >-
      An expression deciding whether the cache is saved after the job; "true"
      by default. The coverage lane saves only from main.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: ${{ inputs.components }}
        target: ${{ inputs.target }}
        toolchain: ${{ inputs.toolchain }}
        cache: ${{ inputs.cache }}
        cache-shared-key: ${{ inputs.cache-shared-key }}
        cache-save-if: ${{ inputs.cache-save-if }}
