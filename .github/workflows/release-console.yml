# The operator console image, as a REUSABLE workflow: the static binaries
# built here, attested, and packed into
# ghcr.io/ferrohealth/ferrofed-console with the same provenance and SBOM
# attestations as the gateway image.
#
# It is a reusable workflow for the reason release-build.yml and
# release-image.yml are: SLSA v1.2 Build Level 3 needs the signing identity
# out of reach of caller-defined steps, and a `workflow_call` job runs on a VM
# a caller cannot add steps to
# (https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3).
#
# Two jobs. `binary` builds the musl server binary with cargo auditable on a
# runner of each architecture and attests what it built; the binary draws
# every page and serves FerroUI's stylesheet, themes and script modules from
# the crate, so the image carries nothing else. `image` verifies both
# binaries against this workflow's signer identity before it stages them, so
# the image provenance chains to attested inputs, then pushes the index, attests
# the index and both platform manifests as OCI referrers, and verifies its own
# output as a consumer would. The console ships as an image alone, so the
# release carries no console asset.
#
# The index is pushed by digest; scan-and-tag.yml tags it once its scan passes.
#
# Verify a published image (the tag resolves to the index):
#   gh attestation verify oci://ghcr.io/ferrohealth/ferrofed-console:<version> \
#     --repo FerroHEALTH/FerroFED \
#     --signer-workflow FerroHEALTH/FerroFED/.github/workflows/release-console.yml
name: Release console (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag being released.
        required: true
        type: string
      version:
        description: The tag without its leading v, which is the image tag.
        required: true
        type: string
      latest:
        description: Whether the image takes the latest tag, false for a pre-release and for a patch on an older line.
        required: true
        type: boolean
    outputs:
      digest:
        description: The digest of the pushed image index.
        value: ${{ jobs.image.outputs.digest }}
      tags:
        description: The newline-separated tags scan-and-tag.yml applies to the digest once its scan passes.
        value: ${{ jobs.image.outputs.tags }}

permissions: {}

env:
  # NOTE: an OCI reference is lowercase and github.repository_owner is FerroHEALTH, so the owner is a literal.
  IMAGE: ghcr.io/ferrohealth/ferrofed-console
  # Annotate the index as well as the manifests: GHCR reads the package
  # description from the index
  # (https://docs.docker.com/build/ci/github-actions/annotations/).
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  binary:
    name: console binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: read
      id-token: write # Sigstore, for the binary's provenance
      attestations: write # store it against this repository
    steps:
      # github.sha in a called workflow is the caller's, the commit the tag
      # points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Cold by construction: a cache an untrusted run could poison must never
      # feed a release.
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache: "false"

      # musl needs its C toolchain for the link step; each target builds on a
      # runner of its own architecture, so there is no cross toolchain.
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      # cargo-auditable embeds the dependency list in the binary, which is
      # what the image SBOM below reads its crates from.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-auditable@0.7.5

      - name: Build the console server
        env:
          TARGET: ${{ matrix.target }}
        run: cargo auditable build --release --locked -p ferrofed-console --bin ferrofed-console --target "$TARGET"

      - name: Stage the binary
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "out/linux_${ARCH}"
          cp "target/${TARGET}/release/ferrofed-console" "out/linux_${ARCH}/ferrofed-console"
          strip "out/linux_${ARCH}/ferrofed-console"

      - name: Attest the binary's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/linux_${{ matrix.arch }}/ferrofed-console

      - name: Hand the binary to the image job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrofed-console-${{ inputs.tag }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  image:
    name: console image (linux/amd64, linux/arm64)
    needs: [binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # the attestations API, to verify the inputs
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the linux/amd64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ferrofed-console-${{ inputs.tag }}-amd64
          path: inputs/
      - name: Download the linux/arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ferrofed-console-${{ inputs.tag }}-arm64
          path: inputs/

      # Refuse any input this workflow did not attest. The staged layout is
      # the one docker/console/Dockerfile copies from, dist/console/.
      - name: Verify the inputs and stage them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/release-console.yml"
          mkdir -p dist/console
          for arch in amd64 arm64; do
            binary="inputs/linux_${arch}/ferrofed-console"
            gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
            mkdir -p "dist/console/linux_${arch}"
            cp "$binary" "dist/console/linux_${arch}/ferrofed-console"
            chmod 0555 "dist/console/linux_${arch}/ferrofed-console"
          done

      # No QEMU: docker/console/Dockerfile runs no command, it only copies what
      # was built for each platform above
      # (https://docs.docker.com/build/building/multi-platform/).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags: the version, for a release that is not a pre-release also its
      # major.minor, which the action's semver rule skips for a pre-release,
      # and latest when the caller says so, which it never does for a
      # pre-release or a security patch on an older line.
      - name: Image tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          flavor: |
            latest=${{ inputs.latest }}
          # These repeat the build-independent set docker/console/Dockerfile
          # carries, so the two never disagree. The two eu.ferrofed document
          # labels name this tag's copies release.yml attaches, so they are
          # set here alone.
          labels: |
            org.opencontainers.image.title=FerroFED Console
            org.opencontainers.image.description=The FerroFED Console: a web client of the gateway's public surface
            org.opencontainers.image.url=https://ferrofed.eu
            org.opencontainers.image.documentation=https://ferrofed.eu/docs/operate/operator-console.html
            org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroFED
            org.opencontainers.image.vendor=Cadasto B.V.
            org.opencontainers.image.authors=Cadasto B.V. <info@cadasto.com>
            eu.ferrofed.manufacturer=Cadasto B.V., Comeniusstraat 2d, 1817 MS Alkmaar, The Netherlands, info@cadasto.com
            eu.ferrofed.information-sheet=https://github.com/FerroHEALTH/FerroFED/releases/download/${{ inputs.tag }}/ferrofed-${{ inputs.tag }}-information-sheet.md
            eu.ferrofed.instructions-for-use=https://github.com/FerroHEALTH/FerroFED/releases/download/${{ inputs.tag }}/ferrofed-${{ inputs.tag }}-instructions-for-use.md
            org.opencontainers.image.licenses=BUSL-1.1
          annotations: |
            org.opencontainers.image.title=FerroFED Console
            org.opencontainers.image.description=The FerroFED Console: a web client of the gateway's public surface
            org.opencontainers.image.url=https://ferrofed.eu
            org.opencontainers.image.documentation=https://ferrofed.eu/docs/operate/operator-console.html
            org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroFED
            org.opencontainers.image.vendor=Cadasto B.V.
            org.opencontainers.image.authors=Cadasto B.V. <info@cadasto.com>
            eu.ferrofed.manufacturer=Cadasto B.V., Comeniusstraat 2d, 1817 MS Alkmaar, The Netherlands, info@cadasto.com
            eu.ferrofed.information-sheet=https://github.com/FerroHEALTH/FerroFED/releases/download/${{ inputs.tag }}/ferrofed-${{ inputs.tag }}-information-sheet.md
            eu.ferrofed.instructions-for-use=https://github.com/FerroHEALTH/FerroFED/releases/download/${{ inputs.tag }}/ferrofed-${{ inputs.tag }}-instructions-for-use.md
            org.opencontainers.image.licenses=BUSL-1.1

      # Cold by construction. BuildKit's own unsigned attestations are off;
      # the GitHub attestations below carry provenance and the SBOMs.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          # By digest, with no tag: scan-and-tag.yml applies the tags below once
          # the image scan passes, so a refused image is never referencable.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Resolve the platform manifests
        id: manifests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          index="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw)"
          amd64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$index")"
          arm64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<< "$index")"
          case "$amd64" in sha256:*) ;; *) echo "::error::no linux/amd64 manifest in ${DIGEST}" >&2; exit 1 ;; esac
          case "$arm64" in sha256:*) ;; *) echo "::error::no linux/arm64 manifest in ${DIGEST}" >&2; exit 1 ;; esac
          {
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"

      # syft reads the dependency list cargo-auditable embedded in the binary,
      # so the SBOM names the crates rather than the files in the image.
      - name: Install syft
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: syft@1.51.1
      - name: Generate one SBOM per platform
        env:
          VERSION: ${{ inputs.version }}
          AMD64: ${{ steps.manifests.outputs.amd64 }}
          ARM64: ${{ steps.manifests.outputs.arm64 }}
        run: |
          set -euo pipefail
          syft scan "registry:${IMAGE}@${AMD64}" --platform linux/amd64 \
            -o "spdx-json=ferrofed-console-${VERSION}-image-amd64.spdx.json"
          syft scan "registry:${IMAGE}@${ARM64}" --platform linux/arm64 \
            -o "spdx-json=ferrofed-console-${VERSION}-image-arm64.spdx.json"
          # A `pkg:cargo/` purl comes only from the `.dep-v0` section
          # cargo-auditable wrote into the binary.
          for f in "ferrofed-console-${VERSION}-image-amd64.spdx.json" "ferrofed-console-${VERSION}-image-arm64.spdx.json"; do
            if ! jq -e '[.packages[].externalRefs[]? | select(.referenceLocator | startswith("pkg:cargo/"))] | length > 0' "$f" > /dev/null; then
              echo "::error::${f} carries no pkg:cargo purl; was the binary built with cargo auditable?" >&2
              exit 1
            fi
          done

      - name: Attest the index provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest the linux/amd64 provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.amd64 }}
          push-to-registry: true
      - name: Attest the linux/amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.amd64 }}
          sbom-path: ferrofed-console-${{ inputs.version }}-image-amd64.spdx.json
          push-to-registry: true
      - name: Attest the linux/arm64 provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.arm64 }}
          push-to-registry: true
      - name: Attest the linux/arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.arm64 }}
          sbom-path: ferrofed-console-${{ inputs.version }}-image-arm64.spdx.json
          push-to-registry: true

      - name: Verify the published image as a consumer
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.manifests.outputs.amd64 }}
          ARM64: ${{ steps.manifests.outputs.arm64 }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/release-console.yml"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
          for manifest in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://${IMAGE}@${manifest}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
            gh attestation verify "oci://${IMAGE}@${manifest}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
          {
            echo "image ${IMAGE}:${VERSION} (tagged by scan-and-tag.yml after its scan)"
            echo "index ${DIGEST}"
            echo "amd64 ${AMD64}"
            echo "arm64 ${ARM64}"
          } >> "$GITHUB_STEP_SUMMARY"
