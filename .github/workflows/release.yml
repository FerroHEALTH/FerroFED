# The release lane. One workflow owns the `v*` tag, and every ordering in it is
# a `needs` edge:
#
#   plan ── github-release (draft) ── build-binaries ── build-image ──┬─ vulnerability-record ── scan-and-tag ── finalize-release (publish) ── milestone
#                                  └─ build-console ─────────────────┘
#
# plan refuses a tag whose milestone (titled exactly as the tag) is missing or
# still holds an open item, and milestone closes it once every leg succeeded
# (scripts/release/milestone.sh).
#
# build-binaries, build-image and build-console are calls to the reusable
# workflows release-build.yml, release-image.yml and release-console.yml, the
# SLSA Build Level 3 lanes. The two images are pushed by digest with no tag;
# vulnerability-record judges every finding of both images and the binaries
# against security/vex/, and scan-and-tag (scan-and-tag.yml) tags each image
# only after its HIGH and CRITICAL scan passes.
#
# The release is created as a DRAFT, the gateway compose files, the nginx
# reverse proxy configuration, the conformance seed data, the information
# sheet and instructions for use, the EU declaration of conformity once the
# manufacturer issues it, the binaries, SBOMs and attestation bundles
# are attached to it, the gateway and operator console images are pushed to
# GHCR, and only once the expected asset set is complete is it PUBLISHED.
# Publishing last means a half-assembled release is never visible.
#
# Every tag since v0.0.1 carries the workspace (#28), so `plan` fails a tag
# whose tree has no root Cargo.toml, because the tag cannot then be checked
# against the workspace version. Every job past `plan` therefore builds and
# ships the binaries and the image.
#
# The workflow is dormant until a `v*` tag is pushed. It does not run on a push
# to main, on a pull request, or in a merge group. A tag on a security patch
# branch runs it like a tag on main; plan decides whether the release becomes
# the latest (scripts/release/latest.sh).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish. Dispatch this workflow AT that tag."
        required: true
        type: string

# A release must never be cancelled part-way through publishing: a draft with
# some assets attached is worse than a queued second run, so a second tag push
# queues behind the first rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No permissions by default: each job grants its own, and only the three jobs
# that create, fill or publish the release get `contents: write`.
permissions: {}

jobs:
  # ---- plan: every release fact, verified before anything is created --------

  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read # the milestone titled as the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      is-prerelease: ${{ steps.tag.outputs.is_prerelease }}
      is-latest: ${{ steps.latest.outputs.latest }}
      targets: ${{ steps.targets.outputs.targets }}
      declaration: ${{ steps.declaration.outputs.issued }}
    steps:
      - id: tag
        name: Resolve and validate the release tag
        # The dispatch input reaches the shell through env, never spliced into
        # the script, and has to match a full semver tag shape before anything
        # downstream uses it.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # A dispatch names a tag but runs at whatever ref it was started
            # from, so the two are compared. Without this, a dispatch could
            # publish notes and binaries built from a different commit.
            if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
              echo "::error::dispatched at '${GITHUB_REF}', not at refs/tags/${tag}. Run: gh workflow run Release --ref ${tag} -f tag=${tag}" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          # A tag carrying a pre-release suffix (v1.2.3-rc.1) publishes as a
          # pre-release; a bare vX.Y.Z is an official release.
          case "$tag" in
            *-*) is_prerelease=true ;;
            *) is_prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "releasing ${tag} (pre-release: ${is_prerelease})"

      # github.sha is the commit the event ref points at, and the mismatch
      # refusal above guarantees it is the tag's commit on a dispatch too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - id: latest
        name: Whether this release becomes the latest
        # Only the highest version, never a pre-release, becomes the
        # repository's latest release and moves the latest image tags; a
        # security patch of the newest release is the highest.
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          latest="$(bash scripts/release/latest.sh "$VERSION")"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "the latest release: ${latest}"

      # Every release fact, as ONE list: the milestone titled as the tag, the
      # declared product version, the changelog's structure and Security rules
      # for this section, the technical documentation since the previous tag,
      # the support periods, the Annex II checklist, the EU declaration of
      # conformity, and the release notes with the support period and the CRA
      # user-information link. The list is scripts/release/plan.sh;
      # scripts/release/preflight.sh runs the same list before the tag is
      # pushed, so the two cannot drift (no specification governs the list:
      # our own design). It names every refused check, and writes
      # release-notes.md for github-release. A missing or empty changelog
      # section fails the release rather than falling back to notes generated
      # from the commit range.
      - name: Every release fact holds at the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release/plan.sh checks "$TAG" --notes release-notes.md

      - id: declaration
        name: Whether the release carries the EU declaration of conformity
        # Regulation (EU) 2025/327 Art 39 and Annex IV. The plan step above
        # refused a declaration with a blank; this reads whether the
        # manufacturer's file issues one, for github-release and finalize.
        run: |
          set -euo pipefail
          issued="$(scripts/release/declaration-of-conformity.sh status)"
          case "$issued" in
            true | false) ;;
            *)
              echo "::error::the declaration status is '$issued', neither true nor false." >&2
              exit 1
              ;;
          esac
          echo "issued=$issued" >> "$GITHUB_OUTPUT"

      - id: targets
        name: Name the binary targets
        # The target set is emitted once, here, and read both by the
        # build-binaries matrix and by the finalize asset check, so the two
        # cannot drift apart. Linux only, because the deliverable is a server.
        # No specification governs this: FerroFED's own design.
        run: |
          set -euo pipefail
          targets='{"include":[
            {"runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
            {"runner":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"}
          ]}'
          echo "targets=$(printf '%s' "$targets" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # ---- github-release: create the release as a DRAFT ------------------------

  github-release:
    name: github release (draft)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      # The tag's tree, for the compose files, the seed data and the book
      # pages attached below. Checked out first, because checkout cleans the
      # workspace and would remove the notes downloaded after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # Created as a DRAFT and finalized only after every asset is attached. A
      # draft is mutable, which is the window the binary uploads need, and it
      # is not visible to anyone browsing releases.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          IS_PRERELEASE: ${{ needs.plan.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          # The title is the bare version; the repository already says whose
          # release it is. --verify-tag refuses to invent a tag that is not
          # already on the remote.
          args=(
            --repo "$GITHUB_REPOSITORY"
            --draft
            --verify-tag
            --title "$VERSION"
            --notes-file release-notes.md
          )
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          case "$state" in
            missing)
              gh release create "$TAG" "${args[@]}"
              ;;
            true)
              echo "a draft for $TAG already exists: refreshing its notes."
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file release-notes.md
              ;;
            *)
              # The recovery rule for a bad cut is a new patch version, never a
              # retag, so an already-published release is never reopened here.
              echo "::error::$TAG is already published. A bad cut ships forward as a new patch version; it is never retagged." >&2
              exit 1
              ;;
          esac

      # The gateway alone, at this release's image, with the two example files
      # it mounts, so a downloader edits them and starts it with
      # `docker compose up` and no checkout. Each asset is named after its
      # file: compose.yaml, the name Compose reads without `-f`, ferrofed.toml
      # and registry.toml, the names it mounts. --clobber replaces the copies a
      # re-run of this job attached to the same draft.
      - name: Attach the gateway compose files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            deploy/compose/compose.yaml \
            deploy/compose/ferrofed.toml \
            deploy/compose/registry.toml \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The nginx reverse proxy of the production guide, deploy/nginx, under
      # its file name, with its SHA-256 in sha256sum form, so an operator who
      # installs from this page verifies it beside the compose files. A tree
      # without it fails here, before anything is uploaded.
      - name: Attach the nginx reverse proxy configuration
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/nginx/ferrofed.conf ]; then
            echo "::error::deploy/nginx/ferrofed.conf is missing, so $TAG has no reverse proxy configuration to attach." >&2
            exit 1
          fi
          mkdir -p nginx
          cp deploy/nginx/ferrofed.conf nginx/ferrofed.conf
          (cd nginx && sha256sum ferrofed.conf > ferrofed.conf.sha256sum)
          gh release upload "$TAG" \
            nginx/ferrofed.conf \
            nginx/ferrofed.conf.sha256sum \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The Grafana dashboard and the Prometheus alert rules over the
      # gateway's metrics, each under its file name, which
      # scripts/checks/observability.sh holds to the metrics this release
      # exports.
      - name: Attach the observability files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            deploy/observability/ferrofed-dashboard.json \
            deploy/observability/ferrofed-alerts.yaml \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The vendored demo data `ferrofed conformance run --seed-data` reads,
      # in one file with the Apache-2.0 licence and notice it is distributed
      # under, and that file's SHA-256 in sha256sum form, so an operator
      # scores a deployment with no checkout. The run checks each file it
      # holds against the digests it carries.
      - name: Attach the conformance seed data
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/release/seed-data.sh seed-data
          gh release upload "$TAG" \
            seed-data/ferrofed-conformance-seed-data.json \
            seed-data/ferrofed-conformance-seed-data.json.sha256sum \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The information sheet and the instructions for use the system is
      # accompanied by (Regulation (EU) 2025/327 Art 30(1)(d)), as the tag's
      # Markdown, which a screen reader reads as text, named with the tag.
      # The script refuses a sheet that does not describe this version.
      - name: Attach the information sheet and the instructions for use
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/release/accompanying-documents.sh "$TAG" accompanying
          gh release upload "$TAG" \
            "accompanying/ferrofed-${TAG}-information-sheet.md" \
            "accompanying/ferrofed-${TAG}-instructions-for-use.md" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The EU declaration of conformity (Regulation (EU) 2025/327 Art 39,
      # with the content of Annex IV), written from the tag's records and the
      # manufacturer's file, attached only when plan found the manufacturer
      # issues it. The script refuses a declaration with a blank.
      - name: Attach the EU declaration of conformity
        if: needs.plan.outputs.declaration == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/release/declaration-of-conformity.sh "$TAG" "$COMMIT" declaration
          gh release upload "$TAG" \
            "declaration/ferrofed-${TAG}-eu-declaration-of-conformity.md" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---- build-binaries: the SLSA Build L3 lane, once per target --------------

  # A call and nothing else. The isolation is what makes the provenance
  # unforgeable: SLSA Build Level 3 requires the signing material to sit out of
  # reach of user-defined build steps, and a job's steps all share one runner VM
  # (https://slsa.dev/spec/v1.2/build-requirements), so the build and its
  # attestations run in release-build.yml, a reusable workflow on its own VM. A
  # job that carries `uses:` cannot also carry `steps:`.
  build-binaries:
    name: binaries (${{ matrix.target }})
    needs: [plan, github-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    # Declared on both sides: a called workflow receives the caller's token
    # permissions, and GitHub's Build L3 guide asks for the same set in both
    # places.
    permissions:
      contents: write # attach the per-target assets to the draft release
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  # ---- build-image: the container from the attested musl binaries -----------

  # A call and nothing else, for the same Build L3 reason.
  build-image:
    name: image (linux/amd64, linux/arm64)
    needs: [plan, build-binaries]
    permissions:
      contents: read # the attestations API, to verify the inputs
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
      latest: ${{ needs.plan.outputs.is-latest == 'true' }}

  # ---- build-console: the operator console image ------------------------------

  # A call and nothing else, for the same Build L3 reason. The console ships
  # as an image alone, so it adds no asset to the draft.
  build-console:
    name: console image (linux/amd64, linux/arm64)
    needs: [plan, github-release]
    permissions:
      contents: read # the attestations API, to verify the inputs
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-console.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
      latest: ${{ needs.plan.outputs.is-latest == 'true' }}

  # ---- vulnerability-record: every finding, judged, or no release ------------

  # Regulation (EU) 2024/2847 Annex I Part I(2)(a): a product is made available
  # without known exploitable vulnerabilities. The gate in scan-and-tag blocks
  # HIGH and CRITICAL findings that have a fix; this job scans the same pushed
  # digests and the four binaries with NO severity floor and NO
  # `ignore-unfixed`, and scripts/checks/vex-coverage.sh refuses the release
  # while a finding lacks an OpenVEX statement under security/vex/. It runs
  # before scan-and-tag, so a refused release leaves its images untagged and
  # its GitHub release a draft. No specification governs the record's form:
  # our own design, the one FerroEHR runs.
  vulnerability-record:
    name: vulnerability record
    needs: [plan, github-release, build-binaries, build-image, build-console]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # read the draft's binaries, attach the record to it
      packages: read # pull the digests the image jobs pushed
    env:
      TRIVY_VERSION: "0.73.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: The coverage check refuses what it claims to refuse
        run: bash scripts/checks/vex-coverage.sh --self-test
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan every image and binary, every severity, fixed or not
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          GATEWAY_DIGEST: ${{ needs.build-image.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.build-console.outputs.digest }}
        run: |
          set -euo pipefail
          # An explicit empty config and ignore file: trivy reads ./trivy.yaml
          # and its ignore file by default, which would put the gate's floor
          # and its exceptions back into the record.
          : > "$RUNNER_TEMP/empty.yaml"
          : > "$RUNNER_TEMP/empty.ignore"
          scan=(--config "$RUNNER_TEMP/empty.yaml" --ignorefile "$RUNNER_TEMP/empty.ignore"
            --scanners vuln --severity "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
            --ignore-unfixed=false --format json --quiet)
          mkdir -p reports binaries
          targets=()
          for entry in "ferrofed|$GATEWAY_DIGEST" "ferrofed-console|$CONSOLE_DIGEST"; do
            image="${entry%%|*}"
            digest="${entry#*|}"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::no pushed digest for ${image}" >&2; exit 1 ;;
            esac
            for platform in linux/amd64 linux/arm64; do
              report="reports/${image}-${platform##*/}.json"
              trivy image "${scan[@]}" --platform "$platform" --output "$report" \
                "ghcr.io/ferrohealth/${image}@${digest}"
              targets+=("pkg:oci/${image}=${report}")
            done
          done
          while IFS= read -r target; do
            tarball="ferrofed-${TAG}-${target}.tar.gz"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$tarball" --dir binaries
            mkdir -p "binaries/${target}"
            tar -C "binaries/${target}" -xzf "binaries/${tarball}"
            report="reports/ferrofed-${target}.json"
            trivy rootfs "${scan[@]}" --output "$report" "binaries/${target}"
            targets+=("pkg:cargo/ferrofed-server=${report}")
          done < <(printf '%s' "$TARGETS" | jq -r '.include[].target')
          printf '%s\n' "${targets[@]}" > targets.txt
      - name: Every finding carries an exploitability judgement
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t targets < targets.txt
          bash scripts/checks/vex-coverage.sh \
            --record "ferrofed-${TAG}-vulnerability-record.json" "${targets[@]}"
          tar -czf "ferrofed-${TAG}-trivy-reports.tar.gz" reports
      # Kept for a refused run too, so the findings to judge are one download
      # away rather than one re-run away.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulnerability-record
          path: |
            reports/
            ferrofed-*-vulnerability-record.json
          if-no-files-found: warn
          retention-days: 30
      - name: Attach the record to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "ferrofed-${TAG}-vulnerability-record.json" \
            "ferrofed-${TAG}-trivy-reports.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---- scan-and-tag: the image gate, then the tags ----------------------------

  # A call and nothing else. Both images were pushed by digest with no tag;
  # scan-and-tag.yml scans each digest and only then applies the tags
  # release-image.yml and release-console.yml computed.
  scan-and-tag:
    name: scan and tag images
    needs: [build-image, build-console, vulnerability-record]
    permissions:
      contents: read # trivy.yaml and .trivyignore.yaml
      packages: write # pull the digests, then tag them
    uses: ./.github/workflows/scan-and-tag.yml
    with:
      gateway-digest: ${{ needs.build-image.outputs.digest }}
      gateway-tags: ${{ needs.build-image.outputs.tags }}
      console-digest: ${{ needs.build-console.outputs.digest }}
      console-tags: ${{ needs.build-console.outputs.tags }}

  # ---- finalize-release: verify the asset set, then PUBLISH -----------------

  finalize-release:
    name: github release (publish)
    # Every `needs` job has to succeed, the default, so a failed or skipped
    # leg leaves the release a draft.
    needs: [plan, github-release, build-binaries, build-image, build-console, vulnerability-record, scan-and-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publish the release
    steps:
      # The tag's tree, for the Kubernetes package below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The kustomize package of deploy/kubernetes with the gateway and
      # console images pinned to the digests this release pushed and
      # scan-and-tag tagged, and its SHA-256 in sha256sum form
      # (scripts/release/kubernetes-package.sh). It is attached here, where
      # both digests are known, before the asset check below.
      - name: Attach the Kubernetes package pinned by digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          GATEWAY_DIGEST: ${{ needs.build-image.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.build-console.outputs.digest }}
        run: |
          set -euo pipefail
          bash scripts/release/kubernetes-package.sh "$TAG" "$GATEWAY_DIGEST" "$CONSOLE_DIGEST" kubernetes
          gh release upload "$TAG" \
            "kubernetes/ferrofed-${TAG}-kubernetes.tar.gz" \
            "kubernetes/ferrofed-${TAG}-kubernetes.tar.gz.sha256sum" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: The draft carries every asset this version promises
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          DECLARATION: ${{ needs.plan.outputs.declaration }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "attached assets:"
          printf '%s\n' "$assets"
          missing=""
          # Every suffix release-build.yml uploads, per target. `grep -Fxq` is
          # a fixed string matched whole-line, so ".tar.gz" is not satisfied by
          # ".tar.gz.sha256sum". A draft missing any of them stays a draft.
          while IFS= read -r target; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.build-sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".cdx.json" \
              ".spdx.json"; do
              printf '%s\n' "$assets" | grep -Fxq "ferrofed-${TAG}-${target}${suffix}" \
                || missing="$missing ferrofed-${TAG}-${target}${suffix}"
            done
          done < <(printf '%s' "$TARGETS" | jq -r '.include[].target')
          # The release-wide assets github-release attaches: the gateway
          # compose file, the two example files it mounts, the nginx reverse
          # proxy configuration with its SHA-256, the conformance seed data
          # with its SHA-256, the dashboard and alert rules, and the
          # information sheet and instructions for use of this tag, the
          # Kubernetes package pinned by digest with its SHA-256, and the
          # EU declaration of conformity when plan found it issued.
          declaration=""
          case "$DECLARATION" in
            true) declaration="ferrofed-${TAG}-eu-declaration-of-conformity.md" ;;
            false) echo "::warning::$TAG carries no EU declaration of conformity: the manufacturer does not issue one from this tree." ;;
            *)
              echo "::error::the declaration output of plan is '$DECLARATION', neither true nor false." >&2
              exit 1
              ;;
          esac
          for asset in compose.yaml ferrofed.toml registry.toml \
            ferrofed.conf ferrofed.conf.sha256sum \
            ferrofed-conformance-seed-data.json \
            ferrofed-conformance-seed-data.json.sha256sum \
            ferrofed-dashboard.json ferrofed-alerts.yaml \
            "ferrofed-${TAG}-information-sheet.md" \
            "ferrofed-${TAG}-instructions-for-use.md" \
            "ferrofed-${TAG}-vulnerability-record.json" \
            "ferrofed-${TAG}-trivy-reports.tar.gz" \
            "ferrofed-${TAG}-kubernetes.tar.gz" \
            "ferrofed-${TAG}-kubernetes.tar.gz.sha256sum" \
            ${declaration:+"$declaration"}; do
            printf '%s\n' "$assets" | grep -Fxq "$asset" || missing="$missing $asset"
          done
          if [ -n "$missing" ]; then
            echo "::error::the draft is missing assets, so it will not be published:$missing" >&2
            exit 1
          fi
          echo "every expected asset is attached."

      # `--latest` marks this release as the repository's latest, which a
      # pre-release and a security patch on an older line must never be;
      # plan decided which this release is.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          IS_LATEST: ${{ needs.plan.outputs.is-latest }}
        run: |
          set -euo pipefail
          case "$IS_LATEST" in
            true) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest ;;
            false) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false ;;
            *)
              echo "::error::the is-latest output of plan is '$IS_LATEST', neither true nor false." >&2
              exit 1
              ;;
          esac

  # ---- milestone: close the release's milestone ------------------------------
  # Runs after every leg. `always()` keeps the job in the graph when a leg
  # fails, so its log names that leg and the milestone stays open; a re-run of
  # the failed jobs closes it. An already-closed milestone counts as done. The
  # crates.io lane is publish-crates.yml, a workflow of its own, which no
  # `needs` edge can reach.
  milestone:
    name: close the milestone
    needs: [plan, github-release, build-binaries, build-image, build-console, vulnerability-record, scan-and-tag, finalize-release]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the script
      issues: write # close the milestone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Close the milestone titled as the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/release/milestone.sh close "$TAG"
