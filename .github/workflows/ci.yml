# CI in two tiers.
#
#   1. The workflow, shell, container and guard tier needs no Rust: zizmor
#      over .github, actionlint over .github/workflows, shellcheck over the
#      tracked shell programs, hadolint over any Dockerfile, and the committed
#      comment-style, file-length and versions guards. These keep this very
#      file honest, so none of them may depend on the Rust toolchain.
#   2. The Rust tier is gated behind a detection job that looks for a root
#      Cargo.toml. The workspace carries one, so every cargo lane runs on
#      every change, and a tree without one would skip them cleanly.
#      hashFiles() cannot gate a job at `if:` time, because the runner
#      workspace is empty before checkout, so a real detection job is the
#      correct primitive.
#
# The `conclusion` job is the single required status check on main; it is what
# makes a pipeline of gated jobs enforceable. The contribution-licence guard
# is its own workflow (contribution-licence.yml) with its own check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a pull request only. A push to main and a
  # merge-group run each verify a distinct commit that must keep its own
  # result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default: each job grants its own.
permissions: {}

jobs:
  # ---- Tier 1: the checks that need no Rust ---------------------------------

  # zizmor (https://docs.zizmor.sh/) is the static security analysis for GitHub
  # Actions, the machine check behind three properties this repository treats
  # as hard rules: every `uses:` pinned to a commit SHA (unpinned-uses), no
  # checkout persisting credentials (artipacked), and no context value spliced
  # into a shell (template-injection).
  #
  # The audit path is the whole of .github, not just the workflows: zizmor also
  # reads dependabot.yml (dependabot-cooldown) and composite actions under
  # .github/actions, which run with the calling workflow's permissions and are
  # the same class of live, token-holding code.
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: zizmor@1.30.1
      - name: Audit .github
        # GH_TOKEN enables the online audits. impostor-commit verifies that a
        # pinned commit really belongs to the repository named in front of it,
        # which it cannot do offline. --min-severity=low gates every actionable
        # tier and leaves the informational tier advisory.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  # actionlint is the correctness half of the pair: `${{ }}` expressions that
  # cannot evaluate, `needs:` naming a job that does not exist, unknown runner
  # labels, and shellcheck over every embedded `run:` block.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned. actionlint is a Go binary rather
        # than a crate, and its README's alternative is `curl | bash` off main,
        # the unpinned fetch the pinning rule forbids. The image also bundles
        # shellcheck, which half of actionlint's value depends on.
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence here is a printf format or a jq filter,
        # where single quotes are the correct idiom.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # shellcheck over the tracked shell programs: the CI guards, the tracker
  # helpers, and the hooks. `--severity=style` is the lowest floor, so every
  # finding gates. A finding is fixed, or it carries a per-line
  # `# shellcheck disable=SCnnnn` directive with its reason. There is no
  # .shellcheckrc, deliberately: nothing may turn a code off tree-wide (no
  # specification governs this: our own design).
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The upstream release binary, pinned by version, rather than the
      # runner's distro package, which moves at every runner-image refresh.
      # Fetched by the same SHA-pinned installer, which verifies the checksum.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: |
          set -euo pipefail
          # Every tracked *.sh, plus every tracked extensionless file whose
          # first line is a shell shebang, which covers the git hooks. A
          # NUL-delimited pipe, so a path with a space survives. Vendored
          # trees are bytes a publisher owns and are never linted in place.
          {
            git ls-files -z -- '*.sh' ':(glob,exclude)docs/specs/**' ':(glob,exclude)**/vendor/**'
            git ls-files -z -- ':(glob,exclude)docs/specs/**' ':(glob,exclude)**/vendor/**' \
              | while IFS= read -r -d '' f; do
                case "$f" in
                  *.*) ;;
                  *) head -c2 "$f" 2>/dev/null | grep -q '#!' \
                       && head -n1 "$f" | grep -qE 'sh$' && printf '%s\0' "$f" ;;
                esac
              done
          } | { grep -zc . >/dev/null && xargs -0 -r shellcheck --severity=style; } \
            || echo "no shell files to check"

  # hadolint over every tracked Dockerfile (docker/Dockerfile today), under the
  # committed .hadolint.yaml (failure-threshold: warning).
  dockerfile-lint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every tracked Dockerfile passes hadolint
        # The official image, digest-pinned, for the same reason as actionlint:
        # hadolint is a Haskell binary with no checksum-verified installer in
        # the pinned tool set. Vendored trees (the reference implementation
        # ships a Dockerfile) are excluded: they are evidence, never built here.
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(git ls-files -z -- 'Dockerfile' '*/Dockerfile' '*.Dockerfile' 'Dockerfile.*' \
                  ':(glob,exclude)docs/specs/**' ':(glob,exclude)**/vendor/**')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile to check"
            exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --config .hadolint.yaml "${files[@]}"

  # The comment-style guard (RFC 505 and RFC 1574) over the whole tree: every
  # hand-written .rs file, plus the citation checks over the shell scripts,
  # every Cargo.toml, clippy.toml, the YAML under .github and the TOML under
  # docker/. Its self-test proves the citation checks refuse what they must and
  # pass their near misses.
  comment-style:
    name: comment-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/comment-style.sh --self-test
          bash scripts/checks/comment-style.sh --all

  # The file-length guard: a hand-written Rust file stays under 1000 lines and
  # a listed breach may not grow (no specification governs this: our own
  # design). It passes on a tree with no .rs file.
  file-length:
    name: file-length
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/file-length.sh

  # The version-drift guard. It compares every present config file against
  # docs/VERSIONS.md and skips loudly for the files that have not landed yet,
  # so it is useful now and grows teeth as files appear.
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash scripts/checks/versions.sh --self-test
          bash scripts/checks/versions.sh

  # The book theme favicons are copies of the brand mark, so the mark exists
  # twice and only this guard keeps the two byte-identical.
  favicon-sync:
    name: favicon-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/favicon-sync.sh

  # The conformance-matrix guard (the §17 conformance points and the §16.3
  # tracks): the matrix's derived columns against the vendored specification,
  # every
  # `// conformance:` marker against the matrix, the rendered book page against
  # the matrix, and the README conformance badges against the matrix and the
  # AQL golden pass list. Static and offline; a failing marked test, and a
  # golden case that leaves or joins the pass list, fail in the Rust tier.
  conformance-matrix:
    name: conformance-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/conformance-matrix.sh

  # The tracker helpers that carry a self-test. Their real branches run only
  # against the live tracker: the fallback of fields.sh needs a token that
  # cannot read the organisation's issue types, the migration and the label
  # run write to every issue, and a relationship write changes the tracker.
  # Each drives itself against a stub gh on PATH instead.
  tracker-helpers:
    name: tracker-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/gh/fields.sh --self-test
          bash scripts/gh/labels.sh --self-test
          bash scripts/gh/migrate-fields.sh --self-test
          bash scripts/gh/rel.sh --self-test

  # The crate-version guard below runs only on a pull request without the
  # `no-crate-bump` label, so its self-test runs here on every event: a stub
  # repository whose main bumped a crate after the branch forked, to pin that
  # the guard judges only what the branch changed.
  crate-version-guard-self-test:
    name: crate-version-guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/crate-version-guard.sh --self-test

  # ---- Tier 2: the Rust lanes, gated on the workspace existing --------------

  # The one job that decides whether the cargo tier runs at all: it checks out
  # and looks for a root Cargo.toml. Every Rust job below `needs` it.
  detect:
    name: detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.check.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml present: the Rust lanes will run."
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "No root Cargo.toml: the Rust lanes are skipped."
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # fuzz/ is a cargo-fuzz crate outside the workspace with its own lockfile
  # (#134). Resolving it with --locked fails when a workspace change moved a
  # crate the fuzz targets depend on without refreshing that lockfile, which
  # no other job reads (#143). `cargo metadata` resolves without a fuzz build.
  fuzz-lockfile:
    name: fuzz lockfile
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: fuzz/Cargo.lock matches the workspace
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest
      # Every feature: a library feature no workspace member enables yet (the
      # aql rewrite of openehr-federation) still runs its tests.
      - run: cargo nextest run --workspace --locked --all-features --no-tests=pass
      # nextest does not run doctests, so they get their own compile.
      - run: cargo test --doc --workspace --locked --all-features

  # The container-backed suite (#39; no specification governs it: our own
  # design). Every such test checks FERROFED_E2E first and returns early without it, so the
  # test job above stays offline; this job sets the gate and runs the crates
  # that carry container tests against the digest-pinned images the
  # testkit's PinnedImage constants name and docs/VERSIONS.md repeats.
  e2e:
    name: e2e (containers)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FERROFED_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest
      # The testkit's whole suite, and the server's container tests alone,
      # since the test job already runs the rest of the server offline.
      - run: >-
          cargo nextest run --locked -p ferrofed-testkit -p ferrofed-server
          -E 'package(ferrofed-testkit) or (package(ferrofed-server) and test(/^e2e::/))'
          --no-tests=pass

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The [workspace.lints.rustdoc] levels apply to every `cargo doc`; -D
      # turns a broken intra-doc link into a failed build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny
      # Reads the same RustSec advisory database as cargo-audit and adds
      # yanked, licences, bans and sources, so there is no separate audit job.
      - run: cargo deny check

  msrv:
    name: msrv (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-hack
      # The Cargo book's named tool for verifying the declared rust-version,
      # which it reads from the workspace `rust-version`.
      - run: cargo hack check --rust-version --workspace --locked --all-targets

  # Each published crate is one specification with a feature per layer or
  # profile (the Cargo reference, Features; no specification governs the
  # layout: our own design), so every feature must build and lint on its own
  # as well as together. Per package, never the workspace
  # all-features union.
  features:
    name: features (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-hack
      - run: >-
          cargo hack clippy --locked --each-feature --all-targets
          --package openehr-federation --package ihe-iti --package nl-generic-functions
          -- -D warnings

  # The library crates stay publishable while the workspace `publish` switch is
  # off (the Cargo reference, the `publish` field; no specification governs the
  # policy: our own design): `cargo package` builds
  # and verifies every crates/* tarball an upload would send, and once the
  # switch is on the script adds `cargo publish --dry-run` over the
  # publishable set. No cache, as in the publishing lane it rehearses.
  publish-dry-run:
    name: publish dry run (cargo package)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: bash scripts/release/publish-crates.sh package

  # A published crates.io version is immutable, so packaged content that
  # changes without a version bump is a defect nothing can repair after the
  # upload (the Cargo reference, Publishing on crates.io: a publish is
  # generally permanent). The script exits 0 while no
  # crates/* member exists. `no-crate-bump` is the escape for a diff that
  # provably does not alter packaged bytes. The script diffs from the merge
  # base of the two shas, so the full history is fetched, and a base that
  # moved on after the branch forked is never read as the branch's change.
  crate-version-guard:
    name: crate-version-guard
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-crate-bump')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Packaged crate content moved with its version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  dependency-review:
    name: dependency-review
    needs: detect
    # Pull requests only: the action compares the base..head dependency graph,
    # which a push has no diff for. Also gated on the workspace, so it stays
    # quiet while the repository has no manifest.
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a pull request that introduces a vulnerable or
          # disallowed-licence dependency. The licence policy mirrors
          # deny.toml once that file exists.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- The single required check -------------------------------------------

  # conclusion is the one status check the branch ruleset requires. It `needs`
  # every other job and runs on always(), so it reports even when every gated
  # Rust lane is skipped. It fails when a needed job failed or was cancelled
  # and passes when every result is success or skipped. The results arrive
  # through env:, never spliced into run: (the GitHub Actions security
  # hardening guide, script injection).
  conclusion:
    name: conclusion
    needs:
      - workflow-audit
      - workflow-lint
      - shellcheck
      - dockerfile-lint
      - comment-style
      - file-length
      - versions
      - favicon-sync
      - conformance-matrix
      - tracker-helpers
      - crate-version-guard-self-test
      - detect
      - fmt
      - fuzz-lockfile
      - clippy
      - test
      - e2e
      - doc
      - cargo-deny
      - msrv
      - features
      - publish-dry-run
      - crate-version-guard
      - dependency-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
