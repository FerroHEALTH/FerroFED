# CI in two tiers.
#
#   1. The workflow, shell, container and guard tier needs no Rust: zizmor
#      over .github, actionlint over .github/workflows, shellcheck over the
#      tracked shell programs, hadolint over any Dockerfile, kubeconform over
#      the example Kubernetes manifests, the committed comment-style,
#      file-length and versions guards, and the offline site link guard. These keep this very
#      file honest, so none of them may depend on the Rust toolchain.
#   2. The Rust tier is gated behind a detection job that looks for a root
#      Cargo.toml. The workspace carries one, so every cargo lane runs on
#      every change, and a tree without one would skip them cleanly.
#      hashFiles() cannot gate a job at `if:` time, because the runner
#      workspace is empty before checkout, so a real detection job is the
#      correct primitive.
#
# The `conclusion` job is the single required status check on main; it is what
# makes a pipeline of gated jobs enforceable. The contribution-licence guard
# is its own workflow (contribution-licence.yml) with its own check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` and `unlabeled` too: the label escapes (`no-crate-bump`,
    # `no-changelog`) are read from the event payload, so a label added
    # after the run started takes effect without a new push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a pull request only. A push to main and a
  # merge-group run each verify a distinct commit that must keep its own
  # result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default: each job grants its own.
permissions: {}

jobs:
  # ---- Tier 1: the checks that need no Rust ---------------------------------

  # zizmor (https://docs.zizmor.sh/) is the static security analysis for GitHub
  # Actions, the machine check behind three properties this repository treats
  # as hard rules: every `uses:` pinned to a commit SHA (unpinned-uses), no
  # checkout persisting credentials (artipacked), and no context value spliced
  # into a shell (template-injection).
  #
  # The audit path is the whole of .github, not just the workflows: zizmor also
  # reads dependabot.yml (dependabot-cooldown) and composite actions under
  # .github/actions, which run with the calling workflow's permissions and are
  # the same class of live, token-holding code.
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: zizmor@1.30.1
      - name: Audit .github
        # GH_TOKEN enables the online audits. impostor-commit verifies that a
        # pinned commit really belongs to the repository named in front of it,
        # which it cannot do offline. --min-severity=low gates every actionable
        # tier and leaves the informational tier advisory.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  # actionlint is the correctness half of the pair: `${{ }}` expressions that
  # cannot evaluate, `needs:` naming a job that does not exist, unknown runner
  # labels, and shellcheck over every embedded `run:` block.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned. actionlint is a Go binary rather
        # than a crate, and its README's alternative is `curl | bash` off main,
        # the unpinned fetch the pinning rule forbids. The image also bundles
        # shellcheck, which half of actionlint's value depends on.
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence here is a printf format or a jq filter,
        # where single quotes are the correct idiom.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # shellcheck over the tracked shell programs: the CI guards, the tracker
  # helpers, and the hooks. `--severity=style` is the lowest floor, so every
  # finding gates. A finding is fixed, or it carries a per-line
  # `# shellcheck disable=SCnnnn` directive with its reason. There is no
  # .shellcheckrc, deliberately: nothing may turn a code off tree-wide (no
  # specification governs this: our own design).
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The upstream release binary, pinned by version, rather than the
      # runner's distro package, which moves at every runner-image refresh.
      # Fetched by the same SHA-pinned installer, which verifies the checksum.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: |
          set -euo pipefail
          # Every tracked *.sh, plus every tracked extensionless file whose
          # first line is a shell shebang, which covers the git hooks. A
          # NUL-delimited pipe, so a path with a space survives. Vendored
          # trees are bytes a publisher owns and are never linted in place.
          {
            git ls-files -z -- '*.sh' ':(glob,exclude)docs/specs/**' ':(glob,exclude)**/vendor/**'
            git ls-files -z -- ':(glob,exclude)docs/specs/**' ':(glob,exclude)**/vendor/**' \
              | while IFS= read -r -d '' f; do
                case "$f" in
                  *.*) ;;
                  *) head -c2 "$f" 2>/dev/null | grep -q '#!' \
                       && head -n1 "$f" | grep -qE 'sh$' && printf '%s\0' "$f" ;;
                esac
              done
          } | { grep -zc . >/dev/null && xargs -0 -r shellcheck --severity=style; } \
            || echo "no shell files to check"

  # hadolint over every tracked Dockerfile (docker/Dockerfile and
  # docker/viewer/Dockerfile today), under the
  # committed .hadolint.yaml (failure-threshold: warning).
  dockerfile-lint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every tracked Dockerfile passes hadolint
        # The official image, digest-pinned, for the same reason as actionlint:
        # hadolint is a Haskell binary with no checksum-verified installer in
        # the pinned tool set. Vendored trees (the reference implementation
        # ships a Dockerfile) are excluded: they are evidence, never built here.
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(git ls-files -z -- 'Dockerfile' '*/Dockerfile' '*.Dockerfile' 'Dockerfile.*' \
                  ':(glob,exclude)docs/specs/**' ':(glob,exclude)**/vendor/**')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile to check"
            exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --config .hadolint.yaml "${files[@]}"

  # kubeconform over the example Kubernetes manifests under deploy/kubernetes,
  # in strict mode, so an unknown field fails as well as a wrong type. The
  # schemas are read from yannh/kubernetes-json-schema at a pinned commit for
  # one Kubernetes release, so a schema change upstream never moves the result.
  kubernetes-manifests:
    name: kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every example manifest passes kubeconform
        # The official image, digest-pinned, for the same reason as hadolint:
        # no checksum-verified installer for it is in the pinned tool set.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary \
            -kubernetes-version 1.34.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/8df8a883b68a24a104b4a9e43c1288090ae60b3b/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json' \
            deploy/kubernetes

  # The observability assets every release attaches, the Grafana dashboard
  # and the Prometheus rule file under deploy/observability: promtool checks
  # the rules, and the guard holds both to the metrics the gateway exports.
  observability:
    name: observability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The dashboard and the alert rules hold
        # promtool from the Prometheus release tarball, checked against the
        # SHA-256 its release publishes before it runs.
        env:
          PROMETHEUS_VERSION: 3.15.0
          PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
        run: |
          set -euo pipefail
          tarball="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/$tarball"
          echo "${PROMETHEUS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          PROMTOOL="$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" \
            bash scripts/checks/observability.sh

  # The comment-style guard (RFC 505 and RFC 1574) over the whole tree: every
  # hand-written .rs file, plus the citation checks over the shell scripts,
  # every Cargo.toml, clippy.toml, the YAML under .github and the TOML under
  # docker/. Its self-test proves the citation checks refuse what they must and
  # pass their near misses.
  comment-style:
    name: comment-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/comment-style.sh --self-test
          bash scripts/checks/comment-style.sh --all

  # The file-length guard: a hand-written Rust file or book page stays under
  # 1000 lines and a listed breach may not grow (no specification governs
  # this: our own design). It passes on a tree with no .rs file. Its
  # self-test proves each refusal and each pass over fixture repositories.
  file-length:
    name: file-length
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/file-length.sh --self-test
          bash scripts/checks/file-length.sh

  # The version-drift guard. It compares every present config file against
  # docs/VERSIONS.md and skips loudly for the files that have not landed yet,
  # so it is useful now and grows teeth as files appear. The self-tests of
  # the two weekly reads of pin-freshness.yml run here too, offline, so a
  # broken parser fails a pull request rather than reading as nothing new.
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash scripts/checks/versions.sh --self-test
          bash scripts/checks/versions.sh
          bash scripts/checks/pin-freshness.sh --self-test
          bash scripts/checks/ehds-acts.sh --self-test

  # The book theme favicons are copies of the brand mark, so the mark exists
  # twice and only this guard keeps the two byte-identical.
  favicon-sync:
    name: favicon-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/favicon-sync.sh

  # Every first-party header names the one copyright holder, the Licensor of
  # LICENSE; vendored trees keep their upstream terms.
  copyright-holder:
    name: copyright-holder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/copyright-holder.sh

  # Every IHE section the tree cites is a heading of the vendored text of that
  # profile and version. The RESTful ATNA supplement is a PDF, read with
  # pdftotext, so poppler-utils is installed from the runner's own archive.
  ihe-citations:
    name: ihe-citations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - run: |
          set -euo pipefail
          bash scripts/checks/ihe-citations.sh --self-test
          bash scripts/checks/ihe-citations.sh

  # Every shell program runs under bash 3.2, the bash macOS ships, or declares
  # the bash it needs. CI runs bash 5, so the guard reads the scripts for the
  # constructs bash 3.2 lacks; its self-test proves each refusal and pass.
  bash-compat:
    name: bash-compat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/bash-compat.sh --self-test
          bash scripts/checks/bash-compat.sh

  # Every shell program under scripts/ and the session hooks is committed
  # executable, and every scripts/<area>/*.sh program starts with its
  # interpreter line. The guard is called by its path, so it proves its own
  # mode too.
  script-modes:
    name: script-modes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          scripts/checks/script-modes.sh --self-test
          scripts/checks/script-modes.sh

  # Every openEHR class the tree names (an AQL class expression, a canonical
  # JSON `_type`, a `CLASS.member` in a comment or a Markdown page) is defined
  # by the vendored RM or BASE class tables or titled by ITS-REST, and every
  # member is one the class or an ancestor carries.
  openehr-classes:
    name: openehr-classes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/openehr-classes.sh --self-test
          bash scripts/checks/openehr-classes.sh

  # The conformance-matrix guard (the §17 conformance points and the §16.3
  # tracks): the matrix's derived columns against the vendored specification,
  # every
  # `// conformance:` marker against the matrix, the rendered book page against
  # the matrix, and the README conformance badges against the matrix and the
  # AQL golden pass list. Static and offline; a failing marked test, and a
  # golden case that leaves or joins the pass list, fail in the Rust tier. The
  # conformance report script proves its join here over fixtures.
  conformance-matrix:
    name: conformance-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/conformance-matrix.sh
          bash scripts/conformance/report.sh --self-test

  # The obligations guard: the checklist of every normative statement of the
  # pinned specification, its rows against the vendored text, the matrix and
  # the tests they name, and the rendered book page against the checklist.
  # Its self-test proves each refusal and each near miss.
  obligations:
    name: obligations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/obligations.sh --self-test
          bash scripts/checks/obligations.sh

  # The e2e placement guard: a test that checks the FERROFED_E2E gate lives in
  # an e2e module, the one place the e2e job's filter selects, and that job
  # still runs that filter across the workspace; a journey that checks the
  # FERROFED_JOURNEYS gate lives in the testkit's journeys module, which the
  # journeys job selects. Its self-test proves each refused placement and
  # each near miss.
  e2e-placement:
    name: e2e-placement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/e2e-placement.sh --self-test
          bash scripts/checks/e2e-placement.sh

  # The AQL splice guard: no Rust source outside the tests builds AQL text
  # with format!, concat!, push_str or +; a query is a template parsed by
  # openehr-query, its values bound or sent as query parameters, and printed
  # by printer::to_aql. Its self-test proves each refused form and each near
  # miss.
  aql-splice:
    name: aql-splice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/aql-splice.sh --self-test
          bash scripts/checks/aql-splice.sh

  # The site link guard: the site assembled as the Docs workflow publishes it,
  # the landing page at the root and the book under /docs/, with every internal
  # link and anchor resolved offline, and README.md against the tree. It sits
  # here, in the required conclusion, because the Docs workflow's build is no
  # required check. --offline sends no request: an external link is skipped.
  # Its self-test proves a broken anchor and a missing page fail.
  site-links:
    name: site-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docs-toolchain
      # lychee's upstream release binary, pinned by version and by the
      # SHA-256 its release publishes beside the tarball; the install-action
      # manifest carries no lychee, so the checksum is checked here.
      - name: Install lychee
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          set -euo pipefail
          name=lychee-x86_64-unknown-linux-gnu
          dir="$RUNNER_TEMP/lychee"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$dir/$name.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$name.tar.gz"
          echo "${LYCHEE_SHA256}  $dir/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/lychee"
          echo "$dir" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          bash scripts/checks/site-links.sh --self-test
          bash scripts/checks/site-links.sh
      # Every curl example of the pages sends the body it shows: never a bare
      # number, and a here-document only through -d @-.
      - run: |
          set -euo pipefail
          bash scripts/checks/doc-curl.sh --self-test
          bash scripts/checks/doc-curl.sh

  # The tracker helpers that carry a self-test. Their real branches run only
  # against the live tracker: the fallback of fields.sh needs a token that
  # cannot read the organisation's issue types, the migration and the label
  # run write to every issue, and a relationship write changes the tracker.
  # Each drives itself against a stub gh on PATH instead.
  tracker-helpers:
    name: tracker-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/gh/fields.sh --self-test
          bash scripts/gh/labels.sh --self-test
          bash scripts/gh/migrate-fields.sh --self-test
          bash scripts/gh/rel.sh --self-test

  # The crate-version guard below runs only on a pull request without the
  # `no-crate-bump` label, so its self-test runs here on every event: a stub
  # repository whose main bumped a crate after the branch forked, to pin that
  # the guard judges only what the branch changed.
  crate-version-guard-self-test:
    name: crate-version-guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/crate-version-guard.sh --self-test

  # The changelog fragments under changelog.d/ (no specification governs
  # them: our own design). Every fragment's name and content is checked on
  # every event, so a malformed one never reaches the release cut that
  # assembles them. The self-tests prove the check, the assembly and the
  # pull-request guard below over stub repositories.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/release/changelog.sh --self-test
          bash scripts/checks/changelog-guard.sh --self-test
          bash scripts/checks/upgrade-notes.sh --self-test
          bash scripts/release/changelog.sh --check

  # The manifest guard (#454), the one tier-1 job with a toolchain: every
  # Cargo manifest of the workspace and of fuzz/ parses, read by `cargo
  # metadata --no-deps` with nothing resolved and nothing compiled. A manifest
  # a merge broke, a dependency written twice, fails here once with Cargo's
  # own message; `detect` needs this job, so the Rust tier then never starts.
  # No build cache: nothing is built.
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: |
          set -euo pipefail
          bash scripts/checks/manifests.sh --self-test
          bash scripts/checks/manifests.sh

  # ---- Tier 2: the Rust lanes, gated on the workspace existing --------------

  # The one job that decides whether the cargo tier runs at all: it checks out
  # and looks for a root Cargo.toml. Every Rust job below `needs` it, and it
  # waits for the manifest guard, so a broken manifest starts no Rust job.
  detect:
    name: detect workspace
    needs: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.check.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml present: the Rust lanes will run."
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "No root Cargo.toml: the Rust lanes are skipped."
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # fuzz/ is a cargo-fuzz crate outside the workspace with its own lockfile
  # (#134). Resolving it with --locked fails when a workspace change moved a
  # crate the fuzz targets depend on without refreshing that lockfile, which
  # no other job reads (#143). `cargo metadata` resolves without a fuzz build.
  fuzz-lockfile:
    name: fuzz lockfile
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: fuzz/Cargo.lock matches the workspace
        run: |
          if ! cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null; then
            echo "::error file=fuzz/Cargo.lock::fuzz/Cargo.lock is stale. Refresh it with: cargo metadata --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null"
            exit 1
          fi

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      # Every feature: a library feature no workspace member enables yet (the
      # aql rewrite of openehr-federation) still runs its tests.
      - run: cargo nextest run --profile ci --workspace --locked --all-features --no-tests=pass
      # The JUnit report of the offline run, for the conformance report.
      - name: Upload the offline JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-offline
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30
      # nextest does not run doctests, so they get their own compile.
      - run: cargo test --doc --workspace --locked --all-features

  # The container-backed suite (#39; no specification governs it: our own
  # design). Every such test checks FERROFED_E2E first and returns early without it, so the
  # test job above stays offline; this job sets the gate and runs the e2e
  # module of every crate against the digest-pinned images the testkit's
  # PinnedImage constants name and docs/VERSIONS.md repeats. The e2e-placement
  # guard keeps every gated test inside an e2e module, so this filter selects it.
  # It runs at nextest's default parallelism with no test group bounding it:
  # each test starts one PostgreSQL container holding a database per node,
  # never one container per node (#320).
  e2e:
    name: e2e (containers)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FERROFED_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      # The testkit's whole suite, and every other crate's container tests
      # alone, since the test job already runs the rest offline. Every
      # feature is on, so the PostgreSQL store's tests run too.
      - run: >-
          cargo nextest run --profile ci --locked --workspace --all-features
          -E 'package(ferrofed-testkit) or test(/^e2e::/)'
          --no-tests=pass
      # The JUnit report of the gated run, for the conformance report.
      - name: Upload the gated JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-gated
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30
      # The findings the node profile checks wrote for each harness CDR
      # product (section 16.2, #93), for the conformance report's node class.
      - name: Upload the node profile findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-profile
          path: target/conformance/node-profile/
          if-no-files-found: error
          retention-days: 30
      # The differential run against the reference implementation (#94)
      # writes one Markdown report and one TSV of differences per test, each
      # difference with its verdict; a run that never reached the report
      # leaves the directory empty, which the test failure already names.
      - name: Upload the differential report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-report
          path: target/differential/
          if-no-files-found: warn
          retention-days: 30

  # The conformance report of section 16.4 (#92; no specification governs its
  # form: our own design): every section 16.3 track and section 17 point as
  # pass, fail, not-run, deferred or open, joined from the conformance
  # markers and the JUnit reports of the offline and the gated run, where a
  # test under e2e:: counts only from the gated one. A Node or Operator point
  # is a class of its own, scored from the node profile findings of the gated
  # run (section 16.2) and never a gateway pass. It runs whatever those jobs
  # concluded, fails when a covered point or track did not pass, and uploads
  # target/conformance/ with report.md, report.tsv and node-profile.tsv.
  conformance-report:
    name: conformance report
    needs: [detect, test, e2e]
    if: ${{ !cancelled() && needs.detect.outputs.cargo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the offline JUnit report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-offline
          path: junit/offline
      - name: Download the gated JUnit report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-gated
          path: junit/gated
      - name: Download the node profile findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-profile
          path: node-profile
      - name: Write the report
        run: |
          set -euo pipefail
          status=0
          bash scripts/conformance/report.sh \
            --offline junit/offline/junit.xml \
            --gated junit/gated/junit.xml \
            --node-profile node-profile \
            --out target/conformance || status=$?
          cat target/conformance/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: target/conformance/
          if-no-files-found: error
          retention-days: 90

  # The release compose assets, deploy/compose/compose.yaml, ferrofed.toml and
  # registry.toml (no specification governs them: our own design). No compose
  # file in the repository may build the image, Docker Compose renders the
  # release file, and `ferrofed config check`, built here as a static musl
  # binary, accepts the two example files as attached, mounted where the
  # compose file mounts them in the pinned base image of docker/Dockerfile.
  # The same binary runs `config check` over the example Kubernetes
  # ConfigMap with synthetic secrets (scripts/checks/kubernetes-example.sh),
  # which kubeconform cannot do, and over the example the last release
  # attached, which, when refused, needs a pending upgrade note
  # (scripts/checks/upgrade-notes.sh), and over every TOML block of the book's
  # production guide, which it then serves behind deploy/nginx/ferrofed.conf
  # (scripts/checks/production-guide.sh). It sits in the Rust tier because the
  # checks need the binary; the runner image carries Docker Compose, jq and
  # openssl.
  release-compose:
    name: release compose
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-unknown-linux-musl
      # musl needs its C toolchain for the link step.
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - run: cargo build --locked -p ferrofed-server --bin ferrofed --target x86_64-unknown-linux-musl
      - run: bash scripts/checks/release-compose.sh target/x86_64-unknown-linux-musl/debug/ferrofed
      - run: bash scripts/checks/kubernetes-example.sh target/x86_64-unknown-linux-musl/debug/ferrofed
      # A change this build makes to what config check accepts needs an upgrade
      # note: the guard runs it over the example the last release attached.
      - run: bash scripts/checks/upgrade-notes.sh target/x86_64-unknown-linux-musl/debug/ferrofed
      - run: bash scripts/checks/production-guide.sh target/x86_64-unknown-linux-musl/debug/ferrofed

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The [workspace.lints.rustdoc] levels apply to every `cargo doc`; -D
      # turns a broken intra-doc link into a failed build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      # Reads the same RustSec advisory database as cargo-audit and adds
      # yanked, licences, bans and sources, so there is no separate audit job.
      - run: cargo deny check

  msrv:
    name: msrv (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack
      # The Cargo book's named tool for verifying the declared rust-version,
      # which it reads from the workspace `rust-version`.
      - run: cargo hack check --rust-version --workspace --locked --all-targets

  # Each published crate is one specification with a feature per layer or
  # profile, and the server, the identity crate and the engine have one feature
  # per regional binding (the Cargo
  # reference, Features; no specification governs the layout: our own
  # design), so every feature must build and lint on its own as well as
  # together. Per package, never the workspace all-features union.
  features:
    name: features (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack
      - run: >-
          cargo hack clippy --locked --each-feature --all-targets
          --package openehr-federation --package ihe-iti --package nl-generic-functions
          --package oauth-server-metadata --package ehds-logging --package eehrxf
          --package ferrofed-identity --package ferrofed-engine
          --package ferrofed-server
          -- -D warnings

  # The operator console, app/ferrofed-viewer (#275; no specification governs
  # it: our own design). The workspace lanes build, lint and test its server
  # half on the host; this job lints its browser half on the target it ships
  # to, so a dependency that cannot compile for wasm32 fails here, and builds
  # the release site bundle the release lane packs into the viewer image. The
  # console has no Cargo feature, so the cargo-hack feature run has nothing to
  # add for it.
  viewer:
    name: viewer (wasm32 and site bundle)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          target: wasm32-unknown-unknown
      - run: cargo clippy --locked -p ferrofed-viewer --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Install cargo-leptos
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-leptos@0.3.11
      - name: Install the wasm-bindgen CLI
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-bindgen@0.2.129
      - run: bash scripts/release/viewer-site.sh --release
      # The bundle's raw and compressed sizes go to the job summary, and the
      # step fails above the console's byte budget (no specification governs
      # this: our own design).
      - name: Measure the bundle against its budget
        run: bash scripts/checks/viewer-bundle.sh
      # The bundle names no home, runner, registry or toolchain directory of
      # the build host (no specification governs this: our own design).
      - name: Check the bundle names no build-host path
        run: bash scripts/checks/viewer-paths.sh

  # The operator console's browser journeys (#608; no specification governs
  # them: our own design). Every journey checks FERROFED_JOURNEYS first and
  # returns early without it, so the test and e2e jobs need no browser; this
  # job sets the gate, builds the release site bundle the console serves, and
  # drives headless Chrome through chromedriver, both at the Chrome for
  # Testing release docs/VERSIONS.md pins. A journey fails on any error the
  # browser logs. The e2e-placement guard keeps every gated journey in the
  # testkit's journeys module, so this filter selects it.
  journeys:
    name: journeys (browser)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FERROFED_JOURNEYS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
      - name: Install cargo-leptos
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-leptos@0.3.11
      - name: Install the wasm-bindgen CLI
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-bindgen@0.2.129
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest
      - name: Install Chrome and chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 154.0.8037.92
          install-chromedriver: true
      - run: bash scripts/release/viewer-site.sh --release
      - name: Start chromedriver
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          set -euo pipefail
          "$CHROMEDRIVER" --port=9515 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:9515/status
      - name: Run the journeys
        env:
          FERROFED_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          cargo nextest run --profile ci --locked -p ferrofed-testkit
          -E 'test(/^journeys::/)'

  # The library crates stay publishable while the workspace `publish` switch is
  # off (the Cargo reference, the `publish` field; no specification governs the
  # policy: our own design): `cargo package` builds
  # and verifies every crates/* tarball an upload would send, and once the
  # switch is on the script adds `cargo publish --dry-run` over the
  # publishable set. No cache, as in the publishing lane it rehearses.
  publish-dry-run:
    name: publish dry run (cargo package)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: bash scripts/release/publish-crates.sh package

  # A published crates.io version is immutable, so packaged content that
  # changes without a version bump is a defect nothing can repair after the
  # upload (the Cargo reference, Publishing on crates.io: a publish is
  # generally permanent). The script exits 0 while no
  # crates/* member exists. `no-crate-bump` is the escape for a diff that
  # provably does not alter packaged bytes. The script diffs from the merge
  # base of the two shas, so the full history is fetched, and a base that
  # moved on after the branch forked is never read as the branch's change.
  crate-version-guard:
    name: crate-version-guard
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-crate-bump')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Packaged crate content moved with its version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  # A pull request records its user-visible effect: it adds a fragment under
  # changelog.d/, or edits CHANGELOG.md while pull requests opened before the
  # fragments still land. `no-changelog` is the escape for a change with no
  # user-visible effect. Bots are skipped by author type, as the
  # contribution-licence guard skips them: a dependency or pin bump carries no
  # entry of its own. The script diffs from the merge base of the two shas, so
  # the full history is fetched.
  changelog-guard:
    name: changelog-guard
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.type != 'Bot'
      && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The pull request carries a changelog entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"

  dependency-review:
    name: dependency-review
    needs: detect
    # Pull requests only: the action compares the base..head dependency graph,
    # which a push has no diff for. Also gated on the workspace, so it stays
    # quiet while the repository has no manifest.
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a pull request that introduces a vulnerable or
          # disallowed-licence dependency. The licence policy mirrors
          # deny.toml once that file exists.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- The single required check -------------------------------------------

  # conclusion is the one status check the branch ruleset requires. It `needs`
  # every other job and runs on always(), so it reports even when every gated
  # Rust lane is skipped. It fails when a needed job failed or was cancelled
  # and passes when every result is success or skipped. The results arrive
  # through env:, never spliced into run: (the GitHub Actions security
  # hardening guide, script injection).
  conclusion:
    name: conclusion
    needs:
      - workflow-audit
      - workflow-lint
      - shellcheck
      - dockerfile-lint
      - kubernetes-manifests
      - observability
      - comment-style
      - file-length
      - versions
      - favicon-sync
      - copyright-holder
      - ihe-citations
      - bash-compat
      - script-modes
      - openehr-classes
      - conformance-matrix
      - obligations
      - e2e-placement
      - aql-splice
      - site-links
      - tracker-helpers
      - crate-version-guard-self-test
      - changelog
      - manifests
      - detect
      - fmt
      - fuzz-lockfile
      - clippy
      - test
      - e2e
      - conformance-report
      - release-compose
      - doc
      - cargo-deny
      - msrv
      - features
      - viewer
      - journeys
      - publish-dry-run
      - crate-version-guard
      - changelog-guard
      - dependency-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
