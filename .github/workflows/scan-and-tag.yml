# The image vulnerability gate and the tag application, as a REUSABLE
# workflow that release.yml calls once both images are pushed.
#
# The ORDER is the point: release-image.yml and release-console.yml push each
# image BY DIGEST with no tag, this workflow scans those digests, and only a
# passing scan makes them referencable by `<version>`, `<major>.<minor>` and
# `latest`. A failed scan leaves nothing a `docker pull` by tag would reach.
# No specification governs the gate: our own design, the one FerroEHR runs.
#
# The scan reads trivy.yaml (HIGH and CRITICAL, fixable only, the exceptions
# of .trivyignore.yaml). It passes no VEX: a fixable finding is fixed by a
# rebuild, and the release's vulnerability record, which runs before this
# workflow, judges every finding against security/vex/.
name: Scan and tag images (reusable)

on:
  workflow_call:
    inputs:
      gateway-digest:
        description: The gateway image's pushed index digest.
        required: true
        type: string
      gateway-tags:
        description: The newline-separated tag list to apply to the gateway digest.
        required: true
        type: string
      console-digest:
        description: The operator console image's pushed index digest.
        required: true
        type: string
      console-tags:
        description: The newline-separated tag list to apply to the console digest.
        required: true
        type: string

permissions: {}

env:
  # NOTE: an OCI reference is lowercase and github.repository_owner is FerroHEALTH, so the owner is a literal.
  GATEWAY: ghcr.io/ferrohealth/ferrofed
  CONSOLE: ghcr.io/ferrohealth/ferrofed-console
  TRIVY_VERSION: "0.73.0"

jobs:
  image-scan:
    name: image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # trivy.yaml and .trivyignore.yaml
      packages: read # pull the digests the caller pushed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # No cache: the lane decides whether a published artifact is tagged, so
      # nothing an earlier run wrote may influence its answer.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Each index is dual-arch and trivy reads one variant per invocation
      # (`--platform`), so every variant of both images is scanned.
      - name: Scan both images, both platforms
        env:
          GATEWAY_DIGEST: ${{ inputs.gateway-digest }}
          CONSOLE_DIGEST: ${{ inputs.console-digest }}
        run: |
          set -euo pipefail
          fail=0
          for ref in "${GATEWAY}@${GATEWAY_DIGEST}" "${CONSOLE}@${CONSOLE_DIGEST}"; do
            case "${ref#*@}" in
              sha256:*) ;;
              *) echo "::error::no pushed digest for ${ref%@*}" >&2; exit 1 ;;
            esac
            for platform in linux/amd64 linux/arm64; do
              echo "::group::${ref} ${platform}"
              trivy image --config trivy.yaml --scanners vuln --platform "$platform" \
                --exit-code 1 "$ref" || fail=1
              echo "::endgroup::"
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::an image carries a fixable HIGH or CRITICAL finding, so neither image is tagged; rebuild on a fixed base or dependency." >&2
            exit 1
          fi

  # Tags exist only after the scan passes. `imagetools create` over one source
  # re-tags the SAME digest, so the attestations bound to it stay valid.
  apply-tags:
    name: apply image tags (after the scan gate)
    needs: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write # tag the digests the caller pushed
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag the gateway image
        env:
          DIGEST: ${{ inputs.gateway-digest }}
          TAGS: ${{ inputs.gateway-tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no tag to apply to ${GATEWAY}" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "${GATEWAY}@${DIGEST}"

      - name: Tag the console image
        env:
          DIGEST: ${{ inputs.console-digest }}
          TAGS: ${{ inputs.console-tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no tag to apply to ${CONSOLE}" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "${CONSOLE}@${DIGEST}"
