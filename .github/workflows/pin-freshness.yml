# The freshness half of the pin discipline.
#
# scripts/checks/versions.sh catches drift between two files we control, and
# Dependabot bumps what its ecosystems read, which is `uses:` references and
# the manifests. Between the two sits a set of pins nothing watches: the
# actionlint, hadolint and kubeconform container images named inside a `run:`
# block, the analyzer versions handed to taiki-e/install-action as an input,
# the commits, release tags, FHIR package versions, document hashes, RFCs and
# dated W3C publications the vendored specification corpora are fetched at,
# the Chrome for Testing release the browser journeys install, and the
# container images the testkit harness starts, which are Rust constants. This
# workflow reads the newest upstream release, commit, registry version,
# served bytes, obsoleting RFC or registry tag of each and opens ONE issue
# when a pin is behind. Its `family` job reads every image another
# FerroHEALTH product publishes, pinned in docs/VERSIONS.md, against that
# product's latest release and image index digest, and opens one issue per
# image behind. Its last job watches the EU corpus for the acts
# Regulation (EU) 2025/327 still waits on.
#
# It opens an issue rather than failing: a weekly red job trains a maintainer
# to ignore red jobs, and a newer lint release is not a broken build.
name: Pin freshness

on:
  schedule:
    # Monday morning, after the weekly Dependabot run, so both arrive together.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    name: pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every unwatched pin with its newest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash scripts/checks/pin-freshness.sh > freshness.txt || status=$?
          cat freshness.txt
          # 0 every pin current, 1 at least one behind, 2 a release could not
          # be read. Only 1 opens an issue; 2 fails the job, because a pin that
          # could not be compared is not a pin known to be fresh.
          if [ "$status" -eq 2 ]; then
            echo "a release could not be read; the comparison is incomplete" >&2
            exit 1
          fi
          echo "stale=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open an issue when a pin is behind
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: A pinned CI tool, corpus or test image is behind its newest upstream release
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # --limit well past the open count: the default page is 30 issues,
          # and a report that scrolled off it would be reopened every week.
          open="$(gh issue list --state open --limit 500 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | length")"
          if [ "$open" -ne 0 ]; then
            echo "an open issue already carries this report; not opening a second"
            exit 0
          fi
          {
            echo "\`scripts/checks/pin-freshness.sh\` found a pin behind its newest upstream release or commit."
            echo
            echo "Bump the pin in \`docs/VERSIONS.md\` and in the file that repeats it, keep the local"
            echo "install on the same number, and re-run the gates. The digest beside an image tag"
            echo "moves with the tag, so read the new digest from the registry rather than guessing it."
            echo
            echo '```text'
            cat freshness.txt
            echo '```'
            echo
            echo "Reported by [this run]($RUN_URL)."
          } > body.md
          # fields.sh files the issue as a Task at Low priority and Low effort;
          # this job's default token may not read the organisation's issue
          # types, and then the issue lands with its label alone and whoever
          # picks it up sets the three.
          bash scripts/gh/fields.sh new task low low \
            --title "$TITLE" --body-file body.md --label ci

  # The product images of the family, each against the latest release of the
  # product that publishes it. Its own job, so a tool pin that could not be
  # read never hides a product pin that fell behind. One issue per image, kept
  # open and rewritten while the pin stays behind, so each product release
  # reaches the tracker under its own title.
  family:
    name: product image pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every product image pin with the product's latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash scripts/checks/pin-freshness.sh --family > family.txt || status=$?
          cat family.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open or update one issue per image behind its latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          awk '$1 == "STALE" { image = $2; sub(/:$/, "", image); print image }' family.txt | sort -u > behind.txt
          while read -r image; do
            if ! [[ "$image" =~ ^ghcr\.io/ferrohealth/[a-z0-9-]+$ ]]; then
              echo "not a product image: $image" >&2
              exit 1
            fi
            title="Pin behind the product's latest release: $image"
            {
              echo "\`scripts/checks/pin-freshness.sh --family\` found \`$image\` pinned behind the latest release of the product that publishes it."
              echo
              echo '```text'
              grep -F "STALE      $image: " family.txt
              echo '```'
              echo
              echo "Read the configuration changes the line names, move the pin in \`docs/VERSIONS.md\` and in every file"
              echo "that repeats it to the release's tag and index digest, with the configuration that release reads,"
              echo "and re-run the gates."
              echo
              echo "Reported by [this run]($RUN_URL)."
            } > body.md
            number="$(gh issue list --state open --limit 500 --json number,title \
              --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
              echo "updated #$number for $image"
            else
              # fields.sh files the issue as a Task at Medium priority and Low
              # effort; this job's default token may not read the
              # organisation's issue types, and then the issue lands with its
              # label alone.
              bash scripts/gh/fields.sh new task medium low \
                --title "$title" --body-file body.md --label chore
            fi
          done < behind.txt

      # 2 means an image or a release could not be read: the comparison is
      # incomplete, so the job fails after filing what it could compare.
      - name: Every product image pin was compared
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          if [ "$STATUS" -eq 2 ]; then
            echo "an image or a release could not be read; the comparison is incomplete" >&2
            exit 1
          fi

  # The adopted-acts half of the EU corpus: Regulation (EU) 2025/327 leaves
  # the harmonised components' content to acts not yet adopted, and
  # docs/specs/eu-ehds/ vendors each one once it is; docs/specs/eu-cra/ does
  # the same for Regulation (EU) 2024/2847, the Cyber Resilience Act. This
  # reads EUR-Lex for every act based on, amending or correcting either
  # Regulation and the Commission's Have your say register for the EHDS
  # initiatives, and opens one issue per new act and one when a watched
  # initiative moves.
  ehds-acts:
    name: EHDS and CRA acts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the acts and initiatives with the recorded ones
        id: check
        run: |
          set -uo pipefail
          status=0
          bash scripts/checks/ehds-acts.sh > ehds-acts.txt || status=$?
          cat ehds-acts.txt
          # 0 nothing new, 1 something new or moved, 2 a source could not be
          # read, which fails the job: a source that did not answer is not one
          # known to have nothing new.
          if [ "$status" -eq 2 ]; then
            echo "a source could not be read; the comparison is incomplete" >&2
            exit 1
          fi
          echo "changed=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open an issue per adopted act and one for the register
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGISTER_TITLE: An EHDS initiative moved or published in the Commission's Have your say register
        run: |
          set -euo pipefail
          # One issue per CELEX number, never a second for the same act: the
          # search covers closed issues too, so an act already handled is not
          # filed again before the vendor script pins it, and an act related
          # to both Regulations is filed once.
          awk '$1 == "NEW-ACT" && !seen[$2]++ { print $2, $3, $4 }' ehds-acts.txt | while read -r celex label kind; do
            if ! [[ "$celex" =~ ^[0-9]{5}[A-Z][0-9A-Z()]+$ ]]; then
              echo "not a CELEX number: $celex" >&2
              exit 1
            fi
            if ! [[ "$label" =~ ^[A-Z]+$ && "$kind" =~ ^(act|amendment|corrigendum)$ ]]; then
              echo "not a Regulation label and kind: $label $kind" >&2
              exit 1
            fi
            case "$kind" in
              corrigendum) title="$label corrigendum published: CELEX $celex" ;;
              *) title="$label $kind adopted: CELEX $celex" ;;
            esac
            found="$(gh issue list --state all --limit 100 --search "\"$celex\" in:title" --json title \
              --jq "[.[] | select(.title | endswith(\": CELEX $celex\"))] | length")"
            if [ "$found" -ne 0 ]; then
              echo "an issue already carries $celex; not opening a second"
              continue
            fi
            {
              echo "\`scripts/checks/ehds-acts.sh\` found a $kind of the $label Regulation that this repository has not recorded."
              echo
              echo '```text'
              grep -F "NEW-ACT    $celex " ehds-acts.txt
              echo '```'
              echo
              echo "EUR-Lex: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:$celex"
              echo
              echo "Read it, then pin it in \`scripts/vendor/eu.sh\` (its Cellar manifestation and sha256) or record"
              echo "in \`NOT_VENDORED\` of \`scripts/checks/ehds-acts.sh\` why it is not vendored, and"
              echo "name it where the act it implements is waited for."
              echo
              echo "Reported by [this run]($RUN_URL)."
            } > act.md
            # fields.sh files the issue as a Task at High priority and Low
            # effort; this job's default token may not read the organisation's
            # issue types, and then the issue lands with its label alone.
            bash scripts/gh/fields.sh new task high low \
              --title "$title" --body-file act.md --label chore
          done

          if grep -qE '^(MOVED|NEW-INITIATIVE|NEW-PUBLICATION|CHANGED|GONE) ' ehds-acts.txt; then
            open="$(gh issue list --state open --limit 500 --json number,title \
              --jq "[.[] | select(.title == \"$REGISTER_TITLE\")] | length")"
            if [ "$open" -ne 0 ]; then
              echo "an open issue already carries the register report; not opening a second"
              exit 0
            fi
            {
              echo "\`scripts/checks/ehds-acts.sh\` found an initiative on Regulation (EU) 2025/327 the repository has not recorded, a watched one at a new stage, or a publication of a watched one that is new, changed its feedback status or is gone. A draft open for feedback has a deadline: read it now."
              echo
              echo '```text'
              grep -E '^(MOVED|NEW-INITIATIVE|NEW-PUBLICATION|CHANGED|GONE) ' ehds-acts.txt
              echo '```'
              echo
              echo "Read the initiative at https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives_en,"
              echo "then record its id in \`KNOWN_INITIATIVES\`, its stage in \`WATCHED_INITIATIVES\` and its published"
              echo "publications with their feedback status in \`WATCHED_PUBLICATIONS\`."
              echo
              echo "Reported by [this run]($RUN_URL)."
            } > register.md
            bash scripts/gh/fields.sh new task medium low \
              --title "$REGISTER_TITLE" --body-file register.md --label chore
          fi
