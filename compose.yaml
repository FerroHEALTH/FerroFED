# SPDX-License-Identifier: BUSL-1.1
#
# The FerroFED quickstart: the gateway beside four member CDRs, four FerroEHR
# instances with their own system_ids, on one PostgreSQL server that holds a
# database per node (docs/architecture.md section 13). This one file is the
# whole quickstart: every release attaches it, every file it needs is inlined
# as a config at the end, and it needs Docker Compose 2.23.1 or newer:
#
#   curl -fsSLO https://github.com/FerroHEALTH/FerroFED/releases/latest/download/compose.yaml
#   mkdir -p secrets
#   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-384 -out secrets/signing-key.pem
#   chmod 644 secrets/signing-key.pem
#   docker compose up --wait
#   curl http://127.0.0.1:8080/health
#
# THE INLINED FILES. Each config at the end names its source in the
# repository, which the tests read, and scripts/quickstart/compose-configs.sh
# holds the copy to it. Compose refuses an inlined config in a read-only
# service, so the one-shot `files` and `ferroehr-init` services copy them onto
# volumes the read-only services mount.
#
# THE GATEWAY IMAGE. The service runs the published
# ghcr.io/ferrohealth/ferrofed image, which only the release lane builds
# (.github/workflows/release-image.yml); no compose file builds it. The tag
# default is the product version, and scripts/checks/versions.sh keeps it equal
# to the workspace version.
#
# WHAT RUNS. The gateway federates the four nodes below: the registry-toml
# config names them and the ferrofed-toml config configures the gateway, both
# mounted read-only. The gateway resolves every patient through
# FerroPIX, the FerroHEALTH patient index, as a PIXm Consumer: FerroFED keeps
# no patient index of its own. docker/quickstart/patients.tsv names four
# synthetic patients and their EHRs: a patient at all four nodes, one at two,
# one at one and one at none. The `ferropix-seed` service feeds FerroPIX
# those EHRs over ITI-104, and the `ehr-seed` service creates them at the
# nodes over ITS-REST, before the gateway starts. The seed fetches the
# Federation Tier reference implementation's demonstration template and
# compositions at a pinned commit and refuses a file whose SHA-256 differs.
#
# THE PATIENT INDEX. FerroPIX runs under its development profile on its own
# PostgreSQL, configured by the ferropix-toml config, with a development
# sealing key (the ferropix-data-key config), NOT for anything real. Its machines, the seed feeding it and the gateway asking it,
# sign in with client credentials tokens of the `ferropix-issuer` service,
# NAV's mock-oauth2-server, a development issuer that signs any client
# credentials request, NOT for anything real. FerroPIX reads an issuer's
# metadata at start and accepts plain http only on loopback (RFC 8414 §2),
# so it joins the issuer's network namespace, the issuer answers to the name
# `ferropix` on the compose network, and every token names the issuer as
# FerroPIX sees it, http://localhost:8180/ferrofed.
#
# THE CALLER'S TOKEN. The gateway trusts one development issuer, the `issuer`
# service, NAV's mock-oauth2-server, which signs a person's token for any
# client credentials request, NOT for anything real. The gateway reads an
# issuer's metadata and accepts plain http only on loopback (RFC 8414 §2), so
# it runs in the issuer's network namespace, the issuer service publishes the
# gateway's port and its own, and answers to the name `ferrofed` on the
# compose network. Ask it for a token on the host:
#
#   curl -s http://127.0.0.1:8190/quickstart/token -d grant_type=client_credentials \
#     -d client_id=quickstart-client -d client_secret=any | jq -r .access_token
#
# THE SIGNING KEY. The gateway signs the caller's identity onto every request
# to a node with its own key, the secret file ./secrets/signing-key.pem you
# write once, before the first `docker compose up`, as above, readable by
# every user, since the gateway runs as uid 65532 and Compose hands the file
# over as it is: a development key, NOT for anything real. Without it the
# gateway refuses to start.
#
# THE NODES. Each runs FerroEHR's documented image and stamps its own system_id
# into every EHR and version it creates. All four use FerroEHR's quickstart
# Basic-auth user, a development credential and NOT for anything real:
#
#   node A  http://127.0.0.1:8081/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#   node B  http://127.0.0.1:8082/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#   node C  http://127.0.0.1:8083/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#   node D  http://127.0.0.1:8084/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#
# THE DATABASE. One FerroEHR PostgreSQL container holds four databases,
# ferroehr_a to ferroehr_d, each owned by a login role of the same name whose
# password is that name followed by _example (ferroehr_a_example): development
# credentials, NOT for anything real.
# A database per node, never a schema per node, because FerroEHR creates fixed
# schema names in the database it connects to. Each database admits only its
# own node's role (CONNECT is revoked from PUBLIC), so one node's role is
# refused on another node's database. The nodes still share one server, its
# superuser and its cluster-wide group roles: no production boundary.
#
# PORTS. Every published port binds the loopback interface by default. A
# published port is DNAT'd ahead of the host firewall's own chains, so a port on
# 0.0.0.0 is reachable from the network even when the firewall says otherwise
# (https://docs.docker.com/engine/network/packet-filtering-firewalls/). To serve
# another machine, name the interface (FERROFED_BIND_HOST=10.0.0.7) or put a
# reverse proxy in front.
#
# IMAGES. Every image is pinned by tag and by the digest of its image index,
# and each pin is a row of docs/VERSIONS.md that scripts/checks/versions.sh
# holds equal to this file.

# Without this the project is named after the directory the file sits in, and
# the container, network and volume names move when the directory does.
name: ferrofed

# What the four nodes share; each service below merges it and adds its own
# database, system_id and port.
x-ferroehr-node: &ferroehr-node
  image: ghcr.io/ferrohealth/ferroehr:5.6.3@sha256:cd4e067a30c730a92b886c1669cd669eda9ffd3e47ddf727f28928738e197d62
  restart: unless-stopped
  depends_on:
    ferroehr-postgres:
      condition: service_healthy
  configs:
    - source: ferroehr-config
      target: /etc/ferroehr/ferroehr.toml
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  # NOT read_only: Compose refuses an inline config in a read-only service,
  # and the inline config below keeps the node configuration in this file.
  tmpfs:
    - /tmp
  healthcheck:
    test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  ferrofed:
    image: ghcr.io/ferrohealth/ferrofed:${FERROFED_VERSION:-0.0.18}
    container_name: ferrofed
    restart: unless-stopped
    # In the issuer's network namespace, so the issuer is on loopback (THE
    # CALLER'S TOKEN above); the issuer service publishes the gateway's port.
    network_mode: service:issuer
    depends_on:
      files:
        condition: service_completed_successfully
      issuer:
        condition: service_started
      ehr-seed:
        condition: service_completed_successfully
      ferropix-seed:
        condition: service_completed_successfully
      ferroehr-a:
        condition: service_healthy
      ferroehr-b:
        condition: service_healthy
      ferroehr-c:
        condition: service_healthy
      ferroehr-d:
        condition: service_healthy
    environment:
      # The image sets the same value; it is repeated here so the address the
      # container binds is visible in `docker compose config`.
      FERROFED__SERVER__LISTEN: 0.0.0.0:8080
      # `auto` renders pretty output on a terminal and JSON otherwise.
      FERROFED__TELEMETRY__FORMAT: ${FERROFED_LOG_FORMAT:-auto}
      FERROFED__TELEMETRY__FILTER: ${FERROFED_LOG_FILTER:-info}
      # The installation report to FerroPULSE: on by default, and
      # FERROFED__USAGE_REPORT__ENABLED=false in your shell or .env stops it.
      # What it sends and when:
      # https://ferrofed.eu/docs/operate/usage-report.html
      FERROFED__USAGE_REPORT__ENABLED: ${FERROFED__USAGE_REPORT__ENABLED:-true}
      FERROFED__USAGE_REPORT__DEPLOYMENT: compose
      # The instance id lives here, on the one writable volume.
      FERROFED__USAGE_REPORT__STATE_DIR: /var/lib/ferrofed/usage-report
      FERROFED_CONFIG: /etc/ferrofed/ferrofed.toml
    # The gateway's signing key ([signing]), the file you write before the
    # first `docker compose up`.
    secrets:
      - signing-key
    # The quickstart's configuration and registry document, which the files
    # service writes, read-only, so the root filesystem stays read-only too.
    volumes:
      - ferrofed-config:/etc/ferrofed:ro
      # The one writable path: the usage report's instance id. The image owns
      # /var/lib/ferrofed as the gateway's user, so a new volume does too.
      - ferrofed-state:/var/lib/ferrofed
    # Beside that volume the gateway writes nothing: no cache, no scratch
    # file, and every secret is read once at boot. So the root filesystem is
    # read-only with no tmpfs beside it.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    # Longer than the gateway's drain delay (server.drain_delay, 0), its
    # 30-second drain (server.shutdown_timeout) and the bindings' 5-second
    # drain (gateway.bindings_drain_timeout) of docker/quickstart/ferrofed.toml,
    # with 5 seconds for the export flush, so `docker compose down` never
    # kills a drain in progress; Docker's default stop timeout is 10 s.
    stop_grace_period: 40s
    # The image's own HEALTHCHECK, repeated so `docker compose up --wait`
    # visibly waits on it. Readiness gates on the gateway alone, so a member
    # node that is down never marks the gateway unhealthy. An image of a
    # release before v0.0.7 has no `healthcheck` subcommand, so with such a
    # FERROFED_VERSION the service never turns healthy and `--wait` fails.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrofed", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The development token issuer of the gateway's callers, and the owner of the
  # network namespace the gateway joins (THE CALLER'S TOKEN above). The client
  # credentials grant of `quickstart-client` returns a person's token: the
  # user `quickstart-user`, the gateway's audience, the scopes of a clinical
  # query, and the purpose of use the gateway records. `$$` is a literal `$`
  # to compose.
  issuer:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5@sha256:d88e445d55c4ff6eed59b02d86adfece47d985233b1616fb712669b98328c8a2
    restart: unless-stopped
    networks:
      default:
        aliases: [ferrofed]
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROFED_PORT:-8080}:8080"
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROFED_ISSUER_PORT:-8190}:8190"
    environment:
      # The gateway listens on 8080 in this namespace, so the issuer moves.
      SERVER_PORT: "8190"
      JSON_CONFIG: >-
        {"tokenCallbacks":[{"issuerId":"quickstart",
        "requestMappings":[{"requestParam":"grant_type","match":"client_credentials",
        "typeHeader":"at+jwt",
        "claims":{"iss":"http://localhost:8190/quickstart","sub":"quickstart-user",
        "client_id":"quickstart-client","aud":"ferrofed-quickstart",
        "scope":"user/aql-*.s user/composition-*.cruds user/template-*.cruds",
        "extensions":{"ihe_iua":{"subject_organization_id":"urn:oid:2.999.7",
        "purpose_of_use":[{"system":"http://terminology.hl7.org/CodeSystem/v3-ActReason","code":"TREAT"}]}}}}]}]}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Copies the inlined files onto the volumes the read-only services mount,
  # and exits. It runs the pinned PostgreSQL image below for its `cp`, with no
  # network; `-f` replaces a copy a later `up` finds there.
  files:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    user: "0:0"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp -f /files/ferrofed/* /ferrofed/ &&
        cp -f /files/ferropix/* /ferropix/ &&
        cp -f /files/ferropix-init/* /ferropix-init/ &&
        cp -f /files/seed/* /seed/
    configs:
      - source: ferrofed-toml
        target: /files/ferrofed/ferrofed.toml
      - source: registry-toml
        target: /files/ferrofed/registry.toml
      - source: ferropix-toml
        target: /files/ferropix/ferropix.toml
      - source: ferropix-data-key
        target: /files/ferropix/data-key
      - source: ferropix-role
        target: /files/ferropix-init/10-ferropix-role.sql
      - source: ferropix-seed-sh
        target: /files/seed/ferropix-seed.sh
      - source: ehr-seed-sh
        target: /files/seed/ehr-seed.sh
      - source: patients-tsv
        target: /files/seed/patients.tsv
    volumes:
      - ferrofed-config:/ferrofed
      - ferropix-config:/ferropix
      - ferropix-init:/ferropix-init
      - seed:/seed
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Copies FerroEHR PostgreSQL's own init script and, sorted after it, the
  # node databases script onto the volume the database mounts as its init
  # directory, and exits. It runs that same pinned image, with no network.
  ferroehr-init:
    image: ghcr.io/ferrohealth/ferroehr-postgres:5.6.3@sha256:5c976b9e7d1c363490bdb3ff2ed82bc8aefcb6b18e9ee3762124f7b5800abe7d
    user: "0:0"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
      - cp -f /docker-entrypoint-initdb.d/* /init/ && cp -f /files/20-ferrofed-node-databases.sh /init/
    configs:
      - source: node-databases
        target: /files/20-ferrofed-node-databases.sh
        # Executable, so the entrypoint runs the script rather than sourcing
        # it into its own shell.
        mode: 0555
    volumes:
      - ferroehr-init:/init
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The one database server of the four nodes, FerroEHR's own PostgreSQL image.
  ferroehr-postgres:
    image: ghcr.io/ferrohealth/ferroehr-postgres:5.6.3@sha256:5c976b9e7d1c363490bdb3ff2ed82bc8aefcb6b18e9ee3762124f7b5800abe7d
    restart: unless-stopped
    environment:
      # The development superuser password of FerroEHR's own quickstart.
      POSTGRES_PASSWORD: ${FERROEHR_POSTGRES_PASSWORD:-postgres}
      # The image's init script creates node A's role and database from the
      # PG_INIT_ keys; the script mounted below runs it again for each name in
      # FERROFED_NODE_DATABASES.
      PG_INIT_USER: ferroehr_a
      PG_INIT_PASSWORD: ferroehr_a_example
      PG_INIT_DB: ferroehr_a
      FERROFED_NODE_DATABASES: ferroehr_b ferroehr_c ferroehr_d
    depends_on:
      ferroehr-init:
        condition: service_completed_successfully
    volumes:
      - ferroehr-pgdata:/var/lib/postgresql
      # The image's own 10-ferroehr-init.sh and, sorted after it, the node
      # databases script, which the ferroehr-init service copies here.
      - ferroehr-init:/docker-entrypoint-initdb.d:ro
    # The entrypoint starts as root to chown the data directory and then drops
    # to `postgres`, so it keeps exactly the capabilities that needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    healthcheck:
      # Over TCP: the entrypoint's initialisation server listens on the Unix
      # socket alone, so the port answers only once every init script has run
      # and every node database exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ferroehr_a -d ferroehr_a"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # FerroPIX's PostgreSQL, the release FerroPIX pins for its own tests and
  # quickstart. The ferropix-role config, which the files service copies
  # below, creates the restricted role FerroPIX connects as.
  ferropix-postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      # A development superuser password, NOT for anything real.
      POSTGRES_PASSWORD: ${FERROPIX_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ferropix
    depends_on:
      files:
        condition: service_completed_successfully
    volumes:
      - ferropix-pgdata:/var/lib/postgresql
      - ferropix-init:/docker-entrypoint-initdb.d:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ferropix"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The development token issuer of FerroPIX's machines, and the owner of the
  # network namespace FerroPIX joins (THE PATIENT INDEX above). The client
  # credentials grant: the client as `sub` and `client_id`, FerroPIX's
  # audience, the scope asked for, and the issuer FerroPIX reads on loopback.
  # `$$` is a literal `$` to compose.
  ferropix-issuer:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5@sha256:d88e445d55c4ff6eed59b02d86adfece47d985233b1616fb712669b98328c8a2
    restart: unless-stopped
    networks:
      default:
        aliases: [ferropix]
    environment:
      # FerroPIX listens on 8080 in this namespace, so the issuer moves.
      SERVER_PORT: "8180"
      JSON_CONFIG: >-
        {"tokenCallbacks":[{"issuerId":"ferrofed",
        "requestMappings":[{"requestParam":"grant_type","match":"client_credentials",
        "claims":{"iss":"http://localhost:8180/ferrofed","sub":"$${clientId}",
        "client_id":"$${clientId}","aud":["http://ferropix:8080/fhir"],
        "scope":"$${scope}"}}]}]}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # FerroPIX, the patient index: its PIXm Manager answers the gateway's
  # ITI-83 and takes the seed's ITI-104 feed, in the issuer's network
  # namespace, as `ferropix` on the compose network.
  ferropix:
    image: ghcr.io/ferrohealth/ferropix:0.0.25@sha256:4fcbabdd21bfc8993c94afe9043c25e7c2a651b872aebbd4d86935ff4c57cba5
    restart: unless-stopped
    network_mode: service:ferropix-issuer
    depends_on:
      files:
        condition: service_completed_successfully
      ferropix-issuer:
        condition: service_started
      ferropix-postgres:
        condition: service_healthy
    environment:
      FERROPIX_CONFIG: /etc/ferropix/ferropix.toml
      # FerroPIX's installation report follows FerroFED's switch, so
      # FERROFED__USAGE_REPORT__ENABLED=false stops both.
      FERROPIX__USAGE_REPORT__ENABLED: ${FERROFED__USAGE_REPORT__ENABLED:-true}
    volumes:
      # The configuration and the sealing key the files service writes.
      - ferropix-config:/etc/ferropix:ro
      # The audit spool and the usage report's instance id.
      - ferropix-state:/var/lib/ferropix
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferropix", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ferropix-seed:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    restart: "no"
    depends_on:
      ferropix:
        condition: service_healthy
    environment:
      # The Patient Identity Source of the ferropix-toml config,
      # a client of the development issuer, which signs whatever secret it is
      # sent: a development credential, NOT for anything real.
      FERROPIX_CLIENT_ID: quickstart-source
      FERROPIX_CLIENT_SECRET: quickstart-source-example
    entrypoint: ["/bin/sh", "/seed/ferropix-seed.sh", "/seed/patients.tsv", "http://ferropix:8080/fhir", "http://ferropix:8180/ferrofed/token"]
    volumes:
      - seed:/seed:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Creates the EHRs of the patients at the four nodes over ITS-REST and
  # commits a demonstration composition to each (the ehr-seed-sh config), once
  # every node is healthy, before the gateway starts.
  ehr-seed:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    restart: "no"
    depends_on:
      files:
        condition: service_completed_successfully
      ferroehr-a:
        condition: service_healthy
      ferroehr-b:
        condition: service_healthy
      ferroehr-c:
        condition: service_healthy
      ferroehr-d:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/seed/ehr-seed.sh", "/seed/patients.tsv"]
    volumes:
      - seed:/seed:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  ferroehr-a:
    <<: *ferroehr-node
    environment:
      # FerroEHR reads only the configuration file this names, the inline
      # ferroehr-config below; each node sets it, since its own environment
      # replaces the anchor's.
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DB__URL: postgres://ferroehr_a:ferroehr_a_example@ferroehr-postgres:5432/ferroehr_a
      # The system_id the node stamps into every EHR and version it creates,
      # the one docker/quickstart/registry.toml declares for node-a.
      FERROEHR__REST__SYSTEM_ID: node-a.quickstart.local
      FERROEHR__TELEMETRY__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
      # FerroEHR's installation report to FerroPULSE: on by default, and
      # FERROEHR__USAGE_REPORT__ENABLED=false, or FerroFED's switch when that
      # is unset, in your shell or .env stops it.
      # What it sends and when:
      # https://ferroehr.eu/docs/latest/usage-report.html
      FERROEHR__USAGE_REPORT__ENABLED: ${FERROEHR__USAGE_REPORT__ENABLED:-${FERROFED__USAGE_REPORT__ENABLED:-true}}
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_A_PORT:-8081}:8080"

  ferroehr-b:
    <<: *ferroehr-node
    environment:
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DB__URL: postgres://ferroehr_b:ferroehr_b_example@ferroehr-postgres:5432/ferroehr_b
      FERROEHR__REST__SYSTEM_ID: node-b.quickstart.local
      FERROEHR__TELEMETRY__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
      FERROEHR__USAGE_REPORT__ENABLED: ${FERROEHR__USAGE_REPORT__ENABLED:-${FERROFED__USAGE_REPORT__ENABLED:-true}}
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_B_PORT:-8082}:8080"

  ferroehr-c:
    <<: *ferroehr-node
    environment:
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DB__URL: postgres://ferroehr_c:ferroehr_c_example@ferroehr-postgres:5432/ferroehr_c
      FERROEHR__REST__SYSTEM_ID: node-c.quickstart.local
      FERROEHR__TELEMETRY__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
      FERROEHR__USAGE_REPORT__ENABLED: ${FERROEHR__USAGE_REPORT__ENABLED:-${FERROFED__USAGE_REPORT__ENABLED:-true}}
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_C_PORT:-8083}:8080"

  ferroehr-d:
    <<: *ferroehr-node
    environment:
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DB__URL: postgres://ferroehr_d:ferroehr_d_example@ferroehr-postgres:5432/ferroehr_d
      FERROEHR__REST__SYSTEM_ID: node-d.quickstart.local
      FERROEHR__TELEMETRY__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
      FERROEHR__USAGE_REPORT__ENABLED: ${FERROEHR__USAGE_REPORT__ENABLED:-${FERROFED__USAGE_REPORT__ENABLED:-true}}
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_D_PORT:-8084}:8080"

configs:
  # FerroEHR's quickstart configuration, shared by the four nodes and inline
  # (`$` is escaped as `$$` against Compose interpolation). The Basic-auth user
  # is ferroehr / ferroehr (the hash is Argon2id of "ferroehr"): development
  # credentials only.
  ferroehr-config:
    content: |
      [server]
      listen = "0.0.0.0:8080"

      # The gateway resolves patients through FerroPIX and names each node's
      # own ehr_id, so a node keeps only its in-instance subject lookup.
      [ehr_index]
      provider = "local"

      [auth]
      enabled = true

      # FerroEHR checks the SMART on openEHR scopes a Basic user holds on
      # every route: these grant every resource family, and the product scope
      # admits the ADMIN and DEMOGRAPHIC APIs.
      [[auth.basic.users]]
      user = "ferroehr"
      password_hash = "$$argon2id$$v=19$$m=19456,t=2,p=1$$ZmVycm9laHJEZXZTYWx0$$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
      scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds", "__ferroehr.platform"]
      roles = ["ADMIN", "USER"]

      [authz.rbac]
      enabled = false

  # The files the quickstart needs, each a copy of its source in the
  # repository, which compose-configs.sh holds the copy to.
  ferrofed-toml:
    # source: docker/quickstart/ferrofed.toml
    content: |
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1
      #
      # The gateway configuration of the compose.yaml quickstart. It federates the
      # four nodes of registry.toml and sends each FerroEHR's quickstart Basic-auth
      # user: development credentials, NOT for anything real.
      #
      # A development profile: the gateway resolves each patient through the
      # quickstart's FerroPIX, the patient index compose.yaml runs beside it, as a
      # PIXm Consumer (ITI-83). FerroFED keeps no patient index of its own.
      # docker/quickstart/patients.tsv names the synthetic patients; the compose
      # `ferropix-seed` service feeds them to FerroPIX and the `ehr-seed` service
      # creates their EHRs at the nodes, so the two never disagree.
      #
      # The nodes and FerroPIX are reached over plain http inside the Docker
      # network, which only the development profile allows for a credential: the
      # gateway starts and names each credential that travels unencrypted in its
      # banner and its log.

      profile = "development"

      # compose.yaml sets FERROFED__SERVER__LISTEN. On SIGTERM the listener closes
      # at once, the requests in flight get the 30-second request timeout to
      # finish, and the bindings then get 5 seconds to stop their processes;
      # compose.yaml's stop_grace_period outlasts all three, and
      # scripts/checks/release-compose.sh holds it to them.
      [server]
      drain_delay = "0ms"
      shutdown_timeout = "30s"

      [gateway]
      bindings_drain_timeout = "5s"

      [registry]
      document = "/etc/ferrofed/registry.toml"

      [federation]
      # The federation's own identifier, which OPTIONS / names (§7a.2, N30).
      id = "quickstart"
      per_node_timeout = "10s"
      overall_timeout = "25s"
      # No localizer is configured, so every member's cross-reference decides where
      # a patient query goes (the ask-all node selection of the specification's
      # reference flow, Variant B).
      node_selection = "ask-all"

      # Every caller authenticates (§13.1, N25). The quickstart trusts one
      # development issuer, the `issuer` service of compose.yaml (NAV's
      # mock-oauth2-server), which signs a person's token for whoever asks:
      # development keys, NOT for anything real. The gateway reads an issuer's
      # metadata and accepts plain http only on loopback (RFC 8414 §2), so it runs in
      # the issuer's network namespace and names the issuer as it sees it there.
      # Its tokens name a person, signed in through the one client the quickstart
      # token names.
      [auth]

      [[auth.issuer]]
      issuer = "http://localhost:8190/quickstart"
      kind = "persons"
      audience = ["ferrofed-quickstart"]
      first_party_clients = ["quickstart-client"]

      # The gateway's own signing key, P-384 (ES384) here; a P-256 key signs
      # ES256. Every request to a node carries the caller's identity in an
      # openEHR-federation-client token signed with it (§13.1, N24), and the
      # gateway publishes its public half at jwks_uri.
      # The reader writes it into ./secrets/signing-key.pem before the first
      # `docker compose up`, which compose.yaml hands over as a secret: a
      # development key, NOT for anything real. The FerroEHR nodes of the
      # quickstart do not verify the token; a node that does fetches the key set
      # from jwks_uri, the gateway's address on the compose network.
      [signing]
      key_file = "/run/secrets/signing-key"
      jwks_uri = "http://ferrofed:8080/.well-known/jwks.json"

      [credentials."node-a-query".credentials]
      user = "ferroehr"
      password = "ferroehr"

      [credentials."node-b-query".credentials]
      user = "ferroehr"
      password = "ferroehr"

      [credentials."node-c-query".credentials]
      user = "ferroehr"
      password = "ferroehr"

      [credentials."node-d-query".credentials]
      user = "ferroehr"
      password = "ferroehr"

      # The patient index: FerroPIX's PIXm Manager on the compose network. Each
      # member's ehr_ids are one identifier domain there, as
      # docker/quickstart/patients.tsv names it, and the gateway asks as FerroPIX's
      # PIXm Consumer, under a client credentials token.
      [[pixm.manager]]
      url = "http://ferropix:8080/fhir/"

      [pixm.manager.members]
      "node-a" = "urn:oid:2.999.2.1"
      "node-b" = "urn:oid:2.999.2.2"
      "node-c" = "urn:oid:2.999.2.3"
      "node-d" = "urn:oid:2.999.2.4"

      # The PIXm Consumer's client credentials grant at the quickstart's
      # development token issuer (compose.yaml, the `ferropix-issuer` service),
      # which FerroPIX trusts; a development client secret, NOT for anything real.
      [pixm.manager.credentials.oauth]
      token_endpoint = "http://ferropix-issuer:8180/ferrofed/token"
      client_id = "ferrofed"
      client_auth = "client_secret_basic"
      client_secret = "ferrofed-consumer-example"
      scope = "system/Patient.rs"
  registry-toml:
    # source: docker/quickstart/registry.toml
    content: |
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1
      #
      # The registry document of the compose.yaml quickstart: the four member CDRs
      # the gateway federates, four FerroEHR instances as node A to node D, each
      # reached on the Compose network at its ITS-REST API root (the §12b.1
      # registry entry, N21; no specification governs the document format: our own
      # design). Each system_id is the one compose.yaml configures the node to
      # stamp. Every name here is quickstart-local.

      [[organisation]]
      id = "org-a"
      name = "Node A (FerroEHR)"

      [[organisation]]
      id = "org-b"
      name = "Node B (FerroEHR)"

      [[organisation]]
      id = "org-c"
      name = "Node C (FerroEHR)"

      [[organisation]]
      id = "org-d"
      name = "Node D (FerroEHR)"

      [[node]]
      id = "node-a"
      organisation = "org-a"
      system_id = "node-a.quickstart.local"

      [[node]]
      id = "node-b"
      organisation = "org-b"
      system_id = "node-b.quickstart.local"

      [[node]]
      id = "node-c"
      organisation = "org-c"
      system_id = "node-c.quickstart.local"

      [[node]]
      id = "node-d"
      organisation = "org-d"
      system_id = "node-d.quickstart.local"

      [[endpoint]]
      id = "node-a-query"
      node = "node-a"
      url = "http://ferroehr-a:8080/ferroehr/rest/openehr"
      connection_type = "openehr-rest-query"
      managing_organisation = "org-a"

      [[endpoint]]
      id = "node-b-query"
      node = "node-b"
      url = "http://ferroehr-b:8080/ferroehr/rest/openehr"
      connection_type = "openehr-rest-query"
      managing_organisation = "org-b"

      [[endpoint]]
      id = "node-c-query"
      node = "node-c"
      url = "http://ferroehr-c:8080/ferroehr/rest/openehr"
      connection_type = "openehr-rest-query"
      managing_organisation = "org-c"

      [[endpoint]]
      id = "node-d-query"
      node = "node-d"
      url = "http://ferroehr-d:8080/ferroehr/rest/openehr"
      connection_type = "openehr-rest-query"
      managing_organisation = "org-d"
  patients-tsv:
    # source: docker/quickstart/patients.tsv
    content: |
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1
      #
      # The quickstart's synthetic patients, one line per EHR: the member, the
      # ehr_id, the patient's identifier namespace and value, and the member's
      # ehr_id domain at FerroPIX. Every identifier lies inside the example arc
      # urn:oid:2.999 that ITU-T X.660 reserves for examples, and each EHR's first
      # group names its node and its last group its patient.
      #
      # docker/quickstart/ehr-seed.sh creates each EHR at its node from these lines,
      # and docker/quickstart/ferropix/seed.sh feeds FerroPIX the same lines over
      # ITI-104, so the nodes and the patient index agree on every ehr_id. The
      # domains are the ones docker/quickstart/ferrofed.toml maps each member to in
      # [pixm.manager.members]. ffd-test-0004 has an EHR at no node, so it has no
      # line.
      node-a	aaaaaaaa-aaaa-4aaa-8aaa-000000000001	urn:oid:2.999.1.1	ffd-test-0001	urn:oid:2.999.2.1
      node-b	bbbbbbbb-bbbb-4bbb-8bbb-000000000001	urn:oid:2.999.1.1	ffd-test-0001	urn:oid:2.999.2.2
      node-c	cccccccc-cccc-4ccc-8ccc-000000000001	urn:oid:2.999.1.1	ffd-test-0001	urn:oid:2.999.2.3
      node-d	dddddddd-dddd-4ddd-8ddd-000000000001	urn:oid:2.999.1.1	ffd-test-0001	urn:oid:2.999.2.4
      node-b	bbbbbbbb-bbbb-4bbb-8bbb-000000000002	urn:oid:2.999.1.1	ffd-test-0002	urn:oid:2.999.2.2
      node-d	dddddddd-dddd-4ddd-8ddd-000000000002	urn:oid:2.999.1.1	ffd-test-0002	urn:oid:2.999.2.4
      node-c	cccccccc-cccc-4ccc-8ccc-000000000003	urn:oid:2.999.1.1	ffd-test-0003	urn:oid:2.999.2.3
  ehr-seed-sh:
    # source: docker/quickstart/ehr-seed.sh
    content: |
      #!/bin/sh
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1
      # Seeds the quickstart's four FerroEHR nodes with the synthetic patients of
      # docker/quickstart/patients.tsv, over each node's ITS-REST API and nothing
      # else (no specification governs the seed: our own design). compose.yaml runs
      # it once, in the `ehr-seed` service, before the gateway starts.
      #
      # For each row it creates the EHR with PUT /v1/ehr/{ehr_id}, its
      # EHR_STATUS.subject naming the patient, and commits one demonstration
      # composition to it with POST /v1/ehr/{ehr_id}/composition; each node first
      # takes the operational template through POST /v1/definition/template/adl1.4.
      # The template and the compositions are the Federation Tier reference
      # implementation's synthetic demo data, fetched at the commit docs/VERSIONS.md
      # pins and refused unless each file has the SHA-256 recorded below, the bytes
      # vendored under docs/specs/federation-ref/docker/demo-data/.
      #
      # Re-running is safe: a node that already holds the template or an EHR answers
      # 409, which the seed reports and passes, and a composition is committed only
      # to an EHR this run created.
      #
      # Usage: ehr-seed.sh PATIENTS, with the nodes reached as http://ferroehr-a:8080
      # to http://ferroehr-d:8080 on the compose network, or the URL each
      # FERROEHR_<A..D>_URL names, and the development user in FERROEHR_USER and
      # FERROEHR_PASSWORD. Exit 1 naming the step a node refused or the file that
      # did not verify; 0 once every row is in place.
      set -eu

      patients="$$1"
      user_pass="$${FERROEHR_USER:-ferroehr}:$${FERROEHR_PASSWORD:-ferroehr}"
      readonly DEMO=https://raw.githubusercontent.com/syntaric/openehr-federation-ref/9cb8606d1fce457b6b7f3a42f703d7069686a413/docker/demo-data
      work="$$(mktemp -d)"
      trap 'rm -rf "$$work"' EXIT

      die() {
        echo "ehr-seed: $$*" >&2
        exit 1
      }

      # fetch NAME FILE SHA256: downloads the demo file NAME (URL-encoded) to FILE
      # and refuses it unless its SHA-256 is SHA256.
      fetch() {
        curl -fsS --retry 5 --retry-all-errors -o "$$2" "$$DEMO/$$1" || die "the demo file $$1 could not be fetched"
        printf '%s  %s\n' "$$3" "$$2" | sha256sum -c - > /dev/null || die "the demo file $$1 does not have the pinned SHA-256"
      }

      fetch 'International%20Patient%20Summary.opt' "$$work/template.opt" fa7148549a2140a12d8aad32a0c8c2e5935660578b657a85cf8576ddea8cac3c
      fetch composition-12345-clinic.json "$$work/12345-clinic.json" 17275197e5a1bb1202db8496242fa82db6ff50f90ebc8a4eb4b0f25dc12bc3e9
      fetch composition-12345-hospital.json "$$work/12345-hospital.json" ba705e3ae796f6180d4d70f79b2166b4d00a2bf255d44d22a4d35287d1429c8e
      fetch composition-67890-clinic.json "$$work/67890-clinic.json" 5d2f47aad73271a4bb59cbdb644b03be78a3c3a160e6f644548cf364eb07be3c
      fetch composition-67890-hospital.json "$$work/67890-hospital.json" 508a09bd53c29e5a7538b8512eed169e20973ff9bc6be7281e994bd9eef0d0e0

      # api_root MEMBER: the URL of the member's ITS-REST API root.
      api_root() {
        case "$$1" in
          node-a) printf '%s' "$${FERROEHR_A_URL:-http://ferroehr-a:8080}" ;;
          node-b) printf '%s' "$${FERROEHR_B_URL:-http://ferroehr-b:8080}" ;;
          node-c) printf '%s' "$${FERROEHR_C_URL:-http://ferroehr-c:8080}" ;;
          node-d) printf '%s' "$${FERROEHR_D_URL:-http://ferroehr-d:8080}" ;;
          *) die "member '$$1' is not a quickstart node" ;;
        esac
        printf '/ferroehr/rest/openehr'
      }

      # call METHOD URL CONTENT_TYPE BODY_FILE: sends one request and prints the
      # status; the answer body is kept in $$work/answer for a refusal message.
      call() {
        curl -sS -u "$$user_pass" -X "$$1" "$$2" \
          -H "Content-Type: $$3" -H 'Accept: application/json' \
          -H 'Prefer: return=minimal' --data-binary "@$$4" \
          -o "$$work/answer" -w '%{http_code}'
      }

      # accept STEP STATUS: 0 when the node created the resource, 1 when it already
      # held it (409); any other status ends the run.
      accept() {
        case "$$2" in
          200 | 201 | 204) return 0 ;;
          409)
            echo "  $$1: already there"
            return 1
            ;;
          *) die "$$1 was answered $$2: $$(head -c 400 "$$work/answer")" ;;
        esac
      }

      awk -F '\t' '!/^#/ && NF >= 4 { print $$1, $$2, $$3, $$4 }' "$$patients" > "$$work/rows"
      count="$$(wc -l < "$$work/rows" | tr -d ' ')"
      [ "$$count" -gt 0 ] || die "$$patients holds no patient"

      seen=" "
      while read -r member ehr_id namespace value; do
        printf '%s' "$$ehr_id" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$' ||
          die "row for $$member: '$$ehr_id' is not a version 4 UUID"
        printf '%s' "$$namespace" | grep -qE '^urn:oid:2\.999(\.[0-9]+)*$$' ||
          die "row for $$member: the namespace lies outside the example arc urn:oid:2.999"
        printf '%s' "$$value" | grep -qE '^[A-Za-z0-9-]+$$' ||
          die "row for $$member: the identifier value is not a plain synthetic token"
        root="$$(api_root "$$member")"

        case "$$seen" in
          *" $$member "*) ;;
          *)
            echo "$$member: template"
            status="$$(call POST "$$root/v1/definition/template/adl1.4" application/xml "$$work/template.opt")"
            if accept "POST /v1/definition/template/adl1.4" "$$status"; then echo "  created"; fi
            seen="$$seen$$member "
            ;;
        esac

        echo "$$member: EHR $$ehr_id for $$value"
        printf '%s' "{\"_type\":\"EHR_STATUS\",\"archetype_node_id\":\"openEHR-EHR-EHR_STATUS.generic.v1\",\
      \"name\":{\"_type\":\"DV_TEXT\",\"value\":\"EHR Status\"},\
      \"archetype_details\":{\"_type\":\"ARCHETYPED\",\"archetype_id\":{\"_type\":\"ARCHETYPE_ID\",\
      \"value\":\"openEHR-EHR-EHR_STATUS.generic.v1\"},\"rm_version\":\"1.1.0\"},\
      \"subject\":{\"_type\":\"PARTY_SELF\",\"external_ref\":{\"_type\":\"PARTY_REF\",\
      \"id\":{\"_type\":\"GENERIC_ID\",\"value\":\"$$value\",\"scheme\":\"ffd-test\"},\
      \"namespace\":\"$$namespace\",\"type\":\"PERSON\"}},\"is_queryable\":true,\"is_modifiable\":true}" \
          > "$$work/ehr_status.json"
        status="$$(call PUT "$$root/v1/ehr/$$ehr_id" application/json "$$work/ehr_status.json")"
        accept "PUT /v1/ehr/$$ehr_id" "$$status" || continue
        echo "  created"

        # The first patient's demo composition for patient 0001, the second's for
        # every other, as a hospital records it at node A and C and a clinic at B
        # and D.
        case "$$value" in *-0001) story=12345 ;; *) story=67890 ;; esac
        case "$$member" in node-a | node-c) setting=hospital ;; *) setting=clinic ;; esac
        status="$$(call POST "$$root/v1/ehr/$$ehr_id/composition" application/json "$$work/$$story-$$setting.json")"
        if accept "POST /v1/ehr/$$ehr_id/composition" "$$status"; then echo "  composition committed"; fi
      done < "$$work/rows"

      echo "ehr-seed: done, $$count EHRs in place"
  ferropix-toml:
    # source: docker/quickstart/ferropix/ferropix.toml
    content: |
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1
      #
      # The configuration of the quickstart's FerroPIX, the patient index the
      # gateway resolves every patient through (compose.yaml, the `ferropix`
      # service): FerroPIX's development profile, whose machines sign in with the
      # development issuer's client credentials tokens, NOT for anything real.
      # Every key is listed in FerroPIX's book,
      # https://ferropix.eu/docs/operate/configuration.html.

      profile = "development"
      public_base_url = "http://ferropix:8080"

      [server]
      listen = "0.0.0.0:8080"

      [db]
      url = "postgresql://ferropix:ferropix_example@ferropix-postgres:5432/ferropix"
      data_key_file = "/etc/ferropix/data-key"

      # The development token issuer the quickstart runs beside FerroPIX
      # (compose.yaml, the `ferropix-issuer` service), NAV's mock-oauth2-server.
      # FerroPIX reads an issuer's metadata at start and accepts plain http only
      # on loopback (RFC 8414 §2), so FerroPIX joins the issuer's network
      # namespace and reaches it on localhost, and the issuer names itself so in
      # every token, whoever asks for it. It
      # signs the client credentials tokens of the seed, the Patient Identity Source
      # of every domain, and of the gateway, the PIXm Consumer: a token whose `sub`
      # is its client is a machine's (RFC 9068 §2.2). It signs with `typ` JWT and
      # names the client in `client_id`, so the issuer takes the claims it carries.
      # A development issuer, NOT for anything real.
      [[auth.issuer]]
      issuer = "http://localhost:8180/ferrofed"
      kind = "persons"
      profile = "rfc9068"
      audience = ["http://ferropix:8080/fhir"]
      token_types = ["JWT"]
      required_claims = ["iss", "exp", "aud", "sub"]
      client_claims = ["client_id", "azp"]

      # The client the development issuer may vouch for as the Source of each
      # domain (PIXm 3.1.0 §2:3.104.5).
      [[trust.issuer]]
      issuer = "http://localhost:8180/ferrofed"
      clients = ["quickstart-source"]

      # The patient's namespace is authoritative, so FerroPIX links each member's
      # record of one patient through it; each member's ehr_ids are a local domain.
      [[domain]]
      system = "urn:oid:2.999.1.1"
      name = "Quickstart patients"
      kind = "authoritative"
      source_client_id = "quickstart-source"

      [[domain]]
      system = "urn:oid:2.999.2.1"
      name = "Node A ehr_ids"
      kind = "local"
      source_client_id = "quickstart-source"

      [[domain]]
      system = "urn:oid:2.999.2.2"
      name = "Node B ehr_ids"
      kind = "local"
      source_client_id = "quickstart-source"

      [[domain]]
      system = "urn:oid:2.999.2.3"
      name = "Node C ehr_ids"
      kind = "local"
      source_client_id = "quickstart-source"

      [[domain]]
      system = "urn:oid:2.999.2.4"
      name = "Node D ehr_ids"
      kind = "local"
      source_client_id = "quickstart-source"

      [usage_report]
      deployment = "compose"
      state_dir = "/var/lib/ferropix"

      [dev]
      loopback = false
  ferropix-data-key:
    # source: docker/quickstart/ferropix/data-key
    content: |
      ZmVycm9mZWQtcXVpY2tzdGFydC1kZXYta2V5LTAwMDE=
  ferropix-role:
    # source: docker/quickstart/ferropix/10-ferropix-role.sql
    content: |
      -- SPDX-FileCopyrightText: Cadasto B.V.
      -- SPDX-License-Identifier: BUSL-1.1
      --
      -- The restricted role FerroPIX connects as: CREATE on its database and
      -- nothing else, as FerroPIX's own quickstart creates it. A development
      -- password, NOT for anything real.
      CREATE ROLE ferropix LOGIN PASSWORD 'ferropix_example';
      GRANT CREATE ON DATABASE ferropix TO ferropix;
  ferropix-seed-sh:
    # source: docker/quickstart/ferropix/seed.sh
    content: |
      #!/bin/sh
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1
      # Feeds the quickstart's FerroPIX the synthetic patients of
      # docker/quickstart/patients.tsv over ITI-104, the PIXm Patient Identity Feed
      # (IHE PIXm 3.1.0 §2:3.104), as each member's Patient Identity Source would:
      # one conditional update per EHR, PUT [base]/Patient?identifier=<the member's
      # ehr_id domain>|<ehr_id>, of a Patient carrying that ehr_id and the
      # patient's identifier, whose authoritative domain links the members'
      # records into one patient. compose.yaml runs it once, in the `ferropix-seed`
      # service, before the gateway starts (no specification governs the seed: our
      # own design).
      #
      # Re-running is safe: a record FerroPIX holds already is answered 200 and
      # replaced with the same content.
      #
      # Usage: seed.sh PATIENTS BASE TOKEN_ENDPOINT, with the Source's client in
      # FERROPIX_CLIENT_ID and FERROPIX_CLIENT_SECRET (development values). The seed
      # feeds as a machine, under a client credentials token of the development
      # issuer (RFC 6749 §4.4), since FerroPIX admits a Patient Identity Source only
      # so. Exit 1 naming the line FerroPIX refused, or the token not obtained; 0
      # once every line is fed.
      set -eu

      patients="$$1"
      base="$$2"
      token_endpoint="$$3"
      fed=0

      answer="$$(curl -sS -u "$$FERROPIX_CLIENT_ID:$$FERROPIX_CLIENT_SECRET" \
        -d grant_type=client_credentials -d scope=system/Patient.cud "$$token_endpoint")"
      token="$$(printf '%s' "$$answer" | sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p')"
      [ -n "$$token" ] || {
        echo "seed: the issuer at $$token_endpoint gave the Source no token" >&2
        exit 1
      }

      while IFS="$$(printf '\t')" read -r member ehr_id namespace value domain; do
        case "$$member" in
          '' | '#'*) continue ;;
          *) ;;
        esac
        body="{\"resourceType\":\"Patient\",\"identifier\":[\
      {\"system\":\"$$domain\",\"value\":\"$$ehr_id\"},\
      {\"system\":\"$$namespace\",\"value\":\"$$value\"}],\
      \"name\":[{\"family\":\"Synthetic\",\"given\":[\"$$value\"]}]}"
        status="$$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
          -H "Authorization: Bearer $$token" \
          -H 'Content-Type: application/fhir+json' -H 'Accept: application/fhir+json' \
          --data-binary "$$body" \
          "$$base/Patient?identifier=$$domain%7C$$ehr_id")"
        case "$$status" in
          200 | 201) echo "$$member: $$value fed ($$status)" ;;
          *)
            echo "seed: FerroPIX answered $$status for $$member's record of $$value" >&2
            exit 1
            ;;
        esac
        fed=$$((fed + 1))
      done <"$$patients"

      [ "$$fed" -gt 0 ] || {
        echo "seed: $$patients holds no patient" >&2
        exit 1
      }
      echo "seed: $$fed records fed"
  node-databases:
    # source: docker/postgres/20-ferrofed-node-databases.sh
    content: |
      #!/usr/bin/env bash
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1
      # One database per member node on one FerroEHR PostgreSQL server (no
      # specification governs this: our own design).
      #
      # Mounted into /docker-entrypoint-initdb.d of the FerroEHR PostgreSQL image,
      # whose entrypoint runs the init scripts in sorted order once, on an empty data
      # directory. The image's own 10-ferroehr-init.sh has by then created the first
      # node's role and database from PG_INIT_USER, PG_INIT_PASSWORD and PG_INIT_DB.
      # This script runs that same script once more for every name in
      # FERROFED_NODE_DATABASES, with the three PG_INIT_ variables set to the name,
      # so each further node gets a login role of that name owning a database of that
      # name. The image's script creates the cluster-wide group roles only where they
      # are missing, so the nodes share them.
      #
      # Every node database, the first included, then admits only its own node's
      # role: CONNECT is revoked from PUBLIC and granted to that role, so one node's
      # role is refused on another node's database.
      #
      # Development credentials only: each role's password is its name followed by
      # `_example`, and the first node's PG_INIT_PASSWORD keeps that form too.
      #
      # Usage (as the image's entrypoint runs it):
      #   FERROFED_NODE_DATABASES="ferroehr_b ferroehr_c" 20-ferrofed-node-databases.sh
      set -Eeuo pipefail

      readonly IMAGE_INIT=/docker-entrypoint-initdb.d/10-ferroehr-init.sh

      if [[ ! -x "$$IMAGE_INIT" ]]; then
        echo "ferrofed init: $$IMAGE_INIT is missing or not executable" >&2
        exit 1
      fi

      # is_identifier NAME: whether NAME is a plain lower-case PostgreSQL identifier,
      # the only form spliced into SQL here and by the image's script.
      is_identifier() {
        local name="$$1"
        [[ "$$name" =~ ^[a-z_][a-z0-9_]{0,62}$$ ]]
      }

      # The first node's role and database, as the image's script defaults them.
      first_role="$${PG_INIT_USER:-ferroehr}"
      first_db="$${PG_INIT_DB:-ferroehr}"
      for name in "$$first_role" "$$first_db"; do
        if ! is_identifier "$$name"; then
          echo "ferrofed init: '$$name' is not a lower-case PostgreSQL identifier" >&2
          exit 1
        fi
      done

      read -r -a names <<<"$${FERROFED_NODE_DATABASES:-}"
      for name in "$${names[@]}"; do
        if ! is_identifier "$$name"; then
          echo "ferrofed init: '$$name' is not a lower-case PostgreSQL identifier" >&2
          exit 1
        fi
        echo "ferrofed init: node database '$$name'"
        PG_INIT_USER="$$name" PG_INIT_PASSWORD="$${name}_example" PG_INIT_DB="$$name" "$$IMAGE_INIT"
      done

      # restrict DATABASE ROLE: only ROLE (and the superuser) may connect to DATABASE.
      restrict() {
        echo "ferrofed init: database '$$1' admits role '$$2' alone"
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<SQL
      REVOKE CONNECT ON DATABASE "$$1" FROM PUBLIC;
      GRANT CONNECT ON DATABASE "$$1" TO "$$2";
      SQL
      }

      restrict "$$first_db" "$$first_role"
      for name in "$${names[@]}"; do
        restrict "$$name" "$$name"
      done

secrets:
  # The gateway's signing key ([signing]), a P-384 key you write once.
  signing-key:
    file: ${FERROFED_SIGNING_KEY_FILE:-./secrets/signing-key.pem}

volumes:
  ferrofed-config:
  ferropix-config:
  ferropix-init:
  ferroehr-init:
  seed:
  ferrofed-state:
  ferroehr-pgdata:
  ferropix-pgdata:
  ferropix-state:
