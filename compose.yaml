#
# The FerroFED quickstart: the gateway beside two member CDRs, two FerroEHR
# instances with their own databases and system_ids (docs/architecture.md
# section 13, decision A44).
#
#   docker compose up --wait
#   curl http://127.0.0.1:8080/health
#
# THE GATEWAY IMAGE. ghcr.io/ferrohealth/ferrofed is published by the image
# lane (#31) for every release cut after it landed. v0.0.1 predates the lane
# and has no image, so for that version the service builds the same recipe from
# the binaries of the published release, staged first:
#
#   scripts/release/stage-dist.sh 0.0.1
#   docker compose up --build --wait
#
# The tag default is the product version, and scripts/checks/versions.sh keeps
# it equal to the workspace version.
#
# WHAT RUNS. The gateway federates the two nodes below: docker/quickstart/
# registry.toml names them and docker/quickstart/ferrofed.toml configures the
# gateway, both mounted read-only. `POST /v1/query/aql` answers one federated
# RESULT_SET over both (#38), from the release that carries it; every other
# path under `/v1/` answers `501`. No identity binding is configured, so a
# query that names a patient fails closed with 424; the README shows a query
# that names none.
#
# THE NODES. Each runs FerroEHR's documented image on its own FerroEHR
# PostgreSQL image, and stamps its own system_id into every EHR and version it
# creates. Both use FerroEHR's quickstart Basic-auth user, a development
# credential and NOT for anything real:
#
#   node A  http://127.0.0.1:8081/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#   node B  http://127.0.0.1:8082/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#
# PORTS. Every published port binds the loopback interface by default. A
# published port is DNAT'd ahead of the host firewall's own chains, so a port on
# 0.0.0.0 is reachable from the network even when the firewall says otherwise
# (https://docs.docker.com/engine/network/packet-filtering-firewalls/). To serve
# another machine, name the interface (FERROFED_BIND_HOST=10.0.0.7) or put a
# reverse proxy in front.
#
# IMAGES. Every image is pinned by tag and by the digest of its image index,
# and each pin is a row of docs/VERSIONS.md that scripts/checks/versions.sh
# holds equal to this file.

# Without this the project is named after the directory the file sits in, and
# the container, network and volume names move when the directory does.
name: ferrofed

services:
  ferrofed:
    image: ghcr.io/ferrohealth/ferrofed:${FERROFED_VERSION:-0.0.6}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ferrofed
    restart: unless-stopped
    depends_on:
      ferroehr-a:
        condition: service_healthy
      ferroehr-b:
        condition: service_healthy
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROFED_PORT:-8080}:8080"
    environment:
      # The image sets the same value; it is repeated here so the address the
      # container binds is visible in `docker compose config`.
      FERROFED__SERVER__LISTEN: 0.0.0.0:8080
      # `auto` renders pretty output on a terminal and JSON otherwise.
      FERROFED__TELEMETRY__FORMAT: ${FERROFED_LOG_FORMAT:-auto}
      FERROFED__TELEMETRY__FILTER: ${FERROFED_LOG_FILTER:-info}
      FERROFED_CONFIG: /etc/ferrofed/ferrofed.toml
    # The quickstart's configuration and registry document, read-only, so the
    # root filesystem stays read-only as well.
    volumes:
      - ./docker/quickstart/ferrofed.toml:/etc/ferrofed/ferrofed.toml:ro
      - ./docker/quickstart/registry.toml:/etc/ferrofed/registry.toml:ro
    # The gateway writes nothing: no cache, no scratch file, and every secret is
    # read once at boot. So the root filesystem is read-only with no tmpfs
    # beside it.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 8192
        hard: 16384

  # Node A, FerroEHR, on its own PostgreSQL image.
  ferroehr-a-postgres:
    image: ghcr.io/rubentalstra/ferroehr-postgres:4.3.1@sha256:17d5772dba1c6689fccb1095a8774f3ed636f4968256a37fc505207ca75a99b9
    restart: unless-stopped
    environment:
      # Development defaults of FerroEHR's own quickstart; the image's init
      # script creates the role and the database from the PG_INIT_ keys.
      POSTGRES_PASSWORD: ${FERROEHR_POSTGRES_PASSWORD:-postgres}
      PG_INIT_USER: ferroehr
      PG_INIT_PASSWORD: ferroehr
      PG_INIT_DB: ferroehr
    volumes:
      - ferroehr-a-pgdata:/var/lib/postgresql
    # The entrypoint starts as root to chown the data directory and then drops
    # to `postgres`, so it keeps exactly the capabilities that needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferroehr -d ferroehr"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ferroehr-a:
    image: ghcr.io/rubentalstra/ferroehr:4.3.1@sha256:b64f752aefe010629191f8c1d990d286c6ed28a62e457300a237a596f1116ac6
    restart: unless-stopped
    depends_on:
      ferroehr-a-postgres:
        condition: service_healthy
    environment:
      FERROEHR__DB__URL: postgres://ferroehr:ferroehr@ferroehr-a-postgres:5432/ferroehr
      # The system_id the node stamps into every EHR and version it creates,
      # the one docker/quickstart/registry.toml declares for node-a.
      FERROEHR__SERVER__SYSTEM_ID: node-a.quickstart.local
      FERROEHR__LOG__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
    configs:
      - source: ferroehr-config
        target: /etc/ferroehr/ferroehr.toml
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_A_PORT:-8081}:8080"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # NOT read_only: Compose refuses an inline config in a read-only service,
    # and the inline config below keeps this file free of host bind mounts.
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Node B, a second FerroEHR on the same images, with its own database and its
  # own system_id (decision A44).
  ferroehr-b-postgres:
    image: ghcr.io/rubentalstra/ferroehr-postgres:4.3.1@sha256:17d5772dba1c6689fccb1095a8774f3ed636f4968256a37fc505207ca75a99b9
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${FERROEHR_POSTGRES_PASSWORD:-postgres}
      PG_INIT_USER: ferroehr
      PG_INIT_PASSWORD: ferroehr
      PG_INIT_DB: ferroehr
    volumes:
      - ferroehr-b-pgdata:/var/lib/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferroehr -d ferroehr"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ferroehr-b:
    image: ghcr.io/rubentalstra/ferroehr:4.3.1@sha256:b64f752aefe010629191f8c1d990d286c6ed28a62e457300a237a596f1116ac6
    restart: unless-stopped
    depends_on:
      ferroehr-b-postgres:
        condition: service_healthy
    environment:
      FERROEHR__DB__URL: postgres://ferroehr:ferroehr@ferroehr-b-postgres:5432/ferroehr
      FERROEHR__SERVER__SYSTEM_ID: node-b.quickstart.local
      FERROEHR__LOG__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
    configs:
      - source: ferroehr-config
        target: /etc/ferroehr/ferroehr.toml
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_B_PORT:-8082}:8080"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

configs:
  # FerroEHR's quickstart configuration, shared by both nodes and inline so this
  # file needs no bind mount (`$` is escaped as `$$` against Compose
  # interpolation). The Basic-auth user is ferroehr / ferroehr (the hash is
  # Argon2id of "ferroehr"): development credentials only.
  ferroehr-config:
    content: |
      [server]
      bind = "0.0.0.0:8080"

      [auth]
      enabled = true

      [[auth.basic.users]]
      username = "ferroehr"
      password_hash = "$$argon2id$$v=19$$m=19456,t=2,p=1$$ZmVycm9laHJEZXZTYWx0$$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
      roles = ["ADMIN", "USER"]

      [authz.rbac]
      enabled = false

volumes:
  ferroehr-a-pgdata:
  ferroehr-b-pgdata:
