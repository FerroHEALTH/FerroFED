[package]
name = "openehr-federation"
description = "The openEHR Federation Tier with AQL specification: the federation wire types held to the published schemas, the AQL rewrite with identifier hygiene (feature `aql`) and the federated result merge (feature `merge`)"
# The crate line starts above the 0.0.0 name reservation on crates.io
# (docs/VERSIONS.md).
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/openehr-federation"
readme = "README.md"
keywords = ["openehr", "federation", "aql", "health", "ehr"]
categories = ["science", "encoding"]
# The workspace switch decides whether this crate is publishable
# (docs/architecture.md section 11); include is the packaged content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

# One crate per specification, one feature per layer (docs/architecture.md
# section 11, decision A34). The wire types are always on.
[features]
# The section 7 AQL rewrite and identifier hygiene on the openEHR AQL tree (#35).
aql = ["dep:openehr-query", "dep:openehr-base"]
# The section 9 to 11 merge over node result sets (#52).
merge = ["dep:openehr-rm"]

[dependencies]
openehr-base = { workspace = true, optional = true }
openehr-its = { workspace = true, features = ["rest"] }
openehr-query = { workspace = true, optional = true }
openehr-rm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
ferrofed-testkit.workspace = true
jsonschema.workspace = true
proptest.workspace = true

[lints]
workspace = true
