[package]
name = "ferrofed-identity"
description = "The identity roles of the Federation Tier as traits (resolver, localizer, directory, consent pre-filter, onward authentication) and the patient reference carrier, with no FHIR and no transport"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrofed-identity"
readme = "README.md"
keywords = ["openehr", "federation", "aql", "healthcare"]
categories = ["science"]
# The workspace switch decides whether this crate is publishable
# (docs/architecture.md section 11); include is the packaged content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
async-trait.workspace = true
ferrofed-registry.workspace = true
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
