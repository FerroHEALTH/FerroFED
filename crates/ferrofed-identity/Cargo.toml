[package]
name = "ferrofed-identity"
description = "The identity roles of the Federation Tier as traits (resolver, localizer, directory, consent pre-filter, onward authentication) and the patient reference carrier, with no FHIR and no transport"
# 0.0.0 is the placeholder of a member with no crate line yet (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrofed-identity"
readme = "README.md"
keywords = ["openehr", "federation", "aql", "healthcare"]
categories = ["science"]
# The workspace switch decides whether this crate is publishable
# (docs/architecture.md section 11); include is the packaged content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]

[dev-dependencies]

