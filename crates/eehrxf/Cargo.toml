[package]
name = "eehrxf"
description = "The European interoperability software component of an EHR system under Regulation (EU) 2025/327: the format-neutral dataset model of the priority categories read from the Xt-EHR EHDS logical models, and the European electronic health record exchange format in FHIR R4, mapped from openEHR by FHIRconnect"
# The name is not reserved on crates.io yet, and it must be claimed before the
# `publish` switch is turned on (no specification governs this: our own design).
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/eehrxf"
readme = "README.md"
keywords = ["ehds", "eehrxf", "fhir", "openehr", "health"]
categories = ["science"]
# The workspace switch decides whether this crate is publishable
# (no specification governs this: our own design); include is the packaged
# content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

# One crate for the interoperability component the Regulation defines, with one
# feature per priority category and one per serialisation (no specification
# governs this: our own design). The crate depends on nothing in FerroFED and
# on no logging component, so the two harmonised components stay independent
# of each other.
[features]
# Article 14(1)(a), patient summaries.
patient-summary = []
# Article 14(1)(b), electronic prescriptions.
prescription = []
# Article 14(1)(c), electronic dispensations.
dispensation = []
# Article 14(1)(d), medical imaging studies and related imaging reports.
imaging = []
# Article 14(1)(e), medical test results, including laboratory results.
laboratory = []
# Article 14(1)(f), discharge reports.
discharge = []
# The exchange format in FHIR R4: the R4 resources the serialisation writes,
# with no openEHR crate, so the dataset and serialisation layers stay
# openEHR-free.
fhir-r4 = [
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
]
# The mapping from openEHR compositions to the FHIR R4 exchange format, run in
# process by the FHIRconnect 1.0.0 engine, which writes R4 alone.
openehr = [
  "fhir-r4",
  "dep:fhirconnect",
  "dep:openehr-mapping-core",
]

[dependencies]
fhir-types = { workspace = true, optional = true }
fhirconnect = { workspace = true, optional = true }
flate2.workspace = true
openehr-mapping-core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The property that a package read twice gives the same model, over shuffled
# archive orders.
proptest.workspace = true

[lints]
workspace = true
