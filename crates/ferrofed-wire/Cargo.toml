[package]
name = "ferrofed-wire"
description = "The federation wire additions of the Federation Tier with AQL specification: `meta.federation`, the endpoint status vocabulary and the federation headers, as typed carriers held to the published schemas"
# 0.0.0 is the placeholder of a member with no crate line yet (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrofed-wire"
readme = "README.md"
keywords = ["openehr", "federation", "aql", "healthcare"]
categories = ["science"]
# The workspace switch decides whether this crate is publishable
# (docs/architecture.md section 11); include is the packaged content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
openehr-its = { workspace = true, features = ["rest"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
ferrofed-testkit.workspace = true
jsonschema.workspace = true
proptest.workspace = true

[lints]
workspace = true
