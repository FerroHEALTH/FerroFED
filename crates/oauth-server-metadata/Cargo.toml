[package]
name = "oauth-server-metadata"
description = "OAuth 2.0 Authorization Server Metadata (RFC 8414): the issuer identifier, the well-known metadata URL, and the checks a client holds a metadata document to"
# The crate line starts above the 0.0.0 name reservation on crates.io (no
# specification governs this: our own design).
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oauth-server-metadata"
readme = "README.md"
keywords = ["oauth", "rfc8414", "metadata", "authorization", "issuer"]
categories = ["authentication", "web-programming"]
# The workspace switch decides whether this crate is publishable
# (no specification governs this: our own design); include is the packaged
# content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

# One crate for RFC 8414, with no feature: every caller reads the issuer and
# its metadata the same way. The crate depends on nothing in FerroFED.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[lints]
workspace = true
