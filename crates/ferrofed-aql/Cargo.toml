[package]
name = "ferrofed-aql"
description = "The AQL rewrite of the Federation Tier: the patient carrier consumed at the gateway and each node query rewritten to its own `ehr_id`, as transformations of the openEHR AQL syntax tree with no I/O"
# 0.0.0 is the placeholder of a member with no crate line yet (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrofed-aql"
readme = "README.md"
keywords = ["openehr", "federation", "aql", "healthcare"]
categories = ["science"]
# The workspace switch decides whether this crate is publishable
# (docs/architecture.md section 11); include is the packaged content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]

[dev-dependencies]
ferrofed-testkit.workspace = true

[lints]
workspace = true
