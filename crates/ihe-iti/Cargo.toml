[package]
name = "ihe-iti"
description = "The IHE IT Infrastructure (ITI) profiles: PIXm (ITI-83), PDQm (ITI-78, ITI-119), mCSD (ITI-90, ITI-91), PMIR (ITI-93, ITI-94) and XCPD (ITI-55), one feature per profile, with their audit records written through ihe-atna"
# The crate line starts above the 0.0.0 name reservation on crates.io (no
# specification governs this: our own design).
version = "0.0.39"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ihe-iti"
readme = "README.md"
keywords = ["ihe", "fhir", "pixm", "mcsd", "health"]
categories = ["api-bindings", "science"]
# The workspace switch decides whether this crate is publishable
# (no specification governs this: our own design); include is the packaged
# content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

# One crate for the IHE ITI Technical Framework, one feature per profile
# (no specification governs this: our own design). The crate depends on nothing
# in FerroFED, and only `xcpd` may ever carry the SOAP 1.2, HL7 v3 and SAML
# XUA stack.
[features]
# PIXm, the patient identifier cross-reference (ITI-83, #42): the HTTP client,
# the FHIR R4 `terminology` root set for Parameters and OperationOutcome, and
# the redacting secret type the identifiers travel in.
pixm = [
  "dep:ihe-atna",
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/terminology",
  "dep:http",
  "dep:reqwest",
  "dep:secrecy",
  "dep:serde_json",
  "dep:thiserror",
  "dep:url",
]
# PDQm, the patient demographics query and match (ITI-78, #119; ITI-119, #487):
# the HTTP client, the FHIR R4 `resources` root set for the Patient resources
# a search or a match answers with and the Parameters a match posts, and the
# redacting secret type the demographics travel in.
pdqm = [
  "dep:ihe-atna",
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
  "dep:http",
  "dep:reqwest",
  "dep:secrecy",
  "dep:serde_json",
  "dep:thiserror",
  "dep:url",
]
# mCSD, the care services directory (ITI-90, ITI-91): the FHIR R4 `resources`
# root set for the Organization and Endpoint resources a directory publishes
# (#74), and the HTTP client of the ITI-90 searches and the ITI-91 history
# (#86).
mcsd = [
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
  "dep:http",
  "dep:reqwest",
  "dep:serde_json",
  "dep:thiserror",
  "dep:url",
]
# PMIR, the patient master identity registry (ITI-93, ITI-94, #147): the HTTP
# client of the ITI-94 subscription, the FHIR R4 `resources` root set for the
# Subscription, the message Bundle, its MessageHeader and the Patient resources
# an ITI-93 feed carries, and the redacting secret type the identifiers travel
# in.
pmir = [
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
  "dep:http",
  "dep:reqwest",
  "dep:secrecy",
  "dep:serde_json",
  "dep:thiserror",
  "dep:url",
]
# XCPD, cross-community patient discovery (ITI-55, #85): the HTTP client the
# SOAP 1.2 envelope travels on, the XML reader and writer of the envelope and
# the HL7 v3 messages, the message and query ids, the creation time, the
# redacting secret type the identifiers travel in, and the timer that bounds
# an exchange's audit record by the exchange's timeout. The SAML XUA assertion is
# supplied by the caller and embedded as written, so no signing crate is
# compiled.
xcpd = [
  "dep:ihe-atna",
  "dep:async-trait",
  "dep:http",
  "dep:jiff",
  "dep:quick-xml",
  "dep:reqwest",
  "dep:secrecy",
  "dep:thiserror",
  "dep:tokio",
  "dep:url",
  "dep:uuid",
]
# ATNA (ITI-20, #418): with `xcpd`, the ITI-55 audit message, written
# through the ATNA types of the published `ihe-atna` crate, which carries the
# DICOM audit message, the syslog transport, the spool and the forwarder.
atna = ["dep:ihe-atna", "ihe-atna/atna"]
# BALP (#486): with `pixm`, `pdqm`, `mcsd` or `pmir`, that profile's audit
# records, the FHIR R4 AuditEvent of the Basic Audit Log Patterns written
# through `ihe-atna`, and the time an audited exchange's record is stored
# within (module `recording`).
balp = [
  "dep:ihe-atna",
  "ihe-atna/balp",
  "dep:async-trait",
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
  "dep:http",
  "dep:jiff",
  "dep:reqwest",
  "dep:secrecy",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
  "dep:url",
]

[dependencies]
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
fhir-types = { workspace = true, optional = true }
ihe-atna = { workspace = true, optional = true }
http = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls"] }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, optional = true, features = ["tls12", "aws_lc_rs"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
