#
# The gateway configuration of the compose.yaml quickstart. It federates the
# four nodes of registry.toml and sends each FerroEHR's quickstart Basic-auth
# user: development credentials, NOT for anything real.
#
# A development profile: the gateway resolves each patient through the
# quickstart's FerroPIX, the patient index compose.yaml runs beside it, as a
# PIXm Consumer (ITI-83). FerroFED keeps no patient index of its own.
# docker/quickstart/patients.tsv names the synthetic patients; the compose
# `ferropix-seed` service feeds them to FerroPIX and scripts/quickstart/seed.sh
# creates their EHRs at the nodes, so the two never disagree.
#
# The nodes and FerroPIX are reached over plain http inside the Docker
# network, which only the development profile allows for a credential: the
# gateway starts and names each credential that travels unencrypted in its
# banner and its log.

profile = "development"

# compose.yaml sets FERROFED__SERVER__LISTEN. On SIGTERM the listener closes
# at once, the requests in flight get the 30-second request timeout to
# finish, and the bindings then get 5 seconds to stop their processes;
# compose.yaml's stop_grace_period outlasts all three, and
# scripts/checks/release-compose.sh holds it to them.
[server]
drain_delay_ms = 0
shutdown_timeout_ms = 30000
bindings_drain_timeout_ms = 5000

[registry]
document = "/etc/ferrofed/registry.toml"

[federation]
# The federation's own identifier, which OPTIONS / names (§7a.2, N30).
id = "quickstart"
per_node_timeout_ms = 10000
overall_timeout_ms = 25000
# No localizer is configured, so every member's cross-reference decides where
# a patient query goes (the ask-all node selection of the specification's
# reference flow, Variant B).
node_selection = "ask-all"

# Every caller authenticates (§13.1, N25). The quickstart trusts one
# development issuer, whose key set scripts/quickstart/token.sh writes on its
# first run into docker/quickstart/issuer/, which compose.yaml mounts here:
# development keys, NOT for anything real. The gateway reads the set when a
# token first needs it, so the key can be made after `docker compose up`.
# The issuer is an https URL under the reserved .invalid domain (RFC 2606):
# an identifier the gateway never calls, since the key set is a file.
[auth]
issuer = "https://quickstart-issuer.ferrofed.invalid"
audience = ["ferrofed-quickstart"]
jwks_file = "/etc/ferrofed/issuer/jwks.json"

# The gateway's own signing key, P-384 (ES384) here; a P-256 key signs
# ES256. Every request to a node carries the caller's identity in an
# openEHR-federation-client token signed with it (§13.1, N24), and the
# gateway publishes its public half at jwks_uri.
# scripts/quickstart/signing-key.sh writes it into docker/quickstart/signing/
# before the first `docker compose up`, which compose.yaml mounts here: a
# development key, NOT for anything real. The FerroEHR nodes of the
# quickstart do not verify the token; a node that does fetches the key set
# from jwks_uri, the gateway's address on the compose network.
[signing]
key_file = "/etc/ferrofed/signing/signing-key.pem"
jwks_uri = "http://ferrofed:8080/.well-known/jwks.json"

[credentials."node-a-query"]
user = "ferroehr"
password = "ferroehr"

[credentials."node-b-query"]
user = "ferroehr"
password = "ferroehr"

[credentials."node-c-query"]
user = "ferroehr"
password = "ferroehr"

[credentials."node-d-query"]
user = "ferroehr"
password = "ferroehr"

# The patient index: FerroPIX's PIXm Manager on the compose network. Each
# member's ehr_ids are one identifier domain there, as
# docker/quickstart/patients.tsv names it, and the gateway asks as FerroPIX's
# PIXm Consumer, a development credential, NOT for anything real.
[[pixm.manager]]
url = "http://ferropix:8080/fhir/"

[pixm.manager.members]
"node-a" = "urn:oid:2.999.2.1"
"node-b" = "urn:oid:2.999.2.2"
"node-c" = "urn:oid:2.999.2.3"
"node-d" = "urn:oid:2.999.2.4"

[pixm.manager.credentials]
user = "ferrofed"
password = "ferrofed-consumer-example"
