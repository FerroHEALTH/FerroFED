#
# The registry document of the compose.yaml quickstart: the two member CDRs
# the gateway federates, two FerroEHR instances as node A and node B, each
# reached on the Compose network at its ITS-REST API root (the §12b.1
# registry entry, N21; no specification governs the document format: our own
# design). Each system_id is the one compose.yaml configures the node to
# stamp. Every name here is quickstart-local.

[[organisation]]
id = "org-a"
name = "Node A (FerroEHR)"

[[organisation]]
id = "org-b"
name = "Node B (FerroEHR)"

[[node]]
id = "node-a"
organisation = "org-a"
system_id = "node-a.quickstart.local"

[[node]]
id = "node-b"
organisation = "org-b"
system_id = "node-b.quickstart.local"

[[endpoint]]
id = "node-a-query"
node = "node-a"
url = "http://ferroehr-a:8080/ferroehr/rest/openehr"
connection_type = "openehr-rest-query"
managing_organisation = "org-a"

[[endpoint]]
id = "node-b-query"
node = "node-b"
url = "http://ferroehr-b:8080/ferroehr/rest/openehr"
connection_type = "openehr-rest-query"
managing_organisation = "org-b"
