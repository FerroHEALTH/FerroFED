[package]
name = "ferrofed-console"
description = "The FerroFED Console, the operator console: a Leptos app the server draws and the browser hydrates whole, and a backend-for-frontend over the gateway's public surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The application is never published, whatever the workspace switch says.
publish = false

# One crate, two halves (the Leptos book, server-side rendering): the rlib
# feeds the server binary and the cdylib is the WebAssembly bundle that
# hydrates the whole page. cargo-leptos builds the cdylib for wasm32 and the
# binary for the host.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ferrofed-console"
path = "src/main.rs"

# Both halves on every target. The server half and the browser half are
# chosen by target rather than by Cargo feature, so `--all-features` over the
# workspace can never turn both on at once; a target dependency's features
# apply only to a build for that target (the Cargo reference, resolver
# version 2 and later). No specification governs this: our own design.
[dependencies]
# The whole page hydrates in the browser (FerroUI `docs/consoles.md`, "How a
# console builds"): the server draws it, the browser takes it over, and every
# page after the first is drawn in the browser, its code loaded per lazy
# route. Neither half turns on the `leptos` feature `islands`.
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# The state the server read and every page's reads cross to the browser as
# JSON, through serde.
serde.workspace = true
serde_json.workspace = true
# The FerroHEALTH components every page is drawn with, their stylesheet and
# their icons, in both halves.
ferrohealth-ui.workspace = true
# The console's own string catalogs under locales/, embedded in both halves,
# so a page drawn in the browser speaks as the server's does.
fluent-templates.workspace = true
# The gateway's operator reports and configuration resources a page draws,
# and the `Secret` and `WriteOnly` its forms hold, in both halves.
ferrofed-registry.workspace = true
ferrohealth-secret.workspace = true
# The gateway's self-description and federation metadata (§7a.2, §11) a page
# draws, and the ITS-REST stored query definition and query parameters.
openehr-federation.workspace = true
openehr-its.workspace = true
# The times of an incident and of a clear, compared to mark the incident
# resolved, and the wall clock the countdown of a revision awaiting its
# confirmation starts from.
jiff.workspace = true
# A page's answer status, set on the server and named in both halves.
http.workspace = true
thiserror.workspace = true
# The words of a find, read from the query string.
url.workspace = true
# A route parameter decoded from the address path.
percent-encoding.workspace = true
# The settings a credential or a binding section holds, read and written as
# TOML on the configuration page.
toml.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { workspace = true, features = ["hydrate"] }
# The browser's clock, which a relative time and a countdown read
# (jiff's `js` feature; wasm32-unknown-unknown has no system clock).
jiff = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A secret the operator types into a form, zeroed when dropped.
secrecy.workspace = true
# The per-request script nonce of the Content-Security-Policy rides `nonce`.
leptos = { workspace = true, features = ["ssr", "nonce"] }
leptos_axum.workspace = true
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
# The random session ids, PKCE verifiers and states, and the SHA-256 of the
# PKCE challenge (RFC 7636 §4.2), from the crypto library rustls already
# builds on.
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
cookie.workspace = true
# The configuration loader, the command line, the health routes and their
# lifecycle, the drain, the healthcheck, the console's browser security
# headers and same-origin check, and the console log of FerroHEALTH/FerroSYS
# (#1445), which every FerroHEALTH console runs on.
ferrohealth-config.workspace = true
ferrohealth-health = { workspace = true, features = ["registry"] }
ferrohealth-server = { workspace = true, features = ["console"] }
ferrohealth-telemetry.workspace = true
# Each request's body is read up to its limit before anything else reads it.
http-body-util.workspace = true
# The ID Token of a sign-in, verified against the provider's JWK Set
# (OpenID Connect Core 1.0 §3.1.3.7).
jsonwebtoken.workspace = true
# The ITS-REST client the gateway is called through.
openehr-its = { workspace = true, features = ["rest-client"] }
# The client of the OpenID Provider, the one openehr-its already brings in.
reqwest.workspace = true
# `sync` holds one refresh of a session's access token at a time.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# The site bundle is served brotli- or gzip-compressed, as the request's
# Accept-Encoding chooses.
tower-http = { workspace = true, features = ["compression-br", "compression-gzip"] }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The log lines a test captures and reads.
tracing-subscriber.workspace = true
# The test OpenID Provider: an issuer whose key pair is generated at run
# time, so no private key is committed, and the ID Tokens it signs.
ferrofed-testkit.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
serde_json.workspace = true
# The reader a server function reads a form's fields with.
serde_qs.workspace = true
tempfile.workspace = true
# A request body that stalls is timed out on a paused clock.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }
# The frames of a request body a test sends chunked, breaking off or stalling.
hyper.workspace = true
tower.workspace = true
wiremock.workspace = true

[lints]
workspace = true

# cargo-leptos: the site bundle (the WebAssembly and its JavaScript glue)
# under target/site, the server binary beside it; the server serves the
# stylesheet itself.
[package.metadata.leptos]
output-name = "ferrofed-console"
site-root = "target/site"
site-pkg-dir = "pkg"
# Copied into the site root as it stands: the brand favicon, which a browser
# asks for at /favicon.ico on every first page (#608).
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
lib-profile-release = "wasm-release"
# A dev build keeps its component types, as the server half does, so the
# bundle hydrates the pages the server rendered.
disable-erase-components = true
