[package]
name = "ferrofed-console"
description = "The FerroFED Console, the operator console: pages the server draws whole with FerroUI's components, and a backend-for-frontend over the gateway's public surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The application is never published, whatever the workspace switch says.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrofed-console"
path = "src/main.rs"

[dependencies]
# The FerroHEALTH components every page is drawn with, their stylesheet,
# their icons and their script modules, served by the library's own asset
# router (FerroUI `docs/consoles.md`, "How a console builds").
ferrohealth-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
# The console's own string catalogs under locales/.
fluent-templates.workspace = true
# The gateway's operator reports and configuration resources a page draws,
# and the `Secret` and `WriteOnly` its forms hold.
ferrofed-operator-api.workspace = true
ferrofed-registry.workspace = true
ferrohealth-secret.workspace = true
ferrohealth-session = { workspace = true, features = ["axum"] }
ferrohealth-smart = { workspace = true, features = ["oidc"] }
# The gateway's self-description and federation metadata (§7a.2, §11) a page
# draws, and the ITS-REST stored query definition and query parameters, with
# the client the gateway is called through.
openehr-federation.workspace = true
openehr-its = { workspace = true, features = ["rest-client"] }
# The times of an incident and of a clear, compared to mark the incident
# resolved, and the wall clock the countdown of a revision awaiting its
# confirmation starts from.
jiff.workspace = true
http.workspace = true
thiserror.workspace = true
# The words of a find and a posted form's fields, read as the browser
# encodes them.
url.workspace = true
# A route parameter decoded from the address path.
percent-encoding.workspace = true
# The settings a credential or a binding section holds, read and written as
# TOML on the configuration page.
toml.workspace = true
# A secret the operator types into a form, zeroed when dropped.
secrecy.workspace = true
axum.workspace = true
clap.workspace = true
# The configuration loader, the command line, the health routes and their
# lifecycle, the drain, the healthcheck, the console's browser security
# headers and same-origin check, and the console log of FerroHEALTH/FerroSYS
# (#1445), which every FerroHEALTH console runs on.
ferrohealth-config.workspace = true
ferrohealth-health = { workspace = true, features = ["registry"] }
ferrohealth-server = { workspace = true, features = ["console"] }
ferrohealth-telemetry.workspace = true
# Each request's body is read up to its limit before anything else reads it.
http-body-util.workspace = true
reqwest.workspace = true
# The request's visit rides a task-local beside the handler that draws it.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# The S256 code challenge a test computes from the verifier the token request
# carries (RFC 7636 §4.2), and a published `oct` key.
aws-lc-rs.workspace = true
base64.workspace = true
# The log lines a test captures and reads.
tracing-subscriber.workspace = true
# The manual clock a test counts session and sign-in lifetimes on, so a
# lifetime of a second never depends on where the wall clock's second falls.
ferrohealth-session = { workspace = true, features = ["axum", "test-clock"] }
# The test OpenID Provider: an issuer whose key pair is generated at run
# time, so no private key is committed, and the ID Tokens it signs.
ferrofed-testkit.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# A request body that stalls is timed out on a paused clock.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }
# The frames of a request body a test sends chunked, breaking off or stalling.
hyper.workspace = true
tower.workspace = true
wiremock.workspace = true

[lints]
workspace = true
