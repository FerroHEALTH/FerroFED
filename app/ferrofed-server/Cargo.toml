[package]
name = "ferrofed-server"
description = "The FerroFED server: the openEHR federation gateway behind one ITS-REST facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The application is never published, whatever the workspace switch says.
publish = false

# A thin main.rs over a testable lib.rs (the Rust book, ch. 12.3, "Separation
# of Concerns for Binary Projects").
[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrofed"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
# The federated query (#38): the registry, the resolver seam, the rewrite, and
# the dispatch and fan-out, wired behind POST {base}/v1/query/aql.
ferrofed-engine.workspace = true
ferrofed-identity.workspace = true
ferrofed-registry.workspace = true
# The version uid a follow-up read names, read for its creating_system_id
# (§12.3, #64).
openehr-base.workspace = true
openehr-federation = { workspace = true, features = ["aql"] }
openehr-its = { workspace = true, features = ["rest", "rest-client"] }
openehr-query.workspace = true
http.workspace = true
jiff.workspace = true
redb.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
ferrofed-testkit.workspace = true
jsonschema.workspace = true
wiremock.workspace = true
# The shutdown and wire-capture cases drive a real socket, so they need a real
# HTTP client.
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "test-util"] }
tower.workspace = true

[lints]
workspace = true
