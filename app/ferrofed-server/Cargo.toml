[package]
name = "ferrofed-server"
description = "The FerroFED server: the openEHR federation gateway behind one ITS-REST facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The application is never published, whatever the workspace switch says.
publish = false

# A thin main.rs over a testable lib.rs (the Rust book, ch. 12.3, "Separation
# of Concerns for Binary Projects").
[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrofed"
path = "src/main.rs"

[features]
# Every binding is on by default, so the shipped binary, the image and every
# test carry them all; a build drops one with --no-default-features and the
# features it keeps (#489).
default = ["binding-ihe", "binding-nl"]
# The IHE binding of Annex A: the PIXm resolver, the PDQm demographics step,
# the XCPD localizer, the mCSD care services directory, the PMIR identity feed
# and the ATNA and BALP audit trail they record through (src/binding/ihe).
binding-ihe = ["dep:ihe-iti", "ferrofed-identity/ihe", "ehds-logging/balp"]
# The Dutch binding of Annex B: the NVI localizer, the Mitz consent
# pre-filter, the LRZa URAs they read, and the Nuts grant (src/binding/nl).
binding-nl = ["dep:nl-generic-functions", "ferrofed-identity/nl", "ferrofed-engine/nl"]
# The PostgreSQL backend of the stored-query registry, for several replicas
# sharing one store (#268). Off by default, so a single gateway carries no
# PostgreSQL client (no specification governs this: our own design).
postgres = [
  "dep:tokio-postgres",
  "dep:tokio-postgres-rustls",
  "dep:rustls",
  "dep:rustls-platform-verifier",
]

[dependencies]
anyhow.workspace = true
# The constant-time comparison of the PMIR feed token (#147), the keyed
# caller references of the security log (#500), and the SHA-256 a conformance
# run checks its synthetic seed files against (#546), from the crypto library
# the engine already uses.
aws-lc-rs.workspace = true
axum.workspace = true
clap.workspace = true
# The European logging component (#623): the access record of every access
# to patient data, its category map, and with binding-ihe the record written
# as a BALP AuditEvent to the audit spool.
ehds-logging.workspace = true
# The federated query (#38): the registry, the resolver seam, the rewrite, and
# the dispatch and fan-out, wired behind POST {base}/v1/query/aql.
ferrofed-engine.workspace = true
ferrofed-identity.workspace = true
ferrofed-registry.workspace = true
# The ITI-20 audit repository of the XCPD localizer (#418): its syslog
# header, spool, connection and forwarder, and the PMIR
# ITI-94 subscriber and ITI-93 feed reader of the identity feed (#147), and
# the ITI-83 invocation each [[pixm.manager]] names (#494); part of the IHE
# binding.
ihe-iti = { workspace = true, optional = true, features = ["atna", "balp", "pixm", "pmir", "xcpd"] }
# The Nuts grant of an endpoint's onward credentials, Annex B §B.4 (#88),
# built from the configuration, and the BSN naming systems the NVI and Mitz
# configuration is checked against (GF-Identification, behind `nvi`); part of
# the Dutch binding.
nl-generic-functions = { workspace = true, optional = true, features = ["nuts-auth", "nvi"] }
# The RFC 8414 issuer checks of an OAuth 2.0 or FAPI 2.0 grant's issuer
# audience (#551).
oauth-server-metadata.workspace = true
# The version uid a follow-up read names, read for its creating_system_id
# (§12.3, #64).
openehr-base.workspace = true
openehr-federation = { workspace = true, features = ["aql"] }
openehr-its = { workspace = true, features = ["rest", "rest-client"] }
openehr-query.workspace = true
# The SMART on openEHR scope grammar every caller's `scope` claim is read with
# (#80; ITS-REST SMART on openEHR, master08).
openehr-sdt.workspace = true
# The RFC 7519 verification of every caller's access token (#80).
jsonwebtoken.workspace = true
# The metrics surface (#281): one MeterProvider, the Prometheus pull reader on
# the admin listener and the optional OTLP push.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-prometheus.workspace = true
opentelemetry-otlp.workspace = true
prometheus.workspace = true
# The trace export (#353): the gateway's own spans as OpenTelemetry spans,
# over the same OTLP exporter crate as the metrics push.
tracing-opentelemetry.workspace = true
# The EHR_STATUS of the test EHRs an admission check creates (§12b.1, #79).
openehr-rm.workspace = true
# The healthcheck job asks the server beside it for its readiness, over the
# HTTP client the node dispatch already brings in; the shutdown and
# wire-capture tests drive a real socket with it too.
reqwest.workspace = true
http.workspace = true
jiff.workspace = true
redb.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
ferrofed-testkit.workspace = true
jsonschema.workspace = true
# The JWK Set the gateway publishes, read as the onward tests verify it (#81).
jsonwebtoken.workspace = true
# The in-memory span exporter the trace tests read every exported span from
# (#353).
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# The OTLP messages the testkit's collector received, read by the export
# test over the wire (#437).
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace"] }
wiremock.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "test-util", "process"] }
tower.workspace = true

[lints]
workspace = true
