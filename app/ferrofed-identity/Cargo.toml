[package]
name = "ferrofed-identity"
description = "The identity roles of the Federation Tier as traits (resolver, localizer, directory, consent pre-filter, onward authentication), the patient reference carrier, and the adapters that plug the ihe-iti and nl-generic-functions clients into them"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# FerroFED's own glue lives under app/ and is never published
# (no specification governs this: our own design).
publish = false

[features]
# The adapters of the IHE binding (Annex A): PIXm, PDQm, XCPD, the mCSD
# directory and the registry document in FHIR form it reads, PMIR, and the
# ATNA and BALP audit recorders. The server's binding-ihe turns it on.
ihe = ["dep:ihe-iti"]
# The adapters of the Dutch binding (Annex B): NVI and Mitz, with the LRZa
# URAs they read. The server's binding-nl turns it on.
nl = ["dep:nl-generic-functions"]

[dependencies]
async-trait.workspace = true
ferrofed-registry.workspace = true
http.workspace = true
# The PIXm resolver (#43) over the ITI-83 client of the binding crate, the
# registry document in FHIR form (#74) over its mCSD directory reader, and the
# XCPD localizer (#85) over its ITI-55 client, with its audit messages sent
# over ITI-20 (#418), and the identity lifecycle (#147) over its PMIR ITI-94
# subscriber and ITI-93 feed reader, and the demographics step (#487) over its
# PDQm ITI-78 and ITI-119 client.
ihe-iti = { workspace = true, optional = true, features = ["atna", "balp", "mcsd", "pdqm", "pixm", "pmir", "xcpd"] }
# The instant an ITI-91 refresh asks from, read off the directory's `Date`
# (#86), and the time an ITI-20 syslog message is written at (#418).
jiff.workspace = true
# The NVI localizer (#87) over the GF-Localization client of the Dutch binding
# crate (Annex B §B.1), its custodians read by the LRZa rules from the
# directory (Annex B §B.2).
nl-generic-functions = { workspace = true, optional = true, features = ["lrza", "mitz", "nvi"] }
# The Authorization value of the credentials for an IHE FHIR server,
# composed as the node client composes it (RFC 7617 §2, RFC 6750 §2.1).
openehr-its = { workspace = true, features = ["rest-client"] }
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# The mock server that drops off the runtime.
ferrofed-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
toml.workspace = true
wiremock.workspace = true

[lints]
workspace = true
