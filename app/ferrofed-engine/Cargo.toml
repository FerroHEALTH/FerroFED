[package]
name = "ferrofed-engine"
description = "The federation engine: dispatch and fan-out to each node over ITS-REST, the per-node and overall budgets, the completeness decision and the outbound identifier-hygiene gate; follow-up routing on the creating system id is planned"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# FerroFED's own glue lives under app/ and is never published
# (no specification governs this: our own design).
publish = false

[dependencies]
ferrofed-registry.workspace = true
# The typed `ehr_id` a node query is scoped to (#45).
openehr-base.workspace = true
openehr-federation = { workspace = true, features = ["merge"] }
# The node client: every request to a node is built by its runtime, never in
# this crate (#34).
openehr-its = { workspace = true, features = ["rest-client"] }
# The outbound gate reads the AQL text with the printer's own string escaping
# (#45).
openehr-query.workspace = true
# The identifiers the gate withholds are never printed (#45).
secrecy.workspace = true
http.workspace = true
thiserror.workspace = true
# One task per in-scope node under one deadline (§11.5, N38).
tokio = { workspace = true, features = ["rt", "time"] }
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
ferrofed-testkit.workspace = true
jsonschema.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }
wiremock.workspace = true

[lints]
workspace = true
