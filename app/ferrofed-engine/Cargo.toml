[package]
name = "ferrofed-engine"
description = "The federation engine: dispatch and fan-out to each node over ITS-REST, the per-node and overall budgets, the completeness decision and the outbound identifier-hygiene gate; follow-up routing on the creating system id is planned"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# FerroFED's own glue lives under app/ and is never published
# (no specification governs this: our own design).
publish = false

[dependencies]
# The onward credentials provider the node client asks before each attempt
# (#81).
async-trait.workspace = true
# The SHA-256 of a caller's token, the key of the token-exchange cache, and of
# the access token a DPoP proof binds (#439).
aws-lc-rs.workspace = true
# The base64url of a DPoP proof's `ath`, and of the payload of a caller's token
# the outbound gate reads before an exchange (#439).
base64.workspace = true
ferrofed-registry.workspace = true
# The access token request of the Nuts grant, Annex B §B.4 (#88), and the
# authorization server metadata checks the FAPI 2.0 grant of Annex B §B.4a
# shares with it (#497).
nl-generic-functions = { workspace = true, features = ["nuts-auth", "oauth-metadata"] }
# The typed `ehr_id` a node query is scoped to (#45).
openehr-base.workspace = true
openehr-federation = { workspace = true, features = ["merge"] }
# The node client: every request to a node is built by its runtime, never in
# this crate (#34).
openehr-its = { workspace = true, features = ["rest-client"] }
# The outbound gate reads the AQL text with the printer's own string escaping
# (#45).
openehr-query.workspace = true
# The EHR_STATUS an admission check creates an EHR with, and the EHR it reads
# back (§12b.1, #79).
openehr-rm.workspace = true
# The SMART on openEHR scope an onward token is requested with (#81).
openehr-sdt.workspace = true
# The identifiers the gate withholds are never printed (#45).
secrecy.workspace = true
http.workspace = true
# The wall clock the claims of an onward client assertion are dated by (#81).
jiff.workspace = true
# The ES384 client assertion of the onward grant, and the published JWKS (#81).
jsonwebtoken.workspace = true
# Accept and Content-Type composed from the operation's listed media types
# (#261).
mime.workspace = true
# The certificate a mutual-TLS grant binds its tokens to, read from the PEM
# chain the endpoint presents (RFC 8705 §3.1, #492).
pem.workspace = true
# The claims of an onward client assertion and the token endpoint answer (#81).
serde.workspace = true
# The result cells the versions a node holds are read from (§12.2, #64).
serde_json.workspace = true
thiserror.workspace = true
# One task per in-scope node under one deadline (§11.5, N38), and one onward
# token request per endpoint at a time (#81).
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The onward grant says when a token was obtained and why one was not, never
# the token (#81).
tracing.workspace = true
# The W3C traceparent of each node request, written from the span of that
# request by the W3C Trace Context propagator (#353).
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
ferrofed-testkit.workspace = true
jsonschema.workspace = true
# The HTTP client the Nuts grant's tests hand its client (#88).
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }
wiremock.workspace = true

[lints]
workspace = true
