[package]
name = "ferrofed-operator-api"
description = "The wire documents of the gateway's operator surface and the operator console's configuration resources, which the gateway writes and the console reads"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# FerroFED's own glue lives under app/ and is never published
# (no specification governs this: our own design).
publish = false

[dependencies]
ferrofed-registry.workspace = true
ferrohealth-secret.workspace = true
jiff.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# The documents read back from the JSON they are written as.
serde_json.workspace = true

[lints]
workspace = true
