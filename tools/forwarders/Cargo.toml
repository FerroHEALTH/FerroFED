[package]
name = "forwarders"
description = "Lists the hand-written functions whose whole body forwards to one other call, for the forwarder ratchet; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# A tool crate is never published, whatever the workspace switch says.
publish = false

# Reads source text only: it never depends on a workspace crate, so the
# ratchet builds in seconds and measures any tree it is pointed at.
[dependencies]
anyhow.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[lints]
workspace = true
