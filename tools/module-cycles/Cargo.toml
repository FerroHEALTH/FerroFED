[package]
name = "module-cycles"
description = "Lists the pairs of top-level modules of a crate that import each other outside tests, for the module-cycle guard; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# A tool crate is never published, whatever the workspace switch says.
publish = false

# Reads source text only: it never depends on a workspace crate, so the
# guard builds in seconds and measures any crate it is pointed at.
[dependencies]
anyhow.workspace = true
proc-macro2.workspace = true
syn = { workspace = true, features = ["visit"] }

[lints]
workspace = true
