[package]
name = "ferrofed-testkit"
description = "Test support for the FerroFED suites: the pin-matrix reader, the container harness, the capturing and fault proxy, and the synthetic seed builder; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# A tool crate is never published, whatever the workspace switch says.
publish = false

[dependencies]
# The harness token endpoint (#81) and the test issuer (#80) generate each
# synthetic signing key at run time.
aws-lc-rs.workspace = true
# The `ath` a harness DPoP check compares (#439).
base64.workspace = true
bytes.workspace = true
# The FHIR R4 model of the ITI-104 source, the PIXm Manager stub's fixed
# answers and the PDQm Supplier stub's: `resources` for `Patient`, which a
# test device may compile and the shipped IHE binding does not need yet
# (Annex A).
fhir-types = { workspace = true, features = ["r4", "resources"] }
# The vendored HL7 Europe Patient Summary package the document check reads
# its profiles from (#689).
flate2.workspace = true
tar.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# The ITI-55 Responding Gateway messages of FerroPIX's `ihe-iti`, which the
# stub responding gateway reads its requests and writes its answers with
# (#85, #367).
ihe-iti = { workspace = true, features = ["xcpd"] }
# The test issuer's timestamps (#80), and the clock reading the harness
# directory stamps its answers with (#86).
jiff.workspace = true
# The harness token endpoint verifies each client assertion against the
# published JWK Set (#81), and the test issuer signs its tokens (#80).
jsonwebtoken.workspace = true
# A generated signing key is written as PKCS#8 PEM (#81).
pem.workspace = true
# The in-process OTLP collector (#437): the OTLP trace service, its gRPC
# server, and the async trait the generated service is.
async-trait.workspace = true
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace"] }
# `tls-aws-lc` serves the collector over TLS with a client certificate (#644).
tonic = { workspace = true, features = ["server", "router", "tls-aws-lc"] }
# The harness audit repository (#418) generates its CA and server
# certificate at run time, so no private key is ever committed, and serves
# syslog over TLS with them.
rcgen.workspace = true
tokio-rustls = { workspace = true, features = ["tls12", "aws_lc_rs"] }
# The identifier systems, extensions and connection type the harness mCSD
# directory writes its members with, as the FHIR form of the registry reads
# them (#1072).
ferrofed-identity = { workspace = true, features = ["ihe"] }
ferrofed-registry.workspace = true
# The RM identifiers the seed's EHR_STATUS names its subject with.
openehr-base.workspace = true
# The canonical JSON writer the seed's EHR_STATUS is written with.
openehr-its = { workspace = true, features = ["json"] }
# The EHR_STATUS a seeded EHR is created with.
openehr-rm.workspace = true
# The proxy's forwarding client and the seed builder's ITS-REST client.
reqwest.workspace = true
# The identifier values of the stub responding gateway's answers (#367).
secrecy.workspace = true
# The configuration text the fixed cross-reference's rows are read from.
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
testcontainers.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The ITI-104 source's request URL.
url.workspace = true
uuid.workspace = true
# The mock server every suite stands its nodes and services up with, held so
# its drop runs off the runtime.
wiremock.workspace = true

[dev-dependencies]
# The harness, as the federation operator of track 11, applies the admission
# check of the gateway and reads the registry's refusal before it admits a
# candidate node (#91), and runs the gateway's node profile checks against
# its CDR products over a node client (#93, #573).
ferrofed-server.workspace = true
# The gateway's own read-only stored queries, which the console's stored-query
# view lists beside the deployment's (#776).
ferrofed-eehrxf.workspace = true
# The ITS-REST query body the node profile's captured queries are read as
# (#739).
openehr-its = { workspace = true, features = ["rest"] }
# The operator console, driven against a running gateway over stub nodes, as
# an operator's browser reaches both (#276).
ferrofed-console.workspace = true
tempfile.workspace = true
# The XCPD client the stub responding gateway is held to (#85), the mCSD
# client the harness directory is held to (#86), and the PMIR subscriber and
# feed reader the harness Patient Identity Registry is held to (#147).
ihe-iti = { workspace = true, features = ["mcsd", "pmir", "xcpd"] }
# Whom a client exchange is made for (`user::OnBehalfOf`), from the family's
# audit library (FerroHEALTH/FerroAUDIT).
ihe-atna.workspace = true
# The browser journeys of the operator console, behind the FERROFED_JOURNEYS
# gate (#608), each through a chromedriver of its own, which tokio starts and
# reads the port of (#1052).
thirtyfour.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync", "process", "io-util"] }

# The browser journeys stop each chromedriver's process group, a Unix
# notion (#1052).
[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true
