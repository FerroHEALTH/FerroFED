[package]
name = "ferrofed-testkit"
description = "Test support for the FerroFED suites: the pin-matrix reader, the container harness, the capturing and fault proxy, and the synthetic seed builder; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# A tool crate is never published, whatever the workspace switch says.
publish = false

[dependencies]
# The harness token endpoint (#81) and the test issuer (#80) generate each
# synthetic signing key at run time.
aws-lc-rs.workspace = true
# The `ath` a harness DPoP check compares (#439).
base64.workspace = true
bytes.workspace = true
# The FHIR R4 model of the harness PIX Manager and its ITI-104 source (#47):
# `resources` for `Patient`, which a test device may compile and the shipped
# IHE binding does not need yet (Annex A).
fhir-types = { workspace = true, features = ["r4", "resources"] }
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# The test issuer's timestamps (#80), and the clock reading the harness
# directory stamps its answers with (#86).
jiff.workspace = true
# The harness token endpoint verifies each client assertion against the
# published JWK Set (#81), and the test issuer signs its tokens (#80).
jsonwebtoken.workspace = true
# A generated signing key is written as PKCS#8 PEM (#81).
pem.workspace = true
# The in-process OTLP collector (#437): the OTLP trace service, its gRPC
# server, and the async trait the generated service is.
async-trait.workspace = true
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace"] }
tonic = { workspace = true, features = ["server", "router"] }
# The harness audit repository (#418) generates its CA and server
# certificate at run time, so no private key is ever committed, and serves
# syslog over TLS with them.
rcgen.workspace = true
tokio-rustls = { workspace = true, features = ["tls12", "aws_lc_rs"] }
# The RM identifiers the seed's EHR_STATUS names its subject with.
openehr-base.workspace = true
# The canonical JSON writer the seed's EHR_STATUS is written with, and the
# ITS-REST query body and RESULT_SET the node profile checks read (#93).
openehr-its = { workspace = true, features = ["json", "rest"] }
# The EHR_STATUS a seeded EHR is created with.
openehr-rm.workspace = true
# The proxy's forwarding client and the seed builder's ITS-REST client.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
testcontainers.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The harness PIX Manager's query-string decoding.
url.workspace = true
uuid.workspace = true
# The mock server every suite stands its nodes and services up with, held so
# its drop runs off the runtime.
wiremock.workspace = true

[dev-dependencies]
# The harness, as the federation operator of track 11, applies the admission
# check of the gateway and reads the registry's refusal before it admits a
# candidate node (#91).
ferrofed-registry.workspace = true
ferrofed-server.workspace = true
# The operator console, driven against a running gateway over stub nodes, as
# an operator's browser reaches both (#276).
ferrofed-viewer.workspace = true
tempfile.workspace = true
toml.workspace = true
# The PIXm client the harness PIX Manager is held to (#42), the XCPD client
# the stub responding gateway is held to (#85), the mCSD client the harness
# directory is held to (#86), and the PMIR subscriber and feed reader the
# harness Patient Identity Registry is held to (#147), and the PDQm client the
# harness PDQm Supplier is held to (#487).
ihe-iti = { workspace = true, features = ["mcsd", "pdqm", "pixm", "pmir", "xcpd"] }
secrecy.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync"] }

[lints]
workspace = true
